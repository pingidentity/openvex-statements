"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected. The vulnerability resides in WSS4J's DERDecoder, used when WSS4J resolves a signature's key reference through a certificate's SubjectKeyIdentifier extension during WS-Security message processing; PingFederate never invokes WSS4J for signature verification or key-reference resolution. All SAML and XML signature validation in PingFederate — including on the WS-Trust endpoints this class of attack would target — is performed by PingFederate's own XmlSignatureVerifier, built on Apache Santuario (xmlsec 2.2.3-p4), which resolves certificates from X509Data/KeyInfo elements rather than WSS4J's DER decoding path. An attacker cannot steer message processing into the affected WSS4J code, so the oversized-allocation condition is unreachable. PingFederate will include the WSS4J upgrade in an upcoming release to clear the scanner finding."},{"id":"CVE-2026-97873","file":"openvex/pingauthorize/CVE-2026-97873.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"The product does not parse encrypted key blobs from untrusted sources, and its password-based encryption uses the PBKDF2 algorithm, which is not part of the affected legacy families, with administrator-configured iteration counts. Therefore it is not affected by the CVE"},{"id":"CX78F40514-81FF","file":"openvex/pingfederate/CX78F40514-81FF.openvex.json","product":"pingfederate","pkg":"commons-collections","sub":"pkg:maven/commons-collections/commons-collections","just":"component_not_present","notes":"PingFederate does not utilize the vulnerable class SetUniqueList.java nor its methods. This is a False Positive."},{"id":"GHSA-72HV-8253-57QQ","file":"openvex/pingaccess/GHSA-72HV-8253-57QQ.openvex.json","product":"pingaccess","pkg":"jackson-core","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-core","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess does not appear to be vulnerable to GHSA-72hv-8253-57qq. We don’t call any of the async jackson-core parsing classes within our application. Additionally an attacker would first have to gain access to an administrative account to upload any json for parsing."},{"id":"GHSA-72HV-8253-57QQ","file":"openvex/pingauthorize/GHSA-72HV-8253-57QQ.openvex.json","product":"pingauthorize","pkg":"jackson-core","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-core","just":"vulnerable_code_not_in_execute_path","notes":"PingAuthorize does not utilise the vulnerable \"NonBlockingUtf8JsonParserBase\" class, hence it is not vulnerable. However, the Jackson library will be upgraded in version 11.1 (June 2026) of the product to prevent the issue from appearing in future scans."},{"id":"GHSA-72HV-8253-57QQ","file":"openvex/pingfederate/GHSA-72HV-8253-57QQ.openvex.json","product":"pingfederate","pkg":"jackson-core","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-core","just":"component_not_present","notes":"PingFederate processes JSON input using Jackson’s synchronous streaming parser (JsonFactory.createParser) and ObjectMapper APIs, both of which enforce StreamReadConstraints. The non-blocking parser path affected by GHSA-72hv-8253-57qq is not used anywhere in the codebase. Additionally, request bodies are wrapped with length-limiting input streams, providing further protection against large payload-based DoS conditions."},{"id":"GHSA-MHM7-754M-9P8W","file":"openvex/pingfederate/GHSA-MHM7-754M-9P8W.openvex.json","product":"pingfederate","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"component_not_present","notes":"False Positive. Zero uses of @JsonView anywhere — PingFederate doesn't use Jackson's view feature at all. Zero uses of @JsonTypeInfo(include=As.EXTERNAL_PROPERTY) — all 15 existing @JsonTypeInfo usages use As.PROPERTY instead. Since both halves of the trigger condition are absent, the vulnerable code path can't be reached regardless of version."},{"id":"GHSA-R7WM-3CXJ-WFF9","file":"openvex/pingaccess/GHSA-R7WM-3CXJ-WFF9.openvex.json","product":"pingaccess","pkg":"jackson-core","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-core","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess ships jackson-core 2.17.0 (within affected range \u003c2.18.8). The async parser (AsyncInputFeeder/NonBlockingJsonParser) is an explicit opt-in API. Zero references to any async parser entry point found across all PingAccess JARs. Not exploitable."},{"id":"GHSA-R7WM-3CXJ-WFF9","file":"openvex/pingfederate/GHSA-R7WM-3CXJ-WFF9.openvex.json","product":"pingfederate","pkg":"jackson-core","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-core","just":"inline_mitigations_already_exist","notes":"Some versions of PingFederate ship with a vulnerable jackson-core, but the bug only exists on Jackson's non-blocking/async parser path, and an exhaustive search (source, compiled bytecode, and a full-jar dependency scan) found no caller of that API anywhere in PingFederate's own code or its dependency graph. No functional risk today."},{"id":"GHSA-XPW8-RCWV-8F8P","file":"openvex/pingdirectory/GHSA-XPW8-RCWV-8F8P.openvex.json","product":"pingdirectory","pkg":"netty-codec-http2","sub":"pkg:maven/io.netty/netty-codec-http2","just":"component_not_present","notes":"Netty is a transitive dependency of AWS SDK. As discussed in this thread https://github.com/aws/aws-sdk-java-v2/issues/4619, netty is used by the SDK as a client, not a server. Hence, this CVE cannot be exploited."},{"id":"GHSA-XPW8-RCWV-8F8P","file":"openvex/pingfederate/GHSA-XPW8-RCWV-8F8P.openvex.json","product":"pingfederate","pkg":"netty-codec-http2","sub":"pkg:maven/io.netty/netty-codec-http2","just":"vulnerable_code_not_in_execute_path","notes":"PF 12.1 does indeed have version 4.1.84Final. Although this version of Netty has a known vulnerability, PingFederate is not impacted because the issue pertains to servers affected by the HTTP/2 Rapid Reset Attack. PingFederate uses Netty as a client to interact with AWS services, and the vulnerability primarily targets server-side implementations.\n\nPF 12.2 will be shipped with version 4.1.108Final."},{"id":"NONE","file":"openvex/pingdirectory/NONE.openvex.json","product":"pingdirectory","pkg":"freetype","sub":"pkg:generic/freetype@2.10.4-r1","just":"vulnerable_code_not_in_execute_path","notes":"Package will be updated in next PingDirectory docker release"},{"id":"NONE","file":"openvex/pingdirectory/NONE.openvex.json","product":"pingdirectory","pkg":"git","sub":"pkg:generic/git@2.30.2-r0","just":"vulnerable_code_not_in_execute_path","notes":"Package will be updated in next PingDirectory docker release"},{"id":"PRISMA-2021-0182","file":"openvex/pingaccess/PRISMA-2021-0182.openvex.json","product":"pingaccess","pkg":"jetty-server","sub":"pkg:maven/org.eclipse.jetty/jetty-server","just":"component_not_present","notes":"PingAccess does not use Jetty. This is being pulled in by ehcache. PingAccess does not use the rest-management-service which this is a transitive dependency for."},{"id":"PRISMA-2021-0213","file":"openvex/pingagentlessik/PRISMA-2021-0213.openvex.json","product":"pingagentlessik","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"component_not_present","notes":"FALSE POSITIVE. PingFederate and it's integration kits do not serialize or deserialize JsonNode objects using ObjectOutputStream and ObjectInputStream anywhere. Therefore, this is a false positive and this vulnerability does not affect the product."},{"id":"PRISMA-2021-0213","file":"openvex/pingidik/PRISMA-2021-0213.openvex.json","product":"pingidik","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"component_not_present","notes":"FALSE POSITIVE. PingFederate and it's integration kits do not serialize or deserialize JsonNode objects using ObjectOutputStream and ObjectInputStream lse positive. This version of spring-core does not have CRITICAL or HIGH CVEs"},{"id":"VULNDB-238682","file":"openvex/pingauthorize/VULNDB-238682.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"component_not_present","notes":"This is a false positive. This version of spring-core does not have CRITICAL or HIGH CVEs"},{"id":"VULNDB-243999","file":"openvex/pingdirectory/VULNDB-243999.openvex.json","product":"pingdirectory","pkg":"groovy","sub":"pkg:maven/org.apache.groovy/groovy","just":"vulnerable_code_not_in_execute_path","notes":"This VULNDB finding does not appear to have a CVE associated with it, please provide a CVE so we can accurately address your concerns. Version 2.5.16 of groovy is currently schedule for upgrade in version 9.1-GA of the product. As of now, version 2.5.16 of groovy does not have any known CVEs."},{"id":"VULNDB-257660","file":"openvex/pingauthorize/VULNDB-257660.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"component_not_present","notes":"This is a false positive. This version of spring-core does not have CRITICAL or HIGH CVEs"},{"id":"VULNDB-275302","file":"openvex/pingdirectory/VULNDB-275302.openvex.json","product":"pingdirectory","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"This VULNDB finding does not appear to have a CVE associated with it, please provide a CVE so we can accurately address your concerns. Jackson databind is currently schedule for upgrade in version 9.2-EA of the product."},{"id":"VULNDB-286187","file":"openvex/pingauthorize/VULNDB-286187.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"component_not_present","notes":"This is a false positive. This version of spring-core does not have CRITICAL or HIGH CVEs"}]</script>

<script>
const DATA = JSON.parse(document.getElementById('vex-data').textContent);

const JUST_BADGE = {
  component_not_present:                         ['badge-cnp',  'Component Not Present'],
  vulnerable_code_not_in_execute_path:        ['badge-path', 'Code Not in Exec Path'],
  inline_mitigations_already_exist:              ['badge-mit',  'Mitigations Exist'],
  vulnerable_code_cannot_be_controlled_by_adversary: ['badge-adv', 'Not Adversary Controlled'],
};

let sortCol = 'id', sortDir = 1;

function getFiltered() {
  const q     = document.getElementById('q').value.trim().toLowerCase();
  const fProd = document.getElementById('filter-product').value;
  const fJust = document.getElementById('filter-just').value;
  return DATA.filter(r => {
    if (fProd && r.product !== fProd) return false;
    if (fJust && r.just   !== fJust)  return false;
    if (q) {
      const hay = (r.id + ' ' + r.product + ' ' + r.pkg + ' ' + r.sub + ' ' + r.notes).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function sortRows(arr) {
  return [...arr].sort((a, b) => {
    const av = a[sortCol] ?? '', bv = b[sortCol] ?? '';
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });
}

function badge(just) {
  const [cls, label] = JUST_BADGE[just] ?? ['badge-unk', just || '—'];
  return `<span class="badge ${cls}">${label}</span>`;
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function render() {
  const filtered = sortRows(getFiltered());
  const tbody    = document.getElementById('tbody');
  const empty    = document.getElementById('empty-state');
  const label    = document.getElementById('count-label');

  label.textContent = filtered.length === DATA.length
    ? `${DATA.length.toLocaleString()} statements`
    : `${filtered.length.toLocaleString()} of ${DATA.length.toLocaleString()} statements`;

  if (filtered.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = filtered.map(r => `
    <tr>
      <td class="cve-id"><a href="${esc(r.file)}" target="_blank">${esc(r.id)}</a></td>
      <td><span class="tag-product">${esc(r.product)}</span></td>
      <td class="pkg-cell" title="${esc(r.sub)}">${esc(r.pkg)}</td>
      <td>${badge(r.just)}</td>
      <td class="notes-cell" title="Click to expand" onclick="this.classList.toggle('expanded')">${esc(r.notes)}</td>
    </tr>`).join('');
}

document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
    document.querySelectorAll('thead th').forEach(h => h.classList.remove('sorted-asc','sorted-desc'));
    th.classList.add(sortDir === 1 ? 'sorted-asc' : 'sorted-desc');
    render();
  });
});

document.getElementById('q').addEventListener('input', render);
document.getElementById('filter-product').addEventListener('change', render);
document.getElementById('filter-just').addEventListener('change', render);

document.getElementById('btn-reset').addEventListener('click', () => {
  document.getElementById('q').value = '';
  document.getElementById('filter-product').value = '';
  document.getElementById('filter-just').value = '';
  sortCol = 'id'; sortDir = 1;
  document.querySelectorAll('thead th').forEach(h => h.classList.remove('sorted-asc','sorted-desc'));
  render();
});

render();
</script>
</body>
</html>

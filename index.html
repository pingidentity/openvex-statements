<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenVEX Statement Index — Ping Identity</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg:      #0f1117;
    --surface: #181c27;
    --border:  #272d3d;
    --muted:   #3a4255;
    --text:    #dde2ef;
    --dim:     #8892a4;
    --accent:  #4f8ef7;
    --accent2: #7ec8e3;
    --tag-bg:  #1e2435;
    --row-alt: #13161f;
    --hover:   #1d2235;
  }

  body {
    font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, monospace;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0;
    font-size: 13px;
    line-height: 1.5;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 24px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    margin: 0;
    letter-spacing: 0.02em;
  }
  #count-label { color: var(--dim); font-size: 12px; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  input[type=search] {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    padding: 5px 10px;
    width: 280px;
    outline: none;
    transition: border-color .15s;
  }
  input[type=search]:focus { border-color: var(--accent); }
  input[type=search]::placeholder { color: var(--muted); }

  select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    padding: 5px 8px;
    outline: none;
    cursor: pointer;
    transition: border-color .15s;
  }
  select:focus { border-color: var(--accent); }

  button.reset {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    padding: 5px 10px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  button.reset:hover { color: var(--text); border-color: var(--muted); }

  .table-wrap {
    overflow-x: auto;
    padding: 0 24px 24px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--surface);
    color: var(--dim);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th:hover { color: var(--text); }
  thead th.sorted-asc::after  { content: " ↑"; color: var(--accent); }
  thead th.sorted-desc::after { content: " ↓"; color: var(--accent); }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--hover); }

  td { padding: 7px 10px; vertical-align: top; }

  td.cve-id { white-space: nowrap; font-weight: 600; }
  td.cve-id a { color: var(--accent); text-decoration: none; }
  td.cve-id a:hover { text-decoration: underline; }

  .tag-product {
    display: inline-block;
    background: var(--tag-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 7px;
    font-size: 11px;
    color: var(--accent2);
    white-space: nowrap;
  }

  td.pkg-cell {
    color: var(--dim);
    font-size: 12px;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .badge {
    display: inline-block;
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }
  .badge-cnp  { background:#1a2b1a; color:#3ecf8e; border:1px solid #2a4a2a; }
  .badge-path { background:#1a1f2b; color:#4f8ef7; border:1px solid #2a2f4a; }
  .badge-mit  { background:#2b2218; color:#e8a04f; border:1px solid #4a3318; }
  .badge-adv  { background:#2b1a1a; color:#e85f5f; border:1px solid #4a2a2a; }
  .badge-unk  { background:#1e1e1e; color:#888;    border:1px solid #333;    }

  td.notes-cell {
    color: var(--text);
    max-width: 420px;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }
  td.notes-cell.expanded {
    white-space: pre-wrap;
    word-break: break-word;
  }

  #empty-state {
    display: none;
    padding: 60px 24px;
    text-align: center;
    color: var(--dim);
  }
  #empty-state svg { opacity: .3; margin-bottom: 12px; }
</style>
</head>

"sub":"pkg:maven/com.mattbertolini/liquibase-slf4j","just":"vulnerable_code_not_in_execute_path","notes":"PingAuthorize is using the version 4.8.0 of liquibase library which is not affected by CVEs. liquibase-slf4j is a different library and not affected by the same CVE. This is a false positive."},{"id":"CVE-2022-1271","file":"openvex/pingfederate/CVE-2022-1271.openvex.json","product":"pingfederate","pkg":"gnu-gzip-s-zgrep-utility","sub":"pkg:generic/gnu-gzip-s-zgrep-utility","just":"vulnerable_code_not_in_execute_path","notes":"This CVE applies to a component of the underlying OS PingFederate is running on, OS level dependency flaws are not exploitable through the PingFederate application."},{"id":"CVE-2022-1471","file":"openvex/pingaccess/CVE-2022-1471.openvex.json","product":"pingaccess","pkg":"snakeyaml","sub":"pkg:maven/org.yaml/snakeyaml","just":"vulnerable_code_not_in_execute_path","notes":"The snakeyaml package is a 2nd level dependency of the jackson dataformat library, not called directly in PingAccess code. A pre-requisite for these CVEs is the processing of untrusted yaml files. PingAccess does not accept or process yaml input files so there is no attack vector to exploit any yaml based vulnerabilities in the application."},{"id":"CVE-2022-1471","file":"openvex/pingam/CVE-2022-1471.openvex.json","product":"pingam","pkg":"snakeyaml","sub":"pkg:maven/org.yaml/snakeyaml","just":"vulnerable_code_not_in_execute_path","notes":"Upgrade to the fixed maintenance release for the deployed branch: 7.1.4+ if on 7.1.x, 7.2.2+ if on 7.2.x, 7.3.1+ if on 7.3.x, or 7.4.0+ (recommend 7.4.2 as latest maintenance) if on 7.4.x; also upgrade AM-SSOAdminTools to 5.1.3.28 or later if the admin tools are deployed. Customers on 7.4.0 who receive scanner alerts should upgrade to 7.4.2 and rescan per TRIAGE-26934 guidance."},{"id":"CVE-2022-1471","file":"openvex/pingauthorize/CVE-2022-1471.openvex.json","product":"pingauthorize","pkg":"snakeyaml","sub":"pkg:maven/org.yaml/snakeyaml","just":"component_not_present","notes":"This issue will be fixed in the version 10 by upgrading SnakeYAML to 2.0. Also PingAuthorize is not vulnerable to this CVE regarding Remote Code Execution with Snakeyaml, because the product does not use snakeyaml on untrusted data."},{"id":"CVE-2022-1471","file":"openvex/pingcentral/CVE-2022-1471.openvex.json","product":"pingcentral","pkg":"snakeyaml","sub":"pkg:maven/org.yaml/snakeyaml","just":"vulnerable_code_not_in_execute_path","notes":"The snakeyaml package is a 2nd level dependency of the spring boot library, it not called directly in PingCentral code. A pre-requisite for these CVEs is the processing of untrusted yaml files. PingCentral does not accept or process yaml input files so there is no attack vector to exploit any yaml based vulnerabilities in the application."},{"id":"CVE-2022-1471","file":"openvex/pingdirectory/CVE-2022-1471.openvex.json","product":"pingdirectory","pkg":"snakeyaml","sub":"pkg:maven/org.yaml/snakeyaml","just":"component_not_present","notes":"PingDirectory is not vulnerable to this issue regarding Remote Code Execution with Snakeyaml because PingDirectory does not use snakeyaml on untrusted data. PingDirectory will upgrade its version of snakeyaml as an additional layer of safety, but a release has not been scheduled as of right now."},{"id":"CVE-2022-1471","file":"openvex/pingfederate/CVE-2022-1471.openvex.json","product":"pingfederate","pkg":"snakeyaml","sub":"pkg:maven/org.yaml/snakeyaml","just":"component_not_present","notes":"This CVE is related to SnakeYAML's default non-safe constructor. In PingFederate, SnakeYAML is a transitive dependency of jackson-dataformat-yaml artifact, which is a transitive dependency of swagger-core artifact. Swagger is used for generating the product's API documentation and does not parse untrusted YAML content from anywhere. Therefore, this CVE is not applicable to the product."},{"id":"CVE-2022-1972","file":"openvex/pingauthorize/CVE-2022-1972.openvex.json","product":"pingauthorize","pkg":"linux-kernel","sub":"pkg:generic/linux-kernel","just":"vulnerable_code_not_in_execute_path","notes":"This vulnerability affects the underlying Linux kernel and is not applicable to the product."},{"id":"CVE-2022-1996","file":"openvex/pingfederate/CVE-2022-1996.openvex.json","product":"pingfederate","pkg":"emicklei-go-restful","sub":"pkg:generic/emicklei-go-restful","just":"vulnerable_code_not_in_execute_path","notes":"Multiple git submodules are present in the PingFederate image’s Alpine OS. As these are written in golang, the packages contain go files as dependencies, however no go commands are executable on PingFederate, meaning that even with local access to a container, vulnerabilities in go language components cannot be exploited. If the case arises that a vulnerability in go can be exploited in an Alpine package, we would act on and patch accordingly."},{"id":"CVE-2022-2048","file":"openvex/pingaccess/CVE-2022-2048.openvex.json","product":"pingaccess","pkg":"jetty-io","sub":"pkg:maven/org.eclipse.jetty/jetty-io","just":"component_not_present","notes":"PingAccess does not use jetty directly. The vulnerable version of jetty is packaged within the ehcache dependency. Pingaccess does not use the rest-management system of ehcache which pulls in the vulnerable jetty version."},{"id":"CVE-2022-2048","file":"openvex/pingauthorize/CVE-2022-2048.openvex.json","product":"pingauthorize","pkg":"jetty-io","sub":"pkg:maven/org.eclipse.jetty/jetty-io","just":"vulnerable_code_not_in_execute_path","notes":"This issue was fixed in the version 9.2.0.1 by upgrading Jetty to 9.4.49"},{"id":"CVE-2022-2048","file":"openvex/pingdirectory/CVE-2022-2048.openvex.json","product":"pingdirectory","pkg":"jetty-server","sub":"pkg:maven/org.eclipse.jetty/jetty-server","just":"vulnerable_code_not_in_execute_path","notes":"Ping DirectoryServer is not vulnerable to this CVE related to resource exhaustion in HTTP/2 because PingDirectory does not accept http/2 requests. Per the following eclipse documentation, HTTP/2 has to be explicitly enabled, which does not happen in PD. We are upgrading our version of Jetty as an additional layer of security. We will upgrade our version of Jetty in a future release as an additional layer of security. . https://www.eclipse.org/jetty/documentation/jetty-10/programming-guide/index.html"},{"id":"CVE-2022-2048","file":"openvex/pingfederate/CVE-2022-2048.openvex.json","product":"pingfederate","pkg":"org-eclipse-jetty-jetty-io-http2-server","sub":"pkg:generic/org-eclipse-jetty-jetty-io-http2-server@9.4.44","just":"vulnerable_code_not_in_execute_path","notes":"TO BE FIXED IN 11.3. No exploit exists for this vulnerability. PingFederate has been tested under the conditions described in the CVE description and no DoS was observed. The Jetty version is scheduled for upgrade to 9.4.48 in PingFederate 11.3"},{"id":"CVE-2022-21476","file":"openvex/pingfederate/CVE-2022-21476.openvex.json","product":"pingfederate","pkg":"oracle-java-se","sub":"pkg:generic/oracle-java-se","just":"vulnerable_code_not_in_execute_path","notes":"This finding is relevant to the JRE/JDK and not any Ping products. In order to remediate this vulnerabliity the customer could potentially upgrade their JRE/JDK."},{"id":"CVE-2022-21540","file":"openvex/pingdirectory/CVE-2022-21540.openvex.json","product":"pingdirectory","pkg":"oracle-java-se","sub":"pkg:generic/oracle-java-se","just":"vulnerable_code_not_in_execute_path","notes":"PingDirectory does not load and run untrusted code onto the server on which it is running nor does it rely on a Java sandbox for security as stated in this CVE. Additionally, this vulnerability appears to be moreso related to a customer's own environment and not PingDirectory specifically."},{"id":"CVE-2022-21540","file":"openvex/pingfederate/CVE-2022-21540.openvex.json","product":"pingfederate","pkg":"oracle-java-se","sub":"pkg:generic/oracle-java-se","just":"vulnerable_code_not_in_execute_path","notes":"F 022-22826.openvex.json","product":"pingfederate","pkg":"expat","sub":"pkg:generic/expat","just":"vulnerable_code_not_in_execute_path","notes":"Expat vulnerabilities are addressed in the 11.0.1-latest package"},{"id":"CVE-2022-22827","file":"openvex/pingfederate/CVE-2022-22827.openvex.json","product":"pingfederate","pkg":"expat","sub":"pkg:generic/expat","just":"vulnerable_code_not_in_execute_path","notes":"Expat vulnerabilities are addressed in the 11.0.1-latest package"},{"id":"CVE-2022-22950","file":"openvex/pingfederate/CVE-2022-22950.openvex.json","product":"pingfederate","pkg":"spel-expression","sub":"pkg:generic/spel-expression","just":"component_not_present","notes":"The Spring Expression dependency in PingFederate is a dependency of another spring library that we use. This vulnerability is a false positive as there are no direct calls to the Spring Expression package in PingFederate code. PingFederate upgraded to a non-vulnerable version in 11.0.3\nHowever, the title of VMWare Spring indicates that the vulnerable package was detected somewhere else in the customer's environment. Customer should upgrade this appropriately in order to resolve this vulnerablility."},{"id":"CVE-2022-22965","file":"openvex/pingaccess/CVE-2022-22965.openvex.json","product":"pingaccess","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"component_not_present","notes":"PingAccess is not vulnerable to CVE-2022-22965 (Spring4Shell). This is because PingAccess does not use the vulnerable \"spring-webmvc\" or \"spring-webflux\" packages. Additionally, PingAccess does not use tomcat as its' web container, instead using Jetty. That being said, we are moving to upgrade Spring in the product as an additional measure of safety for the vulnerability. That ticket can be found in PA-14727 https://jira.pingidentity.com/browse/PA-14727."},{"id":"CVE-2022-22965","file":"openvex/pingcentral/CVE-2022-22965.openvex.json","product":"pingcentral","pkg":"spring-boot","sub":"pkg:maven/org.springframework.boot/spring-boot","just":"component_not_present","notes":"PingCentral is not vulnerable to CVE-2024-38819. This is because PingCentral does not use the vulnerable \"spring-webmvc\" or \"spring-webflux.\""},{"id":"CVE-2022-22965","file":"openvex/pingdirectory/CVE-2022-22965.openvex.json","product":"pingdirectory","pkg":"jetty-server","sub":"pkg:maven/org.eclipse.jetty/jetty-server","just":"vulnerable_code_not_in_execute_path","notes":"When packaged with PingDirectory, the Admin Console is running on Jetty, this violates the exploitability criteria of running on Tomcat. When shipped as a standalone Admin Console, the customer should not run the .war file on a Tomcat server. Regarding the docker image that runs Admin Console, this is being shipped with Tomcat out of the box, and could be vulnerable to CVE-2022-22965. We are prioritizing an emergency fix for this. We recommend that customers lock down access to their Admin Console until a new image is released, if the attacker can not access it via HTTP requests they will not be able to exploit it. The PingDirectory CLI can be leveraged if configuration changes need to be made while the admin console is down."},{"id":"CVE-2022-22965","file":"openvex/pingdirectory/CVE-2022-22965.openvex.json","product":"pingdirectory","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"Ping Products are not vulnerable to this CVE. Ping is moving to upgrade Spring in our products as an additional layer of safety against this."},{"id":"CVE-2022-22965","file":"openvex/pingfederate/CVE-2022-22965.openvex.json","product":"pingfederate","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not vulnerable to the  Spring4Shell vulnerability due to the following unfulfilled pre-requisites:\n1 - Apache Tomcat as the Servlet container - No\n2 - Packaged as a traditional WAR (in contrast to a Spring Boot executable jar) - No\n3 - spring-webmvc or spring-webflux dependency - No\nPingFederate upgraded to a non-vulnerable version in 11.0.3"},{"id":"CVE-2022-22968","file":"openvex/pingaccess/CVE-2022-22968.openvex.json","product":"pingaccess","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"This vulnerability is a housekeeping issue which addresses a case sensitivity field mapping issue used in a workaround for CVE-2022-22965(Spring4Shell). Some of the same pre-requisites exist for this issue as were required for the Spring4Shell vulnerability as seen here: Spring Framework Data Binding Rules Vulnerability (CVE-2022-22968) . These pre-requisites are not fulfilled in PingAccess and so we are not vulnerable. We will continue to upgrade the spring framework components used in future releases."},{"id":"CVE-2022-22968","file":"openvex/pingfederate/CVE-2022-22968.openvex.json","product":"pingfederate","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"This vulnerability is a housekeeping issue which addresses a case sensitivity field mapping issue used in a workaround for CVE-2022-22965(Spring4Shell). Some of the same pre-requisites exist for this issue as were required for the Spring4Shell vulnerability as seen here: https://spring.io/blog/2022/04/13/spring-framework-data-binding-rules-vulnerability-cve-2022-22968. These pre-requisites are not fulfilled in PingFederate and so we are not vulnerable. We will continue to upgrade the spring framework components used in future releases, but do not intend to upgrade to Spring Framework 5.3.19 in a maintenance release."},{"id":"CVE-2022-22970","file":"openvex/pingaccess/CVE-2022-22970.openvex.json","product":"pingaccess","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"component_not_present","notes":"PingAccess is not vulnerable to this issue because it does not use data binding to set MultipartFiles."},{"id":"CVE-2022-22970","file":"openvex/pingauthorize/CVE-2022-22970.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"As per https://spring.io/blog/2022/05/11/spring-framework-5-3-20-and-5-2-22-available-now Spring 5.2.22 is not vulnerable to this CVE"},{"id":"CVE-2022-22970","file":"openvex/pingfederate/CVE-2022-22970.openvex.json","product":"pingfederate","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"component_not_present","notes":"PingFederate does not use the MultipartFile or javax.servlet.Part components described in this CVE. PF upgraded to a non-vulnerable version in 11.1"},{"id":"CVE-2022-22971","file":"openvex/pingaccess/CVE-2022-22971.openvex.json","product":"pingaccess","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"component_not_present","notes":"PingAccess is not vulnerable to this issue because it does not use STOMP over Websocket endpoints."},{"id":"CVE-2022-22971","file":"openvex/pingauthorize/CVE-2022-22971.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"As per https://spring.io/blog/2022/05/11/spring-framework-5-3-20-and-5-2-22-available-now Spring 5.2.22 is not vulnerable to this CVE"},{"id":"CVE-2022-22971","file":"openvex/pingfederate/CVE-2022-22971.openvex.json","product":"pingfederate","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate does not make use of STOMP, which is the pre-requisite for this issue. PingFederate upgraded to a non-vulnerable version in 11.1"},{"id":"CVE-2022-2309","file":"openvex/pingfederate/CVE-2022-2309.openvex.json","product":"pingfederate","pkg":"libxml","sub":"pkg:generic/libxml","just":"vulnerable_code_not_in_execute_path","notes":"This is a dependency of a parent docker image that needs to process an http request to be exploitable. No python is used to process any traffic in Ping's products, this is therefore not exploitable."},{"id":"CVE-2022-23181","file":"openvex/pingcentral/CVE-2022-23181.openvex.json","product":"pingcentral","pkg":"tomcat","sub":"pkg:maven/org.apache.tomcat/tomcat","just":"component_not_present","notes":"This instance of Tomcat is a transitive dependency of spring boot, PingCentral uses Jetty as it's web server. PingCentral is not vulnerable to this CVE because Tomcat is not in use."},{"id":"CVE-2022-23221","file":"openvex/pingaccess/CVE-2022-23221.openvex.json","product":"pingaccess","pkg":"h2","sub":"pkg:maven/com.h2database/h2","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess uses the H2 Database driver only, not the console which is required to exploit this vulnerability. Therefore, this vulnerability is not exploitable."},{"id":"CVE-2022-23221","file":"openvex/pingauthorize/CVE-2022-23221.openvex.json","product":"pingauthorize","pkg":"h2","sub":"pkg:maven/com.h2database/h2","just":"vulnerable_code_not_in_execute_path","notes":"This vulnerability is scheduled for remediation in version 10.1 of PAZ (release date 27 Jun 2024) https://pingidentity.atlassian.net/browse/PAZ-11077. In the current version, Database Executor is vulnerable to RCE via a specially crafted connection string to the internal H2 database. The component is only accessible to highly privileged users (policy administrators). The security team assessed the vulnerability as HIGH risk, not CRITICAL, due to limited exposure of the vulnerable component."},{"id":"CVE-2022-23221","file":"openvex/pingfederate/CVE-2022-23221.openvex.json","product":"pingfederate","pkg":"h2","sub":"pkg:maven/com.h2database/h2","just":"component_not_present","notes":"PingFederate uses the H2 Database driver only, not the console which is required to exploit this vulnerability. This is a False Positive. PingFederate upgraded to a non-vulnerable version of h2 in 11.1"},{"id":"CVE-2022-23222","file":"openvex/pingauthorize/CVE-2022-23222.openvex.json","product":"pingauthorize","pkg":"linux-kernel","sub":"pkg:generic/linux-kernel","just":"vulnerable_code_not_in_execute_path","notes":"This vulnerability affects the underlying Linux kernel and is not applicable to the product."},{"id":"CVE-2022-23457","file":"openvex/pingfederate/CVE-2022-23457.openvex.json","product":"pingfederate","pkg":"org-owasp-esapi-esapi","sub":"pkg:generic/org-owasp-esapi-esapi","just":"vulnerable_code_not_in_execute_path","notes":"PF doesn’t use the vulnerable org.owasp.esapi:esapi package and Validator.getValidDirectoryPath directly. The aws-java-sdk-s3.jar that is packaged in the PF libraries doesn’t use the vulnerable org.owasp.esapi:esapi package."},{"id":"CVE-2022-23521","file":"openvex/pingfederate/CVE-2022-23521.openvex.json","product":"pingfederate","pkg":"git-gitattributes","sub":"pkg:generic/git-gitattributes","just":"vulnerable_code_not_in_execute_path","notes":"Multiple git submodules are present in the PingFederate image’s Alpine OS. Git was used for revision control, however no git commands are executable on PingFederate, meaning that even with local access to a container, vulnerabilities in git components cannot be exploited. If the case arises that a vulnerability in git can be exploited in an Alpine package, we would act on and patch accordingly."},{"id":"CVE-2022-23772","file":"openvex/pingfederate/CVE-2022-23772.openvex.json","product":"pingfederate","pkg":"go","sub":"pkg:golang/github.com/golang/go","just":"vulnerable_code_not_in_execute_path","notes":"Multiple git submodules are present in the PingFederate image’s Alpine OS. As these are written in golang, the packages contain go files as dependencies, however no go commands are executable on PingFederate, meaning that even with local access to a container, vul  to a container, vulnerabilities in go language components cannot be exploited. If the case arises that a vulnerability in go can be exploited in an Alpine package, we would act on and patch accordingly."},{"id":"CVE-2022-23852","file":"openvex/pingfederate/CVE-2022-23852.openvex.json","product":"pingfederate","pkg":"expat","sub":"pkg:generic/expat","just":"vulnerable_code_not_in_execute_path","notes":"Expat vulnerabilities are addressed in the 11.0.1-latest package"},{"id":"CVE-2022-23990","file":"openvex/pingfederate/CVE-2022-23990.openvex.json","product":"pingfederate","pkg":"expat","sub":"pkg:generic/expat","just":"vulnerable_code_not_in_execute_path","notes":"Expat vulnerabilities are addressed in the 11.0.1-latest package"},{"id":"CVE-2022-24329","file":"openvex/pingcentral/CVE-2022-24329.openvex.json","product":"pingcentral","pkg":"kotlin","sub":"pkg:generic/kotlin","just":"vulnerable_code_not_in_execute_path","notes":"This CVE is for developers writing Kotlin projects using gradle as a dependency manager. PingCentral uses maven, not gradle, so this CVE is not exploitable."},{"id":"CVE-2022-24675","file":"openvex/pingfederate/CVE-2022-24675.openvex.json","product":"pingfederate","pkg":"go-encoding-pem","sub":"pkg:generic/go-encoding-pem","just":"vulnerable_code_not_in_execute_path","notes":"Multiple git submodules are present in the PingFederate image’s Alpine OS. As these are written in golang, the packages contain go files as dependencies, however no go commands are executable on PingFederate, meaning that even with local access to a container, vulnerabilities in go language components cannot be exploited. If the case arises that a vulnerability in go can be exploited in an Alpine package, we would act on and patch accordingly."},{"id":"CVE-2022-24778","file":"openvex/pingfederate/CVE-2022-24778.openvex.json","product":"pingfederate","pkg":"imgcrypt","sub":"pkg:golang/github.com/containerd/imgcrypt","just":"vulnerable_code_not_in_execute_path","notes":"Plea gson/gson","just":"vulnerable_code_not_in_execute_path","notes":"Pingfederate is not vulnerable to this CVE because it does not utilize the writeReplace() method. This has also been raised with the PingID security team to be upgraded."},{"id":"CVE-2022-25647","file":"openvex/pingidik/CVE-2022-25647.openvex.json","product":"pingidik","pkg":"google-gson","sub":"pkg:generic/google-gson","just":"component_not_present","notes":"The vulnerable writeReplace() method is not called by the adapter. The issue has been raised with the PingID team to resolve in the next release of the PingID Integration Kit to resolve scan false positives."},{"id":"CVE-2022-25647","file":"openvex/pingidik/CVE-2022-25647.openvex.json","product":"pingidik","pkg":"gson","sub":"pkg:maven/com.google.code.gson/gson","just":"component_not_present","notes":"The vulnerable writeReplace() method is not called by the adapter. The issue has been raised with the PingID team to resolve in the next release of the PingID Integration Kit to resolve scan false positives."},{"id":"CVE-2022-25762","file":"openvex/pingfederate/CVE-2022-25762.openvex.json","product":"pingfederate","pkg":"tomcat","sub":"pkg:maven/org.apache.tomcat/tomcat","just":"component_not_present","notes":"This instance of Tomcat is a transitive dependency of Spring Boot. PingFederate is not vulnerable to this CVE because Tomcat is not in use."},{"id":"CVE-2022-25857","file":"openvex/csd/CVE-2022-25857.openvex.json","product":"csd","pkg":"snakeyaml","sub":"pkg:maven/org.yaml/snakeyaml","just":"vulnerable_code_cannot_be_controlled_by_adversary","notes":"FALSE POSITIVE. A pre-requisite for these CVEs is the processing of untrusted yaml files. CSD only processes trusted yaml configuration files, it does not accept or process yaml input files when running so there is no attack vector to exploit this vulnerability without local access to the server where it is running."},{"id":"CVE-2022-25857","file":"openvex/pingaccess/CVE-2022-25857.openvex.json","p .html  & https://commons.apache.org/proper/commons-text/apidocs/src-html/org/apache/commons/text/TextStringBuilder.html."},{"id":"CVE-2022-42889","file":"openvex/pingfederate/CVE-2022-42889.openvex.json","product":"pingfederate","pkg":"commons-text","sub":"pkg:maven/org.apache.commons/commons-text","just":"component_not_present","notes":"False positive. PingFederate does not ship with the commons-text package. Some Integration Kits ship with the commons-text package, however, no PingFederate Integration Kit uses the commons-text methods which implement StringLookup as described in https://nvd.nist.gov/vuln/detail/CVE-2022-42889. The IKs use the simple replace() method only, not the potentially vulnerable createInterpolator() method. None of the replace() overrides contain StringLookup, StringLookupFactory or createInterpolator. See https://commons.apache.org/proper/commons-text/apidocs/src-html/org/apache/commons/text/StringSubstitutor.html."},{"id":"CVE-2022-42889","file":"openvex/pingfederate-iks/CVE-2022-42889.openvex.json","product":"pingfederate-iks","pkg":"commons-text","sub":"pkg:maven/org.apache.commons/commons-text","just":"component_not_present","notes":"False positive. No PingFederate Integration kits use commons-text methods which implement StringLookup as described in https://nvd.nist.gov/vuln/detail/CVE-2022-42889. All IKs use the replace() method, not the potentially vulnerable createInterpolator() method. None of the replace() overrides contain StringLookup, StringLookupFactory or createInterpolator. See https://commons.apache.org/proper/commons-text/apidocs/src-html/org/apache/commons/text/StringSubstitutor.html."},{"id":"CVE-2022-43401","file":"openvex/pingfederate-iks/CVE-2022-43401.openvex.json","product":"pingfederate-iks","pkg":"jenkins-core","sub":"pkg:maven/org.jenkins-ci.main/jenkins-core","just":"vulnerable_code_not_in_execute_path","notes":"This CVE is pertinent to exploitation in Jenkins Script Security Plugin, not in Ping products. It do E-2024-47554.openvex.json","product":"pingam","pkg":"commons-io","sub":"pkg:maven/commons-io/commons-io","just":"vulnerable_code_not_in_execute_path","notes":"Customers on AM 7.3.x should upgrade to 7.3.2 or later; customers on 7.4.x should upgrade to 7.4.2 or later; customers on 7.5.x should upgrade to 7.5.1 or later; customers on 8.0.x should upgrade to 8.0.0 GA or later. No manual workaround or library patching is needed — the fix is bundled in each maintenance release. Customers who cannot upgrade immediately can reference Ping's official position that the vulnerability is not exploitable in PingAM because the affected XmlStreamReader class is not reachable via any PingAM code path."},{"id":"CVE-2024-47554","file":"openvex/pingcentral/CVE-2024-47554.openvex.json","product":"pingcentral","pkg":"commons-io","sub":"pkg:maven/commons-io/commons-io","just":"vulnerable_code_not_in_execute_path","notes":"PingCentral2.2.0 is utilizing an older version of pingcommons:1.1.0.3 - which uses a vulnerable version of commons-io. There is already a request to upgrade the pingcommons version: https://pingidentity.atlassian.net/browse/PASS-7069"},{"id":"CVE-2024-47554","file":"openvex/pingfederate/CVE-2024-47554.openvex.json","product":"pingfederate","pkg":"commons-io","sub":"pkg:maven/commons-io/commons-io","just":"component_not_present","notes":"PingFederate enforces a non-vulnerable Commons IO version (2.17.0) at build and runtime. PingFederate includes Apache Velocity, which bundles Apache Commons IO as a transitive dependency. Although the vulnerable Commons IO version is present, PingFederate does not invoke XmlStreamReader or process attacker-controlled XML via network-accessible endpoints. Therefore, the vulnerability is not exploitable in PingFederate."},{"id":"CVE-2024-47554","file":"openvex/pingidm/CVE-2024-47554.openvex.json","product":"pingidm","pkg":"commons-io","sub":"pkg:maven/commons-io/commons-io","just":"vulnerable_code_not_in_execute_path","notes":"False positive; the connector uses an embedded commons-io-2.18.0.jar which is not vulnerable, despite what embedded POM files might suggest to scanners."},{"id":"CVE-2024-47855","file":"openvex/pingidm/CVE-2024-47855.openvex.json","product":"pingidm","pkg":"json-lib","sub":"pkg:generic/json-lib@2.4-jenkins-15","just":"component_not_present","notes":"False positive; the Scripted REST Connector uses json-lib:2.4-jenkins-15, which is a version where this issue was already fixed."},{"id":"CVE-2024-47875","file":"openvex/pingauthorize/CVE-2024-47875.openvex.json","product":"pingauthorize","pkg":"dompurify","sub":"pkg:npm/dompurify","just":"vulnerable_code_not_in_execute_path","notes":"There are no confirmations from the Swagger team that DOMPurify CVEs can be exploited. The Swagger web application does all its processing in the browser; it does not store any data. Hence, I don’t see how an attacker is able to deliver XSS payloads. The swagger-ui HTTP Servlet extension can be safely removed, if not needed by executing a command `dsconfig delete-http-servlet-extension --extension-name \"Swagger UI\"`"},{"id":"CVE-2024-48910","file":"openvex/pingauthorize/CVE-2024-48910.openvex.json","product":"pingauthorize","pkg":"dompurify","sub":"pkg:npm/dompurify","just":"vulnerable_code_not_in_execute_path","notes":"There are no confirmations from the Swagger team that DOMPurify CVEs can be exploited. The Swagger web application does all its processing in the browser; it does not store any data. Hence, I don’t see how an attacker is able to deliver XSS payloads. The swagger-ui HTTP Servlet extension can be safely removed, if not needed by executing a command `dsconfig delete-http-servlet-extension --extension-name \"Swagger UI\"`"},{"id":"CVE-2024-49882","file":"openvex/pingauthorize/CVE-2024-49882.openvex.json","product":"pingauthorize","pkg":"linux-kernel","sub":"pkg:generic/linux-kernel","just":"vulnerable_code_not_in_execute_path","notes":"This vulnerability affects the underlying Linux kern e native AES/SHA (AESNative* and SHA*NativeDigest classes) implementations introduced in the 2.1.x release line are not present in the bc-fips 2.0.1 library used by PingFederate. Additionally, PingFederate does not enable or configure Bouncy Castle native acceleration, so the vulnerable code path is not reachable."},{"id":"CVE-2025-12383","file":"openvex/pingaccess/CVE-2025-12383.openvex.json","product":"pingaccess","pkg":"jersey-client","sub":"pkg:maven/org.glassfish.jersey.core/jersey-client","just":"component_not_present","notes":"PingAccess does not use jersey-client-2.31 directly. The vulnerable version of jersey-client is packaged within the ehcache dependency. Pingaccess does not use the rest-management system of ehcache which pulls in the vulnerable jersey-client version."},{"id":"CVE-2025-13465","file":"openvex/pingam/CVE-2025-13465.openvex.json","product":"pingam","pkg":"lodash","sub":"pkg:npm/lodash","just":"vulnerable_code_not_in_execute_path","notes":"Upgrade to the PingAM release that includes the lodash-es 4.17.23 fix: 7.4.3+ for 7.4.x customers, or the next 7.5.x / 8.0.x / 8.1.0 maintenance release containing xxxx...–25706. No workaround is available; upgrade is the only remediation per engineering notes."},{"id":"CVE-2025-13465","file":"openvex/pingcentral/CVE-2025-13465.openvex.json","product":"pingcentral","pkg":"lodash","sub":"pkg:npm/lodash","just":"vulnerable_code_not_in_execute_path","notes":"PingCentral uses lodash _.omit exclusively with static, developer-defined property names in frontend Redux state management. No attacker-controlled input is passed to lodash path-based APIs. As a result, CVE-2025-13465 is not exploitable in PingCentral. A lodash upgrade will be performed as part of routine dependency maintenance."},{"id":"CVE-2025-13465","file":"openvex/pingfederate/CVE-2025-13465.openvex.json","product":"pingfederate","pkg":"lodash","sub":"pkg:npm/lodash","just":"vulnerable_code_not_in_execute_path","notes":"False Positive. In PingFedera tty-all","just":"component_not_present","notes":"Netty is a transitive dependency of AWS SDK. It is not used as a web server and not exploitable in the context of PingDirectory. The latest AWS SDK version uses Netty 4.1.118 which is not affected by this CVE. It will be upgraded in version 10.3 of the product."},{"id":"CVE-2025-24970","file":"openvex/pingfederate/CVE-2025-24970.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate's DynamoDB integration is pulling in Netty via AWS SDK. While PingFederate itself is not affected, it might still be impacted indirectly through the AWS SDK's Netty-based HTTP client. PingFederate 12.3 is scheduled for upgrading the netty-handler."},{"id":"CVE-2025-25193","file":"openvex/pingauthorize/CVE-2025-25193.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"This is a workaround to CVE-2024-47535. Netty will be updated to 4.1.119 in version 10.3 of the product"},{"id":"CVE-2025-25193","file":"openvex/pingauthorizepap/CVE-2025-25193.openvex.json","product":"pingauthorizepap","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"As of today (February 2025), the netty team has not finalized version 4.2 with the fix. PingAuthorize team will upgrade to this version as soon as it becomes available."},{"id":"CVE-2025-25193","file":"openvex/pingdirectory/CVE-2025-25193.openvex.json","product":"pingdirectory","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Netty is a transitive dependency of AWS SDK. As of March 2025, the latest SDK version is using Netty 4.1.118 which is affected by the CVE. There is no fix available at the moment."},{"id":"CVE-2025-25193","file":"openvex/pingfederate/CVE-2025-25193.openvex.json","product":"pingfederate"," kg":"asciidoctorj","sub":"pkg:maven/org.asciidoctor/asciidoctorj","just":"component_not_present","notes":"False positive; IDM does not use Ruby."},{"id":"CVE-2025-27220","file":"openvex/pingam/CVE-2025-27220.openvex.json","product":"pingam","pkg":"ruby-cgi-via-jruby-stdlib","sub":"pkg:generic/ruby-cgi-via-jruby-stdlib","just":"vulnerable_code_not_in_execute_path","notes":"No action required. The CVE is a false positive for PingAM as the vulnerable code path is not reachable. If the API Explorer is enabled and scanner noise is a concern, upgrading to a PingAM maintenance release that bundles jruby-stdlib 9.4.13.0 or later will eliminate the scanner finding."},{"id":"CVE-2025-27220","file":"openvex/pingidm/CVE-2025-27220.openvex.json","product":"pingidm","pkg":"asciidoctorj","sub":"pkg:maven/org.asciidoctor/asciidoctorj","just":"component_not_present","notes":"False positive; IDM does not use Ruby."},{"id":"CVE-2025-27363","file":"openvex/pingam/CVE-2025-27363.openvex.json","product":"pingam","pkg":"cpython","sub":"pkg:generic/cpython","just":"component_not_present","notes":"No action required. TRIAGE-27239 was closed as Not A Defect. Customers whose scanners flag this against a PingAM deployment should treat it as a false positive and suppress it with the TRIAGE-27239 reference."},{"id":"CVE-2025-27516","file":"openvex/pingfederate/CVE-2025-27516.openvex.json","product":"pingfederate","pkg":"jinja","sub":"pkg:generic/jinja","just":"component_not_present","notes":"This CVE affects Jinja, a templating engine for the Python programming language, in applications that render untrusted Jinja templates. PingFederate is a Java-based product and does not ship, bundle, or execute Jinja or any Python runtime component; a search of the PingFederate codebase confirms no usage of this library. As the affected software is not present in the product, this vulnerability does not apply to PingFederate."},{"id":"CVE-2025-27636","file":"openvex/pingauthorizepap/CVE-2025-27636.openvex.json","product":"pingauthorizepap","pkg":"org-apache-camel-camel-core","sub":"pkg:generic/org-apache-camel-camel-core@3.22.2","just":"component_not_present","notes":"The vulnerability is not exploitable in the context of PingAuthorize PAP as Camel library is not used as a server, but as a client."},{"id":"CVE-2025-27789","file":"openvex/pingaccess/CVE-2025-27789.openvex.json","product":"pingaccess","pkg":"core","sub":"pkg:npm/babel/core","just":"vulnerable_code_not_in_execute_path","notes":"This is a not exploitable. PingAccess doesn’t run nodejs server side, and doesn't use babel to parse user provided regular expressions."},{"id":"CVE-2025-27789","file":"openvex/pingam/CVE-2025-27789.openvex.json","product":"pingam","pkg":"babel-runtime-corejs2","sub":"pkg:generic/babel-runtime-corejs2","just":"vulnerable_code_not_in_execute_path","notes":"For 8.1.x: verify your build already includes runtime-corejs2 >= 7.26.10 (master is confirmed fixed; if on an older 8.1.x patch confirm via Mend or package.json). For 7.4.x, 7.5.x, and 8.0.x: backport remediation is tracked under xxxx... (7.4.x), xxxx... (7.5.x), xxxx... (7.4.x sustaining) and sibling tickets — monitor those Jira issues for a patch release and upgrade to the fixed sustaining release once available. No workaround is available per the upstream advisory."},{"id":"CVE-2025-27820","file":"openvex/pingam/CVE-2025-27820.openvex.json","product":"pingam","pkg":"apache-httpclient5-via-esapi","sub":"pkg:generic/apache-httpclient5-via-esapi","just":"vulnerable_code_not_in_execute_path","notes":"Customers on 7.4.x should upgrade to PingAM 7.4.3 (or later); customers on 7.5.x should upgrade to 7.5.2+; customers on 8.0.x should upgrade to 8.0.2+; customers on 8.1.x are already fixed. Customers who have not customized their AntiSamy policy file face no practical exploit risk even on unfixed versions, but upgrading is still recommended to eliminate scanner findings."},{"id":"CVE-2025-27820","file":"openvex/pingfederate/CVE-2025-27820.openvex.json","product":"pingfederate","pkg":"httpclient","sub":"pkg:maven/org.apache.httpcomponents/httpclient","just":"component_not_present","notes":"False Positive. PingFederate and some of its adapters/integrationKits do utitize httpclient, but not the vulnerable versions. Mostly httpclient:5.5, httpclient:4.5.13 and one uses httpclient:4.5.2. The vulnerable versions are 5.4.0, 5.4.1, and 5.4.2."},{"id":"CVE-2025-29774","file":"openvex/pingfederate/CVE-2025-29774.openvex.json","product":"pingfederate","pkg":"node.js","sub":"pkg:generic/node.js","just":"component_not_present","notes":"PingFederate does not use JavaScript and the node.js library for its cryptographic functiontionality. This is a false positive."},{"id":"CVE-2025-29775","file":"openvex/pingfederate/CVE-2025-29775.openvex.json","product":"pingfederate","pkg":"node.js","sub":"pkg:generic/node.js","just":"component_not_present","notes":"PingFederate does not use JavaScript and the node.js library for its cryptographic functiontionality. This is a false positive."},{"id":"CVE-2025-29891","file":"openvex/pingauthorizepap/CVE-2025-29891.openvex.json","product":"pingauthorizepap","pkg":"org-apache-camel-camel-core","sub":"pkg:generic/org-apache-camel-camel-core@3.22.2","just":"component_not_present","notes":"The vulnerability is not exploitable in the context of PingAuthorize PAP as Camel library is not used as a server, but as a client."},{"id":"CVE-2025-31650","file":"openvex/pingidm/CVE-2025-31650.openvex.json","product":"pingidm","pkg":"tomcat-juli","sub":"pkg:maven/org.apache.tomcat/tomcat-juli","just":"component_not_present","notes":"False positive; this vulnerability only affects Tomcat HTTP request handling, not the logging functionality used in IDM."},{"id":"CVE-2025-31651","file":"openvex/pingidm/CVE-2025-31651.openvex.json","product":"pingidm","pkg":"tomcat-jdbc","sub":"pkg:maven/org.apache.tomcat/tomcat-jdbc","just":"component_not_present","notes":"False positive; the JDBC library does not interact with rewrite rules."},{"id":"CVE-2025-32728","file":"openvex/pingaccess/CVE-2025-32728.openvex.json","product":"pingaccess","pkg":"openssh","sub":"pkg:generic/openssh","just":"vulnerable_code_not_in_execute_path","notes":"CVE-2025-32728 is in openssh, part of the Red Hat UBI 9 base image and ops-utility package set in the PingAccess container. It is not part of the PingAccess product code and is not invoked by PingAccess at runtime, so the finding is not exploitable through the product. The openssh-clients package is part of the image's ops-utility set; no sshd server runs in the PingAccess container and no PingAccess code invokes the ssh binary. The package is remediated via regular base-image rebuilds, which pick up the latest Red Hat-patched packages."},{"id":"CVE-2025-35036","file":"openvex/pingidik/CVE-2025-35036.openvex.json","product":"pingidik","pkg":"hibernate-validator","sub":"pkg:maven/org.hibernate.validator/hibernate-validator","just":"component_not_present","notes":"False Positive The pf-pingid-idp-adapter bundles hibernate-validator:6.1.0.Final transitively, but Hibernate Validator is not used anywhere in the adapter code. All “hibernate” references found relate to IDE-supplied JBoss DTD files, not application runtime. PingFederate and its adapters do not deploy Hibernate or EL constraint interpolation logic. Therefore, CVE-2025-35036 is not applicable to this component."},{"id":"CVE-2025-39946","file":"openvex/pingauthorize/CVE-2025-39946.openvex.json","product":"pingauthorize","pkg":"linux-kernel","sub":"pkg:generic/linux-kernel","just":"vulnerable_code_not_in_execute_path","notes":"This vulnerability affects the underlying Linux kernel and is not applicable to the product."},{"id":"CVE-2025-39964","file":"openvex/pingauthorize/CVE-2025-39964.openvex.json","product":"pingauthorize","pkg":"linux-kernel","sub":"pkg:generic/linux-kernel","just":"vulnerable_code_not_in_execute_path","notes":"This vulnerability affects the underlying Linux kernel and is not applicable to the product."},{"id":"CVE-2025-39965","file":"openvex/pingauthorize/CVE-2025-39965.openvex.json","product":"pingauthorize","pkg":"linux-kernel","sub":"pkg:generic/linux-kernel","just":"vulnerable_code_not_in_execute_path","notes":"This vulnerability affects the underlying Linux kernel and is not applicable to the product."},{"id":"CVE-2025-40040","file":"openvex/pingauthorize/CVE-2025-40040.openvex.json","product":"pingauthorize","pkg":"linux-kernel","sub":"pkg:generic/linux-kernel","just":"vulnerable_code_not_in_execute_path","notes":"This vulnerability affects the underlying Linux kernel and is not applicable to the product."},{"id":"CVE-2025-41234","file":"openvex/pingauthorize/CVE-2025-41234.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"Even though PingAuthorize Admin console sets a Content-Disposition header, it does not utilize org.springframework.http.ContentDisposition class for that purpose. Hence, this CVE is not exploitable. Nevertheless, the Spring version will be upgraded in PingAuthorize 11."},{"id":"CVE-2025-41242","file":"openvex/pingaccess/CVE-2025-41242.openvex.json","product":"pingaccess","pkg":"spring-webmvc","sub":"pkg:maven/org.springframework/spring-webmvc","just":"component_not_present","notes":"False positive for PingAccess 8.3. CVE-2025-41242 is a path traversal vulnerability in Spring Framework MVC that requires a Spring MVC application serving static resources, deployed as a WAR or with an embedded servlet container, on a servlet container that does not reject suspicious URI sequences. PingAccess does not use and is not deployed with Spring MVC - no spring-web or spring-webmvc jar is present in the distribution. PingAccess's resource handling is internally developed and the core HTTP protocol is implemented with Netty components, so the exploit conditions are not present."},{"id":"CVE-2025-4124 access","pkg":"go-net-http","sub":"pkg:generic/go-net-http","just":"vulnerable_code_not_in_execute_path","notes":"CVE-2025-47910 is in go net/http (git-lfs binary), part of the Red Hat UBI 9 base image and ops-utility package set in the PingAccess container. It is not part of the PingAccess product code and is not invoked by PingAccess at runtime, so the finding is not exploitable through the product. go net/http is a base-image/ops-utility component that no PingAccess runtime code invokes. The package is remediated via regular base-image rebuilds, which pick up the latest Red Hat-patched packages."},{"id":"CVE-2025-47914","file":"openvex/pingfederate/CVE-2025-47914.openvex.json","product":"pingfederate","pkg":"crypto","sub":"pkg:golang/golang.org/x/crypto","just":"component_not_present","notes":"The reported Golang vulnerabilities originate from operating-system–level packages (for example, git-lfs) present in the PingFederate container’s Alpine base image, not from PingFederate itself. Although these packages are implemented in Golang and therefore include Go standard library and golang.org/x/crypto dependencies, PingFederate does not ship, invoke, or depend on any Go-based binaries or libraries as part of its runtime. There is no execution path by which PingFederate can trigger or leverage Golang components: 1. PingFederate is a Java-based application; 2. The affected Go binaries are not called by PingFederate during normal operation; 3. Exploitation would require direct execution of the OS-level binary, which is outside the PingFederate threat model and unrelated to product functionality. If a Golang vulnerability were to be identified that is exploitable through an OS-level package independently of PingFederate, remediation would be handled via base image or operating system updates, not via PingFederate code or configuration changes."},{"id":"CVE-2025-48060","file":"openvex/pingoneldapgateway/CVE-2025-48060.openvex.json","product":"pingoneldapgateway","pkg":"j "False Positive. PingCentral 2.3 embedded container: spring-boot-starter-web excludes Tomcat and spring-boot-starter-jetty is added → embedded Jetty."},{"id":"CVE-2025-55668","file":"openvex/pingdirectory/CVE-2025-55668.openvex.json","product":"pingdirectory","pkg":"tomcat-el-api","sub":"pkg:maven/org.apache.tomcat/tomcat-el-api","just":"component_not_present","notes":"This is a false positive. The CVE mentions Tomcat, but the package reported is tomcat-embed-el. \"tomcat-embed-el\" refers to a specific Java library within the Apache Tomcat project, which provides the implementation of the Expression Language (EL) API."},{"id":"CVE-2025-55668","file":"openvex/pingidm/CVE-2025-55668.openvex.json","product":"pingidm","pkg":"tomcat-juli","sub":"pkg:maven/org.apache.tomcat/tomcat-juli","just":"component_not_present","notes":"False positive; this vulnerability only affects Tomcat session management (specifically session fixation)."},{"id":"CVE-2025-55752","file":"openvex/pingidm/CVE-2025-55752.openvex.json","product":"pingidm","pkg":"tomcat-servlet-api","sub":"pkg:maven/org.apache.tomcat/tomcat-servlet-api","just":"component_not_present","notes":"False positive; the vulnerability exists in the Catalina component of Tomcat and does not affect the tomcat-servlet-api library used by IDM."},{"id":"CVE-2025-58056","file":"openvex/pingaccess/CVE-2025-58056.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess 8.3 bundles Netty versions within the affected range (4.1.118 in 8.3.0; 4.1.132 in 8.3.x maintenance builds). The chunk-size line-terminator parsing flaw is present, but PingAccess is a parse-and-re-encode proxy: the front-end decoder parses inbound requests and the backend encoder re-serializes them with strict CRLF framing to the origin, so no desynchronized byte stream reaches the origin. Exploitability is limited to deployments where PingAccess sits behind another proxy that parses chunk framing differently. PingAccess 8.3.6 bundles Netty 4.1.138, which is outside the affected range."},{"id":"CVE-2025-58056","file":"openvex/pingam/CVE-2025-58056.openvex.json","product":"pingam","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"Customers on AM 8.0.x or 7.5.x should upgrade to AM 8.1.0 (which ships grpc-netty-shaded 1.76.2) to eliminate the flagged dependency; customers on 7.5.x awaiting a sustaining fix should target AM 7.5.3 once released. No immediate emergency action is required given the non-exploitable usage context confirmed by engineering (TRIAGE-31369, xxxx...)."},{"id":"CVE-2025-58056","file":"openvex/pingig/CVE-2025-58056.openvex.json","product":"pingig","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"CVE-2025-58056 is a request smuggling attack that exploits a flaw that has long been present in the netty application framework. The probability of attack is probably high as it is a published exploit that is relatively easy to attempt. However the impact to the integrity of the PingGateway application is low, and given that it has been present for some time it can be assumed that if it was truly exploitable then we would have already seen such attacks"},{"id":"CVE-2025-58057","file":"openvex/pingam/CVE-2025-58057.openvex.json","product":"pingam","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"Customers on AM 8.0.x or earlier should upgrade to AM 8.1.0 (or await AM 7.5.3 for the 7.5.x sustaining line) to obtain the grpc-netty-shaded 1.76.2 dependency upgrade. No emergency action is required given the code is not reachable, but upgrading closes the scanner finding and removes the library-level risk entirely."},{"id":"CVE-2025-58057","file":"openvex/pingauthorize/CVE-2025-58057.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"The CVE is not exploitable in PingAuthorize. The description mentions BrotliDecoder class as vulnerable. None of PingAuthorize components is using this class."},{"id":"CVE-2025-58057","file":"openvex/pingdirectory/CVE-2025-58057.openvex.json","product":"pingdirectory","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"The CVE is not exploitable in PingDirectory. The description mentions BrotliDecoder class as vulnerable. None of PingDirectory components is using this class. Nevertheless, the component will be upgraded in version 11 of the product."},{"id":"CVE-2025-58183","file":"openvex/pingauthorize/CVE-2025-58183.openvex.json","product":"pingauthorize","pkg":"go","sub":"pkg:golang/github.com/golang/go","just":"component_not_present","notes":"The reported Golang vulnerabilities originate from operating-system–level packages (for example, git-lfs) present in the PingAuthorize container’s Alpine base image, not from PingAuthorize itself. Although these packages are implemented in Golang and therefore include Go standard libraries, PingAuthorize does not ship, invoke, or depend on any Go-based binaries or libraries as part of its runtime. There is no execution path by which PingAuthorize can trigger or leverage Golang components: 1. PingAuthorize is a Java-based application; 2. The affected Go binaries are not called by PingAuthorize during normal operation; 3. Exploitation would require direct execution of the OS-level binary, which is outside the PingAuthorize threat model and unrelated to product functionality. If a Golang vulnerability were to be identified that is exploitable through an OS-level package independently of PingAuthorize, remediation would be handled via base image or operating system updates, not via PingAuthorize code or configuration changes. This applies to all mentioned Go CVEs: CVE-2025-47914, CVE-2025-58181, CVE-2025-68121, CVE-2025-58183, CVE-2025-61726, CVE-2025-61728, CVE-2025-22873, CVE-2025-47906, CVE-2025-47912, CVE-2025-58185, CVE-2025-58186, CVE-2025-58189, CVE-2025-61724, CVE-2025-61727, CVE-2025-61730, CVE-2026-27139, CVE-2026-25679, CVE-2026-27142"},{"id":"CVE-2025-58185","file":"openvex/pingaccess/CVE-2025-58185.openvex.json","product":"pingaccess","pkg":"go-crypto","sub":"pkg:generic/go-crypto","just":"vulnerable_code_not_in_execute_path","notes":"CVE-2025-58185 is in go crypto (git-lfs binary), part of the Red Hat UBI 9 base image and ops-utility package set in the PingAccess container. It is not part of the PingAccess product code and is not invoked by PingAccess at runtime, so the finding is not exploitable through the product. go crypto is a base-image/ops-utility component that no PingAccess runtime code invokes. The package is remediated via regular base-image rebuilds, which pick up the latest Red Hat-patched packages."},{"id":"CVE-2025-58187","file":"openvex/pingauthorize/CVE-2025-58187.openvex.json","product":"pingauthorize","pkg":"go","sub":"pkg:golang/github.com/golang/go","just":"vulnerable_code_not_in_execute_path","notes":"Multiple git submodules are present in the PingAuthorize image’s Alpine OS. As these are written in golang, the packages contain go files as dependencies, however, no go commands are executable on PingAuthorize, meaning that even with local access to a container, vulnerabilities in go language components cannot be exploited. If the case arises that a vulnerability in go can be exploited in an Alpine package, we would act on and patch it accordingly."},{"id":"CVE-2025-58188","file":"openvex/pingaccess/CVE-2025-58188.openvex.json","product":"pingaccess","pkg":"go-crypto-x509","sub":"pkg:generic/go-crypto-x509","just":"vulnerable_code_not_in_execute_path","notes":"CVE-2025-58188 is in go crypto/x509 (git-lfs binary), part of the Red Hat UBI 9 base image and ops-utility package set in the PingAccess -lfs, a command-line utility in the image's Red Hat UBI 9 utility set (this CVE is in Go's net/url compiled into the git-lfs binary). PingAccess does not invoke git or git-lfs anywhere in its runtime tree (server lib, hooks, staging), so the finding is not exploitable through PingAccess. The package is updated via regular base-image rebuilds, which pick up the latest Red Hat-patched packages (git-lfs was updated 3.7.1-4.el9_8.1 to 3.7.1-4.el9_8.2 between recent image builds)."},{"id":"CVE-2025-61727","file":"openvex/pingaccess/CVE-2025-61727.openvex.json","product":"pingaccess","pkg":"go-crypto-x509","sub":"pkg:generic/go-crypto-x509","just":"vulnerable_code_not_in_execute_path","notes":"CVE-2025-61727 is in go crypto/x509 (git-lfs binary), part of the Red Hat UBI 9 base image and ops-utility package set in the PingAccess container. It is not part of the PingAccess product code and is not invoked by PingAccess at runtime, so the finding is not exploitable through the product. go crypto/x509 is a base-image/ops-utility component that no PingAccess runtime code invokes. The package is remediated via regular base-image rebuilds, which pick up the latest Red Hat-patched packages."},{"id":"CVE-2025-61729","file":"openvex/pingaccess/CVE-2025-61729.openvex.json","product":"pingaccess","pkg":"git-lfs","sub":"pkg:generic/git-lfs@3.7.1-4.el9_8","just":"vulnerable_code_not_in_execute_path","notes":"Quadratic memory growth on crafted certificate hostnames in Go's crypto/x509 compiled into the git-lfs package included in the image's Red Hat UBI 9 utility set. git-lfs is a command-line utility that is not invoked by PingAccess at runtime, so there is no exploitation path through the product; the package is updated via regular base-image rebuilds, which pick up the latest Red Hat-patched packages."},{"id":"CVE-2025-61729","file":"openvex/pingaccess/CVE-2025-61729.openvex.json","product":"pingaccess","pkg":"go-crypto-x509","sub":"pkg:generic/go-crypto-x509","just":"vulnerable_code_not_in_execute_path","notes":"The finding is in git-lfs, a command-line utility in the image's Red Hat UBI 9 utility set (this CVE is in Go's crypto/x509 compiled into the git-lfs binary - quadratic memory growth when constructing a certificate hostname error string). PingAccess does not invoke git or git-lfs anywhere in its runtime tree, so the finding is not exploitable through PingAccess. The package is updated via regular base-image rebuilds, which pick up the latest Red Hat-patched packages."},{"id":"CVE-2025-61795","file":"openvex/pingidm/CVE-2025-61795.openvex.json","product":"pingidm","pkg":"tomcat-jdbc","sub":"pkg:maven/org.apache.tomcat/tomcat-jdbc","just":"component_not_present","notes":"False positive; the vulnerability exists in the Catalina connector of Tomcat and does not affect the JDBC, JULI, or servlet-api libraries used by IDM."},{"id":"CVE-2025-64718","file":"openvex/pingam/CVE-2025-64718.openvex.json","product":"pingam","pkg":"js-yaml","sub":"pkg:generic/js-yaml","just":"inline_mitigations_already_exist","notes":"Upgrade PingAM to 7.4.3, 7.5.3, or 8.0.3 (or the corresponding AIC/8.1.x release) which bundle js-yaml 4.1.1. As a temporary mitigation, run the Node process with --disable-proto=delete to block prototype pollution. Reference tickets: xxxx... (master), xxxx... (7.4.x), xxxx... (7.5.x), xxxx... (8.0.x), xxxx... (8.1.x)."},{"id":"CVE-2025-66453","file":"openvex/pingam/CVE-2025-66453.openvex.json","product":"pingam","pkg":"rhino","sub":"pkg:maven/org.mozilla/rhino","just":"vulnerable_code_not_in_execute_path","notes":"Upgrade to AM 7.4.3, 7.5.3, 8.0.3, or 8.1.0 (whichever matches your support branch) to obtain rhino-1.7.14.1. If an immediate upgrade is not possible, review all custom JavaScript scripts for any code path that passes end-user-controlled input to the toFixed() function and remove or sanitize such calls as an interim mitigation; deployments with AM Scripting entirely disabled are not exposed."},{"id":"CVE-2025-66453","file":"openvex/pingidm/CVE-2025-66453.openvex.json","product":"pingidm","pkg":"rhino","sub":"pkg:maven/org.mozilla/rhino","just":"component_not_present","notes":"Potentially vulnerable; IDM uses rhino:1.7.14_2. Default scripts do not use the vulnerable toFixed() method, but custom scripts might."},{"id":"CVE-2025-67030","file":"openvex/pingaccess/CVE-2025-67030.openvex.json","product":"pingaccess","pkg":"plexus-utils","sub":"pkg:maven/org.codehaus.plexus/plexus-utils","just":"component_not_present","notes":"Plexus-utils is not used in PingAccess. This is a transitive dependency of the collect support data tool (a support script) that archives data for support. This is not exploitable within our product."},{"id":"CVE-2025-67735","file":"openvex/pingauthorize/CVE-2025-67735.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Netty is a transitive dependency for Azure and AWS SDK. As mentioned here https://github.com/netty/netty/security/advisories/GHSA-84h7-rjj3-6jx4, the vulnerability is only exploitable if Netty is used as an HTTP server. PingAuthorize is using Jetty HTTP Server, hence it is not exploitable. The component will be upgraded in the next version of the product."},{"id":"CVE-2025-67735","file":"openvex/pingidm/CVE-2025-67735.openvex.json","product":"pingidm","pkg":"tomcat-jdbc","sub":"pkg:maven/org.apache.tomcat/tomcat-jdbc","just":"vulnerable_code_not_in_execute_path","notes":"Likely not vulnerable; the library is used indirectly through azure-identity which uses hardcoded/formatted URLs, but it is treated as a true positive to ensure an upgrade."},{"id":"CVE-2025-67735","file":"openvex/pingig/CVE-2025-67735.openvex.json","product":"pingig","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"Fixed in versions 2026.3 and 2025.11.1"},{"id":"CVE-2025-68160","file":"openvex/pingoneldapgateway/CVE-2025-68160.openvex.json","product":"pingoneldapgateway","pkg":"libcrypto1-2","sub":"pkg:generic/libcrypto1-2@1.1.1w-r1","just":"component_not_present","notes":"libcrypto1.1 1.1.1w-r1 is installed in the base image, but libcrypto.so.1.1 is not loaded into the gateway JVM and is not referenced by gateway code or configs, so libcrypto1.1 is not used by the product at runtime."},{"id":"CVE-2025-68160","file":"openvex/pingoneldapgateway/CVE-2025-68160.openvex.json","product":"pingoneldapgateway","pkg":"libssl1-2","sub":"pkg:generic/libssl1-2@1.1.1w-r1","just":"vulnerable_code_not_in_execute_path","notes":"libssl1.1 1.1.1w-r1 is present in the OS but unused by LDAP Gateway at runtime, so this CVE is not exercised by the product."},{"id":"CVE-2025-68160","file":"openvex/pingoneldapgateway/CVE-2025-68160.openvex.json","product":"pingoneldapgateway","pkg":"openssl","sub":"pkg:generic/openssl@1.1.1w-r1","just":"component_not_present","notes":"The openssl package is present in the base image and used only for generic tooling; LDAP Gateway does not invoke the openssl CLI or rely on its binaries directly, so openssl is not used by the product at runtime."},{"id":"CVE-2025-68161","file":"openvex/pingaccess/CVE-2025-68161.openvex.json","product":"pingaccess","pkg":"log4j","sub":"pkg:maven/log4j/log4j","just":"vulnerable_code_not_in_execute_path","notes":"Conditionally exploitable/Customer-configurable vulnerability. We will upgrade the library."},{"id":"CVE-2025-68161","file":"openvex/pingfederate/CVE-2025-68161.openvex.json","product":"pingfederate","pkg":"log4j-core","sub":"pkg:maven/org.apache.logging.log4j/log4j-core","just":"component_not_present","notes":"Exposure to CVE-2025-68161 in PingFederate is conditional on customer configuration, and the underlying library has already been updated in recent releases. The vulnerability resides in the TLS transport of log4j-core's Socket Appender, which does not perform hostname verification of the log receiver's certificate; PingFederate ships log4j-core and provides Socket Appender definitions in its logging configuration that customers can enable and extend, so deployments that use a TLS Socket Appender for log shipping fall within the affected use case. Recent PingFederate releases ship log4j-core 2.25.4, which incorporates the fix (addressed upstream in 2.25.3); customers on older maintenance releases who use a TLS Socket Appender should update to a release containing the fixed library, or alternatively restrict the appender's trust store as described in the advisory. Deployments that do not use a TLS Socket Appender are not exposed, and no action is required in that case."},{"id":"CVE-2025-68972","file":"openvex/pingaccess/CVE-2025-68972.openvex.json","product":"pingaccess","pkg":"gnupg","sub":"pkg:generic/gnupg","just":"vulnerable_code_not_in_execute_path","notes":"CVE-2025-68972 is in gnupg, part of the Red Hat UBI 9 base image and ops-utility package set in the PingAccess container. It is not part of the PingAccess product code and is not invoked by PingAccess at runtime, so the finding is not exploitable through the product. GnuPG is a command-line crypto utility not invoked by PingAccess at runtime. The package is remediated via regular base-image rebuilds, which pick up the latest Red Hat-patched packages."},{"id":"CVE-2025-69418","file":"openvex/pingoneldapgateway/CVE-2025-69418.openvex.json","product":"pingoneldapgateway","pkg":"libcrypto1-3","sub":"pkg:generic/libcrypto1-3@1.1.1w-r1","just":"component_not_present","notes":"libcrypto1.1 1.1.1w-r1 is installed in the base image, but libcrypto.so.1.1 is not loaded into the gateway JVM and is not referenced by gateway code or configs, so libcrypto1.1 is not used by the product at runtime."},{"id":"CVE-2025-69418","file":"openvex/pingoneldapgateway/CVE-2025-69418.openvex.json","product":"pingoneldapgateway","pkg":"libssl1-3","sub":"pkg:generic/libssl1-3@1.1.1w-r1","just":"vulnerable_code_not_in_execute_path","notes":"libssl1.1 1.1.1w-r1 is present in the OS but unus

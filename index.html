tes":"This vulnerability is not exploitable, as DelegatingDecompressorFrameListener is not utilized by the product. Additionally, the underlying Netty component is scheduled for an upgrade in the upcoming 11.2 major release."},{"id":"CVE-2026-56819","file":"openvex/pingfederate/CVE-2026-56819.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"False Positive. This vulnerability requires HTTP/2 content decompression to be explicitly enabled via DelegatingDecompressorFrameListener. Zero matches for this class name anywhere in PingFederate source — nothing constructs or wires it into a pipeline. PingFederate's HTTP/2 support (where present) is handled by Jetty's ALPN modules, not Netty's HTTP/2 stack."},{"id":"CVE-2026-56819","file":"openvex/pingfederate/CVE-2026-56819.openvex.json","product":"pingfederate","pkg":"netty-codec-http2","sub":"pkg:maven/io.netty/netty-codec-http2","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected by CVE-2026-56819. The vulnerable DelegatingDecompressorFrameListener is part of Netty's HTTP/2 codec, which PingFederate never operates: PingFederate's HTTP/2 endpoints are served by Jetty's HTTP/2 implementation, and no PingFederate code references Netty's HTTP/2 classes. netty-codec-http2 is present in PingFederate 13.1 only as an unused transitive of the AWS SDK's asynchronous transport (and embedded inside the bundled AWS KMS encryptor integration) and never processes network data. The DATA-frame decompression path with the leaking error branch is therefore unreachable by any peer; not exploitable, and no upgrade, mitigation, or configuration change is required."},{"id":"CVE-2026-56820","file":"openvex/pingfederate/CVE-2026-56820.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"PingFederate is not vulnerable to CVE-2026-56820. The vulnerable component (io.netty:netty-handler-ssl-ocsp) is not present in the product, and no code path invokes Netty's OCSP validation."},{"id":"CVE-2026-56821","file":"openvex/pingauthorize/CVE-2026-56821.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"According to the advisory https://github.com/netty/netty/security/advisories/GHSA-g7hg-vrcf-mvmr, this vulnerability affects only `netty-handler-ssl-ocsp` component. This component is not included by PingAuthorize hence the product is not vulnerable."},{"id":"CVE-2026-57914","file":"openvex/pingfederate/CVE-2026-57914.openvex.json","product":"pingfederate","pkg":"kerby-asn1-2-1-0","sub":"pkg:generic/kerby-asn1-2-1-0","just":"component_not_present","notes":"PingFederate versions 12.2 through 13.1 include Apache Kerby 2.1.0 as a transitive dependency through the jaaslounge-decoding library used for Kerberos authentication. CVE-2026-57914 affects Apache Kerby versions prior to 2.1.2. The vulnerable code path is limited to Kerberos/SPNEGO authentication processing, where incoming Kerberos tokens are parsed as part of the normal authentication flow before user authentication is established. An attacker with network access could send a specially crafted Kerberos token that may cause excessive resource consumption, resulting in a denial-of-service condition. No confidentiality or integrity impact has been identified; the issue is limited to potential denial of service."},{"id":"CVE-2026-5795","file":"openvex/pingaccess/CVE-2026-5795.openvex.json","product":"pingaccess","pkg":"jetty-io","sub":"pkg:maven/org.eclipse.jetty/jetty-io","just":"component_not_present","notes":"PingAccess does not use jetty directly. The vulnerable version of jetty is packaged within the ehcache dependency. Pingaccess does not use the rest-management system of ehcache which pulls in the vulnerable jetty version."},{"id":"CVE-2026-58058","file":"openvex/pingauthorize/CVE-2026-58058.openvex.json","product":"pingauthorize","pkg":"nmap","sub":"pkg:generic/nmap","just":"vulnerable_code_not_in_execute_path","notes":"Nmap is a network-scanning tool, not a product dependency."},{"id":"CVE-2026-58059","file":"openvex/pingauthorize/CVE-2026-58059.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"No org.bouncycastle.asn1 classes are used anywhere in the product or LDAP SDK source. Not exploitable."},{"id":"CVE-2026-58060","file":"openvex/pingauthorize/CVE-2026-58060.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"No org.bouncycastle.pqc or HSS/LMS classes are used anywhere in the codebase. Not exploitable."},{"id":"CVE-2026-58061","file":"openvex/pingauthorize/CVE-2026-58061.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"component_not_present","notes":"The product does not use any Bouncy Castle block cipher or AEAD modes. BC usage is limited to password hashing primitives and optionally the FIPS provider."},{"id":"CVE-2026-58062","file":"openvex/pingauthorize/CVE-2026-58062.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"PingAuthorize uses Bouncy Castle only for password hashing primitives (Argon2, BCrypt, SCrypt) and as a FIPS/JSSE security provider for TLS. The OCSP revocation checker is never invoked. There is no OCSP stapling validation path through Bouncy Castle anywhere in the codebase."},{"id":"CVE-2026-58063","file":"openvex/pingauthorize/CVE-2026-58063.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"The vulnerable BCFKS keystore loading routine relies exclusively on administrator-configured local server files and is not exposed to untrusted network inputs. Therefore, this CVE is not exploitable."},{"id":"CVE-2026-59276","file":"openvex/pingauthorize/CVE-2026-59276.openvex.json","product":"pingauthorize","pkg":"spring-security-core","sub":"pkg:maven/org.springframework.security/spring-security-core","just":"vulnerable_code_not_in_execute_path","notes":"The custom LDAP authentication provider and OIDC flow do not match the affected component conditions. Therefore, the CVE is not exploitable."},{"id":"CVE-2026-59280","file":"openvex/pingaccess/CVE-2026-59280.openvex.json","product":"pingaccess","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"component_not_present","notes":"False positive for PingAccess 8.3. CVE-2026-59280 is a path traversal in applications using Spring's FreeMarker integration with SpringTemplateLoader and view names derived from untrusted input. PingAccess does not bundle or configure FreeMarker - template rendering uses Apache Velocity - and the Spring FreeMarker integration classes are not used by PingAccess code."},{"id":"CVE-2026-59281","file":"openvex/pingaccess/CVE-2026-59281.openvex.json","product":"pingaccess","pkg":"spring-webmvc","sub":"pkg:maven/org.springframework/spring-webmvc","just":"component_not_present","notes":"False positive for PingAccess 8.3. CVE-2026-59281 is a reflected XSS in Spring MVC/WebFlux applications rendering field errors from a data-binding Errors instance with HTML escaping enabled. PingAccess does not use Spring MVC or WebFlux data binding, so the ErrorsgetFieldErrors rendering path does not exist in the product."},{"id":"CVE-2026-59281","file":"openvex/pingauthorize/CVE-2026-59281.openvex.json","product":"pingauthorize","pkg":"spring-web","sub":"pkg:maven/org.springframework/spring-web","just":"vulnerable_code_not_in_execute_path","notes":"The PingData Admin Console does not utilize the required escaped-error rendering behavior, and no attacker-controlled field-error output path was identified. The CVE is not epxloitable."},{"id":"CVE-2026-59282","file":"openvex/pingauthorize/CVE-2026-59282.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"The product does not expose the required attacker-controlled DataBinder/property-path flow. Therefore, the CVE is not exploitable."},{"id":"CVE-2026-59283","file":"openvex/pingaccess/CVE-2026-59283.openvex.json","product":"pingaccess","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess does not invoke the SpEL API in any production code path, so no attacker-supplied input can reach expression evaluation. Spring refresh scheduled with the library upgrades in PingAccess 9.2."},{"id":"CVE-2026-59283","file":"openvex/pingauthorize/CVE-2026-59283.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"The product does not utilize SimpleEvaluationContext, compiled-SpEL configuration, SpelParserConfiguration, or spring.expression.compiler.mode. Therefore, this CVE is not exploitable. The Spring Framework dependency will be updated in PingAuthorize 11.2."},{"id":"CVE-2026-59295","file":"openvex/pingauthorize/CVE-2026-59295.openvex.json","product":"pingauthorize","pkg":"micrometer","sub":"pkg:generic/micrometer@1.15.5","just":"vulnerable_code_not_in_execute_path","notes":"The application does not utilize `HttpAsyncClient` or `MicrometerHttpClientInterceptor`. Therefore, this CVE is not exploitable."},{"id":"CVE-2026-59296","file":"openvex/pingauthorize/CVE-2026-59296.openvex.json","product":"pingauthorize","pkg":"micrometer-core","sub":"pkg:generic/micrometer-core@1.5.12","just":"vulnerable_code_not_in_execute_path","notes":"The affected component is used by the PingData Administrative Console. However, the Admin Console does not accept or inject external configuration that enables LoggingMeterRegistry or a StatsD registry, which are required prerequisites for exploitation. Therefore, this CVE is not exploitable."},{"id":"CVE-2026-59313","file":"openvex/pingfederate/CVE-2026-59313.openvex.json","product":"pingfederate","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"component_not_present","notes":"The Spring Framework versions bundled by PingFederate fall within the affected ranges - 12.3 ships Spring 5.3.39 and the latest release ships 6.2.19 - so scanner findings against these jars are expected. The vulnerability affects Spring MVC applications using the functional web framework with Server-Sent Events, and PingFederate does not use Spring MVC at all: it ships no spring-webmvc or WebFlux artifacts, and the Spring jars it does bundle (spring-core, spring-jdbc, spring-context, spring-web, etc.) are used solely for internal dependency injection, JDBC templating in the provisioner, and servlet context bootstrap - none of PingFederate's HTTP endpoints are served by Spring, and no SSE or reactive-stream APIs are used anywhere in the product. All PingFederate HTTP endpoints are served by Jetty and Jersey, so the vulnerable stream-handling code path is not reachable. PingFederate will update the bundled Spring Framework in an upcoming maintenance release to address the scanner finding; the issue itself is not exploitable in PingFederate."},{"id":"CVE-2026-59314","file":"openvex/pingauthorize/CVE-2026-59314.openvex.json","product":"pingauthorize","pkg":"spring-web","sub":"pkg:maven/org.springframework/spring-web","just":"vulnerable_code_not_in_execute_path","notes":"While a vulnerable spring-web*.jar is present, the application does not utilize Spring's `ContentDisposition` builder or outbound multipart request APIs. Therefore, this CVE is not exploitable."},{"id":"CVE-2026-59638","file":"openvex/pingauthorize/CVE-2026-59638.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"The product does not utilize hostname verification via BCJSSE; therefore, this CVE is not exploitable."},{"id":"CVE-2026-59646","file":"openvex/pingauthorize/CVE-2026-59646.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"component_not_present","notes":"The product does not use DTLS; therefore, this CVE is not exploitable."},{"id":"CVE-2026-59650","file":"openvex/pingauthorize/CVE-2026-59650.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"component_not_present","notes":"This CVE is in Bouncy Castle's DHAgreement class, which performs static DH key agreement without validating the peer's public value. PingAuthorize does not use Bouncy Castle's DH key exchange. Bouncy Castle is used only for password hashing primitives (Argon2, BCrypt, SCrypt) and optionally as a FIPS crypto provider. The vulnerable DHAgreement code path is never invoked."},{"id":"CVE-2026-59651","file":"openvex/pingauthorize/CVE-2026-59651.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"The product's CryptoHelper explicitly restricts supported keystore types to JKS, PKCS12, BCFKS, and PKCS11. The BKS (and UBER) keystore types are never used. There is no API surface for a user to configure or present a BKS keystore to the product. The vulnerable code path cannot be reached."},{"id":"CVE-2026-59888","file":"openvex/pingaccess/CVE-2026-59888.openvex.json","product":"pingaccess","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess ships jackson-databind 2.17.0, which is within the affected range (>=2.15.0, \u003c2.18.8). However, this CVE requires Java Records with @JsonIgnore and an active PropertyNamingStrategy ‚Äî none of which are present in PingAccess. Not exploitable."},{"id":"CVE-2026-59889","file":"openvex/pingaccess/CVE-2026-59889.openvex.json","product":"pingaccess","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess ships jackson-databind 2.17.0, which is below the affected range of 2.18.0-2.18.8. The vulnerable code path does not exist in 2.17.0. Not affected."},{"id":"CVE-2026-59889","file":"openvex/pingauthorize/CVE-2026-59889.openvex.json","product":"pingauthorize","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"The product uses neither @JsonView nor @JsonUnwrapped. Not exploitable."},{"id":"CVE-2026-59889","file":"openvex/pingds/CVE-2026-59889.openvex.json","product":"pingds","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"See internal security assessment for CVE-2026-59889."},{"id":"CVE-2026-59898","file":"openvex/pingaccess/CVE-2026-59898.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess ships Netty 4.1.118.Final. PA's WebSocketOriginInterceptor enforces strict version-13-only validation before any Netty WebSocket codec is involved. WebSocketServerHandshakerFactory is never called. Not exploitable."},{"id":"CVE-2026-59898","file":"openvex/pingfederate/CVE-2026-59898.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"False Positive. This bug requires a Netty-based WebSocket server accepting the lax V07/V08 handshake. PingFederate's only WebSocket usage is PingOneWebSocketConnectionManager, which imports javax.websocket.* (JSR-356) and org.glassfish.tyrus.client.ClientManager/JdkClientContainer — this is a Tyrus/JDK-based WebSocket client connecting  outbound to PingOne, with zero io.netty imports. PingFederate has no WebSocket server of any kind, Netty-based or otherwise."},{"id":"CVE-2026-59899","file":"openvex/pingaccess/CVE-2026-59899.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"component_not_present","notes":"PingAccess ships Netty 4.1.118.Final. HttpContentEncoder and HttpContentCompressor are not present in PA's Netty server pipeline‚ PA uses its own FrontEndHttpResponseEncoder. Not exploitable."},{"id":"CVE-2026-59899","file":"openvex/pingfederate/CVE-2026-59899.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"False Positive. This bug requires Netty to be the HTTP server handling untrusted client connections with response compression enabled and exposed to HTTP/1.1 pipelining. PingFederate has no Netty-based HTTP server anywhere (Jetty handles all request processing). The only \"compression\" logic found anywhere in the repo is Lettuce's CompressionCodec.valueCompressor(UTF8, GZIP) in StandaloneRedisConnection.java — in-process GZIP of Redis values, with no relationship to Netty's HTTP response-encoding pipeline or its acceptEncodingQueue."},{"id":"CVE-2026-59900","file":"openvex/pingaccess/CVE-2026-59900.openvex.json","product":"pingaccess","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not exploitable in PingAccess 8.3. CVE-2026-59900 is a Netty HTTP/2-to-HTTP/1.1 translation flaw (Host header duplication between :authority and literal host in Http2StreamFrameToHttpObjectCodec / InboundHttp2ToHttpAdapter). PingAccess does not enable HTTP/2 and the netty-codec-http2 module is not included in the distribution, so the translator classes are absent and the vulnerable code path is unreachable."},{"id":"CVE-2026-59900","file":"openvex/pingfederate/CVE-2026-59900.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"False Positive. Zero matches for either class anywhere in PingFederate source. This bug requires Netty to be acting as the HTTP/2-to-HTTP/1.x translation layer in front of an application - PingFederate never uses Netty in this role. Where PingFederate needs HTTP/2/ALPN negotiation, it uses Jetty's ALPN modules (jetty-alpn-java-server, jetty-alpn-java-client) — a completely separate implementation with its own (unrelated) header-handling logic."},{"id":"CVE-2026-59901","file":"openvex/pingaccess/CVE-2026-59901.openvex.json","product":"pingaccess","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess ships Netty 4.1.118.Final. Bzip2Decoder is present in the JAR but is not a standard HTTP content-encoding and is not registered in PA's HTTP pipeline. Not exploitable."},{"id":"CVE-2026-59901","file":"openvex/pingauthorize/CVE-2026-59901.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"This CVE is not exploitable in PingAuthorize, as Bzip2Decoder is never instantiated or wired into any processing pipeline. Netty will be upgraded in PingAuthorize 11.2."},{"id":"CVE-2026-59901","file":"openvex/pingfederate/CVE-2026-59901.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"False Positive. Zero matches for Bzip2Decoder anywhere in PingFederate source. No bzip2 handling of any kind exists in the request/response pipeline."},{"id":"CVE-2026-59902","file":"openvex/pingfederate/CVE-2026-59902.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not Vulnerable. This CVE affects SctpMessageCompletionHandler in Netty's optional SCTP modules, which PingFederate does not ship. PingFederate includes Netty only as a transitive dependency of the Lettuce Redis client and the AWS SDK, which use Netty's core TCP transport, buffer, and HTTP codec modules — the SCTP transport and codec modules containing the vulnerable code are not present in any PingFederate release, and PingFederate does not accept or process SCTP traffic on any listener. Because the affected class is not on the classpath and no SCTP endpoint exists, the memory-exhaustion attack described in this CVE is not exploitable against PingFederate."},{"id":"CVE-2026-59903","file":"openvex/pingaccess/CVE-2026-59903.openvex.json","product":"pingaccess","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"While PingAccess utilizes the Netty framework for its high-performance networking, it does not use the specific vulnerable component (io.netty.handler.codec.http.cors.CorsHandler) to manage Cross-Origin Resource Sharing (CORS). Instead, PingAccess implements its own proprietary CORS logic through its Cross-Origin Request Rule system, which is not subject to the header-overwriting flaw described in this CVE. This is not exploitable within PA."},{"id":"CVE-2026-59903","file":"openvex/pingauthorize/CVE-2026-59903.openvex.json","product":"pingauthorize","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"The product handles CORS via its own servlet filter rather than Netty's CorsHandler, making CVE-2026-59903 non-exploitable."},{"id":"CVE-2026-59903","file":"openvex/pingfederate/CVE-2026-59903.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not exploitable for CVE-2026-59903. The bug is in Netty's server-side CorsHandler, but PF serves HTTP with Jetty and handles CORS in its own servlet filters - no PF code imports io.netty at all, and netty exists only as unused client-side transport (AWS SDK, lettuce — which doesn't even ship the affected netty-codec-http module)."},{"id":"CVE-2026-59919","file":"openvex/pingaccess/CVE-2026-59919.openvex.json","product":"pingaccess","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not exploitable in PingAccess 8.3. CVE-2026-59919 is a CRLF injection in Netty's HAProxy message encoder (HAProxyMessageEncoder writing AF_UNIX addresses to the V1 text protocol). The netty-codec-haproxy module is not included in the PingAccess distribution - no haproxy classes are present in any bundled jar - so the vulnerable component is absent. Additionally the attack requires an attacker-controlled local AF_UNIX socket address (AV:L), outside PingAccess's threat model for this path."},{"id":"CVE-2026-59919","file":"openvex/pingfederate/CVE-2026-59919.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not Vulnerable. This CVE affects HAProxyMessageEncoder in Netty's optional netty-codec-haproxy module, which PingFederate does not ship in any release. PingFederate includes Netty only as a transitive dependency of the Lettuce Redis client and the AWS SDK, which rely on Netty's core transport and HTTP modules; the HAProxy codec module containing the vulnerable encoder is not present on the classpath. Additionally, the vulnerability requires an application that actively emits HAProxy PROXY-protocol headers with attacker-controlled AF_UNIX socket addresses — a function PingFederate does not perform — so this issue is not exploitable against PingFederate."},{"id":"CVE-2026-59920","file":"openvex/pingaccess/CVE-2026-59920.openvex.json","product":"pingaccess","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not exploitable in PingAccess 8.3. CVE-2026-59920 is a header injection flaw in Netty's STOMP subframe encoder (StompSubframeEncoder). PingAccess does not use the STOMP protocol and the netty-codec-stomp module is not included in the distribution, so the vulnerable component is absent."},{"id":"CVE-2026-59920","file":"openvex/pingfederate/CVE-2026-59920.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not Vulnerable. This CVE affects StompSubframeEncoder in Netty's optional netty-codec-stomp module, which PingFederate does not include in any release. PingFederate carries Netty only as a transitive dependency of the Lettuce Redis client and the AWS SDK, which use Netty's core transport and HTTP modules; the STOMP codec module containing the vulnerable encoder is not present on the classpath. Furthermore, PingFederate does not implement or communicate over the STOMP messaging protocol in any capacity, so the header-injection scenario described in this CVE cannot occur in the product."},{"id":"CVE-2026-59921","file":"openvex/pingaccess/CVE-2026-59921.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess ships Netty 4.1.118.Final. HttpPostRequestEncoder is a client-side encoder; PingAccess does not reconstruct or re-encode multipart form data using this class. Attack vector is Adjacent (AV:A). Not exploitable."},{"id":"CVE-2026-59921","file":"openvex/pingfederate/CVE-2026-59921.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"False Positive. This vulnerability requires an application to use Netty as an HTTP client to construct outbound multipart requests with attacker-influenced filenames. A repo-wide grep for HttpPostRequestEncoder, DiskFileUpload, MemoryFileUpload, and MixedFileUpload across all of pf-server returns zero matches. PingFederate never builds outbound multipart HTTP requests via Netty — none of its HTTP client code (SCIM provisioning, outbound SAML/OIDC calls, notification integrations) uses this Netty API."},{"id":"CVE-2026-60147","file":"openvex/pingauthorize/CVE-2026-60147.openvex.json","product":"pingauthorize","pkg":"oracle-java-se","sub":"pkg:generic/oracle-java-se","just":"vulnerable_code_not_in_execute_path","notes":"These CVEs do not directly impact PingAuthorize itself, as they pertain specifically to the underlying Oracle JVM. The official patch from Oracle will be available on October 20, 2026. Our Engineering team will update the bundled Java versions in PingAuthorize container images and PingOne Advanced Services (P1AS) as applicable upon release. Customers running customer-managed PingAuthorize deployments will need to upgrade their underlying Oracle JVM instances directly once the patch is available."},{"id":"CVE-2026-62243","file":"openvex/pingaccess/CVE-2026-62243.openvex.json","product":"pingaccess","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"Not exploitable in PingAccess 8.3. CVE-2026-62243 disables TLS hostname verification on Netty's SslProvider.OPENSSL client path when a plain X509TrustManager is used and Unsafe-based trust-manager wrapping is unavailable (Java 25+). The vulnerable path requires Netty's native OpenSSL provider. PingAccess uses the JDK TLS provider - bytecode review of the 8.3.0 distribution found no references to Netty's OpenSSL provider in any PingAccess component - so the vulnerable path is unreachable. A general Netty upgrade is planned by engineering."},{"id":"CVE-2026-62243","file":"openvex/pingauthorize/CVE-2026-62243.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"Tequires a Netty client using SslProvider.OPENSSL with a plain X509TrustManager on Java 25+. The product's Netty usage is inside the AWS SDK/Azure stacks with their own default trust-manager wiring, the product doesn't select the OpenSSL provider for Netty itself, and the deployment JDK is Java 21 by default. Not exploitable."},{"id":"CVE-2026-62243","file":"openvex/pingfederate/CVE-2026-62243.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not Vulnerable. While PingFederate ships the netty-handler library in an affected version range, this vulnerability requires three conditions that are all absent in PingFederate: the application must use Netty's OpenSSL TLS provider (PingFederate does not ship the required netty-tcnative library, so Netty operates exclusively on the standard JDK TLS provider), the application must supply a plain non-extended X509TrustManager (PingFederate's only Netty TLS usage — the Lettuce Redis client — is configured with a truststore through a standard TrustManagerFactory), and the JVM must be Java 25 or later (PingFederate runs on Java 17/21). Because none of the required preconditions exist in the product, the hostname-verification bypass described in this CVE is not exploitable against PingFederate; the planned Netty upgrade will nonetheless move the library out of the affected range."},{"id":"CVE-2026-62574","file":"openvex/pingauthorize/CVE-2026-62574.openvex.json","product":"pingauthorize","pkg":"oracle-java-se","sub":"pkg:generic/oracle-java-se","just":"vulnerable_code_not_in_execute_path","notes":"These CVEs do not directly impact PingAuthorize itself, as they pertain specifically to the underlying Oracle JVM. The official patch from Oracle will be available on October 20, 2026. Our Engineering team will update the bundled Java versions in PingAuthorize container images and PingOne Advanced Services (P1AS) as applicable upon release. Customers running customer-managed PingAuthorize deployments will need to upgrade their underlying Oracle JVM instances directly once the patch is available."},{"id":"CVE-2026-64607","file":"openvex/pingfederate/CVE-2026-64607.openvex.json","product":"pingfederate","pkg":"httpclient","sub":"pkg:maven/org.apache.httpcomponents/httpclient","just":"inline_mitigations_already_exist","notes":"PingFederate adopted HttpClient5 in version 13.0.0. It uses the classic blocking client exclusively, and leaves content decompression enabled, so the leaky code path is live. The realistic impact is DoS-only: an attacker who gets PF to fetch an endpoint they control (e.g., a jwks_uri or CIMD metadata URL) can return bogus Content-Encoding headers to leak pooled connections until outbound OIDC/SOAP/datastore calls - and the SSO flows depending on them — start failing. Even on affected versions, the defect is a connection-pool resource leak (CWE-772) triggerable only by malformed responses from servers PingFederate connects to as an HTTP client; the impact is limited to availability of outbound connections (CVSS 3.1: 5.3 Medium, A:L — no confidentiality or integrity impact)."},{"id":"CVE-2026-6790","file":"openvex/pingaccess/CVE-2026-6790.openvex.json","product":"pingaccess","pkg":"jetty-server","sub":"pkg:maven/org.eclipse.jetty/jetty-server","just":"vulnerable_code_not_in_execute_path","notes":"Jetty 9.4.39 is shaded inside ehcache-2.10.9.2.jar as part of ehcache's REST management agent. PingAccess's ehcache configs contain no \u003cmanagementRESTService> configuration‚ the Jetty server is never started and never binds a port. Not exploitable."},{"id":"CVE-2026-6790","file":"openvex/pingfederate/CVE-2026-6790.openvex.json","product":"pingfederate","pkg":"jetty-server","sub":"pkg:maven/org.eclipse.jetty/jetty-server","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not meaningfully exposed to CVE-2026-6790. The underlying issue is that Jetty, on earlier versions across HTTP/1, HTTP/2, and HTTP/3, did not strictly enforce that the request authority matches the Host header, which the newer HTTP RFCs (9110/9112) now require. In PingFederate's runtime engine, however, the URLs used in redirects, endpoint metadata, and other security-relevant output are constructed from the administrator-configured base URL, and the request's hostname is only substituted in when it matches a configured virtual-host whitelist or a configured OAuth issuer. This means an attacker-supplied authority that isn't part of that configuration is simply disregarded rather than reflected back into any URL. We've also identified a small number of secondary locations that construct URLs more directly from the incoming request, and we're proactively hardening those as an additional defense-in-depth measure, along with planning an upgrade to a patched Jetty version in an upcoming release."},{"id":"CVE-2026-68494","file":"openvex/pingaccess/CVE-2026-68494.openvex.json","product":"pingaccess","pkg":"jackson-core","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-core","just":"component_not_present","notes":"Not affected. The vulnerability is in jackson-core's non-blocking (async) parser API; PingAccess does not use NonBlockingJsonParser, createNonBlockingByteArrayParser/ByteBufferParser, or AsyncInputFeeder anywhere in its code - only the standard synchronous parser. The vulnerable code path is unreachable. Jackson core will be refreshed in an upcoming maintenance release."},{"id":"CVE-2026-68494","file":"openvex/pingauthorize/CVE-2026-68494.openvex.json","product":"pingauthorize","pkg":"jackson-core","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-core","just":"inline_mitigations_already_exist","notes":"Exploitation requires using jackson-core's non-blocking API. There is no usage of NonBlockingJsonParser, createNonBlockingByteArrayParser, or AsyncInputFeeder anywhere in the product source. The product uses only the standard synchronous parser. Jackson will be upgraded in version 11.2 of the product"},{"id":"CVE-2026-68497","file":"openvex/pingaccess/CVE-2026-68497.openvex.json","product":"pingaccess","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"Not exploitable in PingAccess. The vulnerable path binds a JSON string to a javax.xml.datatype.Duration or XMLGregorianCalendar field, passing the raw string to DatatypeFactory where parsing is quadratic in digit count. PingAccess binds no javax.xml.datatype fields from JSON anywhere - verified zero references to javax.xml.datatype across all PingAccess jars; its deserialization targets use java.time, String, and numeric types. The deserializer is registered by default in jackson-databind but is never invoked because no bound type declares those fields. Clears with the Jackson refresh tracked under PA-16721."},{"id":"CVE-2026-68498","file":"openvex/pingauthorize/CVE-2026-68498.openvex.json","product":"pingauthorize","pkg":"jackson-core","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-core","just":"vulnerable_code_not_in_execute_path","notes":"See internal security assessment for CVE-2026-68498."},{"id":"CVE-2026-71290","file":"openvex/pingauthorize/CVE-2026-71290.openvex.json","product":"pingauthorize","pkg":"httpclient","sub":"pkg:maven/org.apache.httpcomponents/httpclient","just":"vulnerable_code_not_in_execute_path","notes":"PingAuthorize does not utilize the async client for this package and handles hostname verification directly via 'AbstractTrustService', making this CVE non-exploitable."},{"id":"CVE-2026-71497","file":"openvex/pingaccess/CVE-2026-71497.openvex.json","product":"pingaccess","pkg":"jsoup","sub":"pkg:maven/org.jsoup/jsoup","just":"vulnerable_code_not_in_execute_path","notes":"Not Exploitable. PA never uses jsoup's Cleaner/Safelist sanitizer; sole usage is Jsoup.parse for admin template validation"},{"id":"CVE-2026-71885","file":"openvex/pingaccess/CVE-2026-71885.openvex.json","product":"pingaccess","pkg":"bcpkix-jdk15on-non-fips","sub":"pkg:generic/bcpkix-jdk15on-non-fips@1.7","just":"component_not_present","notes":"Not affected. The vulnerability is in the Bouncy Castle MLS implementation (org.bouncycastle.mls) X.509 credential handling. The org.bouncycastle.mls package is not present in the bcpkix-jdk15on-1.70.jar shipped with PingAccess (zero mls classes in the jar) and PingAccess has no MLS functionality."},{"id":"CVE-2026-71888","file":"openvex/pingaccess/CVE-2026-71888.openvex.json","product":"pingaccess","pkg":"bcpkix-jdk15on-non-fips","sub":"pkg:generic/bcpkix-jdk15on-non-fips@1.7","just":"vulnerable_code_not_in_execute_path","notes":"Not affected. The vulnerability is in CMSAuthenticatedDataParser (streaming CMS AuthenticatedData authAttrs handling). The class is bundled inside bcpkix-jdk15on-1.70.jar but no PingAccess code references it - PingAccess does not parse CMS AuthenticatedData messages, so the vulnerable code path is unreachable."},{"id":"CVE-2026-71888","file":"openvex/pingauthorize/CVE-2026-71888.openvex.json","product":"pingauthorize","pkg":"bcpkix-jdk18on","sub":"pkg:generic/bcpkix-jdk18on@1.82","just":"vulnerable_code_not_in_execute_path","notes":"The product does not parse CMS AuthenticatedData messages, so attacker-inserted \\authAttrs` cannot reach the vulnerable code path. Therefore, this CVE is not exploitable."},{"id":"CVE-2026-71888","file":"openvex/pingfederate/CVE-2026-71888.openvex.json","product":"pingfederate","pkg":"bcpkix-fips-bcutil-fips","sub":"pkg:generic/bcpkix-fips-bcutil-fips","just":"component_not_present","notes":"PingFederate is not affected. The vulnerability resides in Bouncy Castle's CMS (Cryptographic Message Syntax / S-MIME) AuthenticatedData parser classes — CMSAuthenticatedDataParser and org.bouncycastle.asn1.cms.AuthenticatedData — and PingFederate does not use Bouncy Castle's CMS API anywhere in the product: there is no CMS, S/MIME, or authenticated-data message processing in any component. PingFederate's bundled Bouncy Castle FIPS libraries are used for JCE crypto primitives, TLS via the BC JSSE provider, OCSP response parsing, and key-derivation — none of which involve the affected parser classes — and we verified no CMS or reviewer class from the affected packages is referenced anywhere in the codebase. The unauthenticated-attribute-injection scenario requires an application that parses attacker-modifiable CMS AuthenticatedData messages, which does not apply to any PingFederate message flow. PingFederate will update the bundled Bouncy Castle libraries in an upcoming release to remediate the scanner finding."},{"id":"CVE-2026-71889","file":"openvex/pingaccess/CVE-2026-71889.openvex.json","product":"pingaccess","pkg":"bcprov-jdk15on-non-fips","sub":"pkg:generic/bcprov-jdk15on-non-fips@1.7","just":"vulnerable_code_not_in_execute_path","notes":"Not affected. The vulnerable PKIXCertPathReviewer class fails to enforce X.509 NameConstraints on the leaf certificate, but only when an application uses that class for trust decisions. The class is bundled inside bcprov-jdk15on-1.70.jar (note: in bcprov, not bcpkix as the scan path suggested), however PingAccess never calls it - certificate path validation uses the JDK java.security.cert.CertPathValidator with PKIXParameters (com.pingidentity.pa.certmgmt.util.X509CertPathValidationHelper)."},{"id":"CVE-2026-71889","file":"openvex/pingfederate/CVE-2026-71889.openvex.json","product":"pingfederate","pkg":"bcpkix-fips","sub":"pkg:generic/bcpkix-fips","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected. The vulnerability resides in Bouncy Castle's PKIXCertPathReviewer class, a standalone diagnostic/trust-decision utility; the advisory itself notes that Bouncy Castle's own CertPathValidator (\"PKIX\", \"BC\") implementation shares no code with the reviewer and correctly rejects affected chains. PingFederate never references PKIXCertPathReviewer in any release — we verified neither the modern (org.bouncycastle.pkix.jcajce) nor legacy (org.bouncycastle.x509) copy appears in the codebase. PingFederate performs certificate-path validation through its own CertPathValidator.PKIX wrapper (PKIXCertPathValidatorWrapper), which delegates explicitly to the JDK's Sun provider implementation rather than any Bouncy Castle reviewer, and certificate trust decisions in federation connections, TLS, and admin validation all flow through this JDK-backed path. The name-constraint bypass is therefore not reachable, and PingFederate will update the bundled Bouncy Castle libraries in an upcoming release to clear the scanner finding."},{"id":"CVE-2026-71892","file":"openvex/pingfederate/CVE-2026-71892.openvex.json","product":"pingfederate","pkg":"bcpkix-fips","sub":"pkg:generic/bcpkix-fips","just":"component_not_present","notes":"PingFederate is not affected. The vulnerability resides in Bouncy Castle's CMS key-transport recipient API (JceKeyTransRecipient with key-size validation enabled), which processes CMS EnvelopedData/AuthEnvelopedData messages using RFC 9709 content-encryption-key derivation — an API surface PingFederate does not use anywhere in the product: no CMS recipient, EnvelopedData, or key-transport processing code exists in any release, and the only key-derivation function PingFederate takes from Bouncy Castle is the X9.63 concatenation KDF used for ECDH key agreement in JWE token decryption, which shares no code with the affected CMS path. PingFederate's own XML encryption operations are performed through Apache Santuario's XMLCipher with explicit AES algorithm selection, not through Bouncy Castle's CMS stack. The silent key-size-validation bypass therefore cannot be triggered through any PingFederate message flow, and PingFederate will update the bundled Bouncy Castle libraries in the same upcoming release already planned for CVE-2026-71888 and CVE-2026-71889."},{"id":"CVE-2026-73507","file":"openvex/pingfederate/CVE-2026-73507.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not Vulnerable. This CVE affects the XmlFrameDecoder class in the optional netty-codec-xml module, which PingFederate does not ship or use. PingFederate includes Netty only as a transitive dependency of the Lettuce Redis client and the AWS SDK, which use Netty's core transport, buffer, and HTTP codec modules — the XML codec module containing the vulnerable code path is not present in any PingFederate release. Because the affected class is not on the classpath and no PingFederate feature performs XML frame decoding over Netty, the trickle-fed \u003c/ CPU-exhaustion attack described in this CVE is not exploitable against PingFederate."},{"id":"CVE-2026-73508","file":"openvex/pingauthorize/CVE-2026-73508.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"This CVE is not exploitable in the context of PingAuthorize, as none of the vulnerable classes are utilized by the product: DnsNameResolver, DnsResolver, DefaultDnsRecordDecoder, DnsCodecUtil, DnsRecord, and Netty DNS decoder classes."},{"id":"CVE-2026-73508","file":"openvex/pingfederate/CVE-2026-73508.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Affected version present - low exploitability. PingFederate ships the affected netty-codec-dns module as a transitive dependency of the Lettuce Redis client, so the vulnerable code is present on the classpath. However, this code path is only exercised when PingFederate is configured to use Redis for session/state storage, and exploitation requires an attacker who can return malformed DNS responses to PingFederate's resolver - meaning control of, or an on-path position relative to, the deployment's DNS infrastructure; the impact is limited to gradual memory exhaustion (denial of service), with no confidentiality or integrity effect. Ping Identity is addressing this by upgrading the bundled Netty libraries to a fixed version (4.2.16.Final or later) in an upcoming release; deployments not using Redis, or using trusted internal DNS, are not exposed in the interim."},{"id":"CVE-2026-75140","file":"openvex/pingaccess/CVE-2026-75140.openvex.json","product":"pingaccess","pkg":"jsoup","sub":"pkg:maven/org.jsoup/jsoup","just":"vulnerable_code_not_in_execute_path","notes":"Not exploitable in PingAccess 8.3. CVE-2026-75140 is uncontrolled resource consumption in jsoup's XmlTreeBuilder (deeply nested, uniquely-namespaced XML documents cause quadratic memory growth via inherited-namespace-map copying). PingAccess ships jsoup 1.17.2, which is in the affected range (through 1.23.2), but PingAccess never invokes jsoup's XML parser. The only jsoup usage is in TemplateValidator, which parses admin-submitted templates as HTML (org.jsoup.Jsoup.parse) to reject inline scripts. jsoup does not process XML payloads in PingAccess, so the vulnerable code path is unreachable."},{"id":"CVE-2026-75140","file":"openvex/pingfederate/CVE-2026-75140.openvex.json","product":"pingfederate","pkg":"jsoup","sub":"pkg:maven/org.jsoup/jsoup","just":"component_not_present","notes":"Not Vulnerable. This CVE affects the jsoup HTML/XML parsing library, which PingFederate does not ship, bundle, or depend on in any release — a review of the product's complete dependency inventory and shipped libraries confirms jsoup is not present. PingFederate's XML processing is performed by hardened Xerces/XMLBeans and JAXP parsers with entity-expansion limits, not jsoup. As the affected software is not present in the product, this vulnerability does not apply to PingFederate."},{"id":"CVE-2026-75595","file":"openvex/pingauthorize/CVE-2026-75595.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"The product does not operate a Netty server or use Netty TLS handlers, as all TLS termination is performed by Jetty. Therefore, this CVE is not exploitable."},{"id":"CVE-2026-75596","file":"openvex/pingfederate/CVE-2026-75596.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected by CVE-2026-75596. The affected code path is SniHandler, Netty's server-side TLS handler for SNI-based certificate selection, together with its ClientHello aggregation base class SslClientHelloHandler; PingFederate terminates TLS in the Jetty servlet container (or an upstream load balancer) and never in Netty, and a scan of the shipped libraries confirms that neither PingFederate code nor any bundled third-party library references either class. PingFederate's only runtime Netty usage is outbound client connections made by the bundled Redis client library, where SniHandler does not participate. The pre-handshake ClientHello aggregation path is therefore never invoked on any PingFederate endpoint; not exploitable, and no upgrade, mitigation, or configuration change is required."},{"id":"CVE-2026-77310","file":"openvex/pingaccess/CVE-2026-77310.openvex.json","product":"pingaccess","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"Not affected. The vulnerable branch is FromStringDeserializer's InetAddress type binding; PingAccess does not deserialize JSON into InetAddress/URL-typed fields anywhere - verified across all readValue call sites in the engine and admin code. The vulnerable code path is not reachable. Clears with the Jackson refresh tracked under PA-16721."},{"id":"CVE-2026-77310","file":"openvex/pingfederate/CVE-2026-77310.openvex.json","product":"pingfederate","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate uses vulnerable jackson-databind, which is affected by CVE-2026-77310. The vulnerable code path is reachable through stored session deserialization, but exploitation requires write access to session storage backends (JDBC, LDAP, or Redis). The library will be upgraded in a future release of PingFederate."},{"id":"CVE-2026-83557","file":"openvex/pingauthorize/CVE-2026-83557.openvex.json","product":"pingauthorize","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"component_not_present","notes":"The product does not use polymorphic deserialization with broad interface types like `Comparable`, restricting type resolution strictly to explicit registered names. Therefore, this CVE is not exploitable."},{"id":"CVE-2026-83663","file":"openvex/pingauthorize/CVE-2026-83663.openvex.json","product":"pingauthorize","pkg":"apache-thrift-go","sub":"pkg:generic/apache-thrift-go","just":"component_not_present","notes":"The product does not include or utilize Apache Thrift or its Go bindings, so this CVE is not applicable."},{"id":"CVE-2026-8384","file":"openvex/pingfederate/CVE-2026-8384.openvex.json","product":"pingfederate","pkg":"jetty-server","sub":"pkg:maven/org.eclipse.jetty/jetty-server","just":"inline_mitigations_already_exist","notes":"Repsonse varies for each PF version. Most PF versions use a non-vulnerable jetty version. PF 13.0 is still awaiting an upgrade. Two mitigating points: Jetty itself refuses to serve aliased/unresolved resources, so static-file disclosure is not the issue - the risk is only to application code that makes authorization decisions on the unresolved path. PingFederate's own routing/authz code uses exact equals() matches on getServletPath() and strips path parameters explicitly, so a /foo;/../bar confusion fails closed rather than bypassing anything. So practical exploitability is low."},{"id":"CVE-2026-85532","file":"openvex/pingfederate/CVE-2026-85532.openvex.json","product":"pingfederate","pkg":"wss4j","sub":"pkg:generic/wss4j","just":"component_not_present","notes":"PingFederate bundles Apache WSS4J 1.6.19, so scanner findings against the bundled jar are expected, but the vulnerable code path is not reachable. The issue lives in WSS4J's processing of attacker-supplied DerivedKeyToken elements in WS-Security message headers, and PingFederate does not use WSS4J's message-processing engine at all — no WSS4J handler, processor, or DerivedKeyToken resolution is invoked anywhere in the product. PingFederate's WS-Trust implementation derives proof keys through WSS4J's P_SHA1 algorithm class only, with the derivation parameters supplied by PingFederate's own KeyProvider, which restricts server-generated key sizes to the AES-128/192/256 set; combined-entropy derivation occurs within PingFederate's own authenticated token-issuance flow, which requires a presenting authentication token before any key derivation takes place. PingFederate will upgrade the bundled WSS4J in an upcoming release to remediate the scanner finding; the unbounded derived-key handling described by this advisory is not exercised by any PingFederate code path."},{"id":"CVE-2026-8763","file":"openvex/pingauthorize/CVE-2026-8763.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"In the default (non-FIPS) configuration, the JDK's built-in PKIX trust manager handles certificate validation and name constraints; Bouncy Castle is not in that path."},{"id":"CVE-2026-8798","file":"openvex/pingauthorize/CVE-2026-8798.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"This CVE affects PingAuthorize only when running in FIPS-compliant mode using bc-fips 2.x on Intel x86/x86-64 hardware. Deployments utilizing FIPS 140-2 mode (bc-fips 1.0.x) or operating on non-Intel architectures are not affected. Customers requiring immediate mitigation can manually replace the bc-fips library with an updated version. No additional code or configuration changes are required. The bundled library will be officially upgraded in the PingAuthorize 11.2 release."},{"id":"CVE-2026-88920","file":"openvex/pingfederate/CVE-2026-88920.openvex.json","product":"pingfederate","pkg":"wss4j","sub":"pkg:generic/wss4j","just":"component_not_present","notes":"PingFederate bundles Apache WSS4J 1.6.19 and the latest release also ships 1.6.19, both outside the fixed version list, so scanner findings against the bundled jar are expected. The vulnerability resides in WSS4J's DOM security processing engine, which authenticates inbound WS-Security message signatures; PingFederate does not use this engine for any message processing — no WSS4J handler, processor, or signature-validation class is invoked anywhere in the product. PingFederate implements its own WS-Trust STS, and SAML assertion signatures are verified exclusively through PingFederate's own XmlSignatureVerifier, which is built directly on Apache Santuario; the only WSS4J class PingFederate calls is the P_SHA1 key-derivation algorithm for WS-SecureConversation key exchange, which is untouched by this issue. The affected authentication-bypass path is therefore not reachable in PingFederate, and PingFederate will upgrade the bundled library in an upcoming release solely to remediate the scanner finding."},{"id":"CVE-2026-89044","file":"openvex/pingaccess/CVE-2026-89044.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"Multiple Netty releases bundled in maintenance versions of PingAccess 8.3.x contain the vulnerable library (CVE-2026-89044 - HTTP request smuggling via malformed Transfer-Encoding declarations). PingAccess 8.3 GA is not affected. The remediation ships in the upcoming PingAccess 8.3.6 maintenance release, which bundles a Netty version outside the affected range; the fix can be tracked under PA-16568."},{"id":"CVE-2026-89238","file":"openvex/pingfederate/CVE-2026-89238.openvex.json","product":"pingfederate","pkg":"wss4j","sub":"pkg:generic/wss4j","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected. The bundled WSS4J 1.6.19 is present only as a library dependency, and PingFederate never invokes WSS4J's message-processing pipeline: encrypted SOAP headers are not processed by WSS4J anywhere in the product, and PingFederate's WS-Trust implementation performs its own XML encryption and decryption through Apache Santuario (XMLCipher) and its own signature verification. The EncryptedHeader child-confusion behavior occurs inside WSS4J's header decryption processor, which is unreachable from any PingFederate code path. PingFederate will include the WSS4J upgrade in an upcoming release to clear the scanner finding; there is no exposure to incorrect confidentiality coverage or policy bypass in PingFederate itself."},{"id":"CVE-2026-8940","file":"openvex/pingfederate/CVE-2026-8940.openvex.json","product":"pingfederate","pkg":"wp-meta-sort-posts-wordpress-plugin","sub":"pkg:generic/wp-meta-sort-posts-wordpress-plugin","just":"vulnerable_code_not_in_execute_path","notes":"Not applicable. CVE-2026-8940 is a cross-site request forgery flaw in \"WP Meta Sort Posts\", a third-party WordPress plugin, and PingFederate contains no WordPress component, PHP code, or any software from this vendor; the finding has no relationship to PingFederate and appears to be a scanning error or a misattributed component in the customer's environment. No action is required."},{"id":"CVE-2026-89407","file":"openvex/pingaccess/CVE-2026-89407.openvex.json","product":"pingaccess","pkg":"jackson-core","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-core","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess 8.3 bundles jackson-core 2.17.0, at the boundary of the affected range (the flaw was introduced in exactly 2.17.0). The vulnerable method (NumberInput.looksLikeValidNumber) runs when Jackson deserializes a JSON string into a numeric-typed field with attacker-controlled length. PingAccess does not deserialize untrusted client request bodies via Jackson into typed objects - inbound request bodies are proxied, not bound. The JSON PingAccess parses comes from the configured, trusted token provider (RFC 7662 introspection responses, PingFederate, PingOne) or from PA-signed/-encrypted structures (the OIDC state JSON is JWE-protected, so clients cannot inject arbitrary content). No unauthenticated-attacker path to numeric-string coercion exists; the library refresh ships in an upcoming maintenance release."},{"id":"CVE-2026-89407","file":"openvex/pingauthorize/CVE-2026-89407.openvex.json","product":"pingauthorize","pkg":"jackson-core","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-core","just":"vulnerable_code_not_in_execute_path","notes":"A denial-of-service vulnerability (CVE-2026-89407) was identified in jackson-core, a JSON-processing library bundled with PingAuthorize. Ping Identity has confirmed the issue is exploitable through the administrative definition API and a fix will ship in the next maintenance release. Ping Identity has assigned a Medium severity to the finding."},{"id":"CVE-2026-89407","file":"openvex/pingfederate/CVE-2026-89407.openvex.json","product":"pingfederate","pkg":"jackson-core","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-core","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate 12.3 is not affected: it ships jackson-core 2.12.7, and the vulnerable NumberInput.looksLikeValidNumber() method does not exist in jackson-core releases prior to 2.17.0, which we verified against the shipped artifact. The latest PingFederate release ships jackson-core 2.21.1, which does contain the affected method and regular expressions, so that release is affected; the method is reachable through jackson-databind's default string-to-number coercion when deserializing JSON into numeric target types. PingFederate will remediate in an upcoming release by upgrading to the jackson-core version containing the fix, which replaces the backtracking regular expressions with a single-pass scan. Exposure on affected builds is mitigated by the fact that the reachable deserialization points are administrative interfaces requiring authenticated access."},{"id":"CVE-2026-89425","file":"openvex/pingaccess/CVE-2026-89425.openvex.json","product":"pingaccess","pkg":"jackson-core","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-core","just":"vulnerable_code_not_in_execute_path","notes":"Not exploitable in PingAccess. The vulnerable method (UTF8DataInputJsonParser._reportInvalidToken) is only reachable through parsers created from a java.io.DataInput source (JsonFactory.createParser(DataInput)). PingAccess contains exactly one such call site: the Java-serialization readObject() of its internal ImmutableJsonNode type, used for cluster-internal object transfer - not an HTTP input path. No attacker-controlled JSON reaches a DataInput-based parser, and the unbounded error-token accumulation cannot be triggered."},{"id":"CVE-2026-89425","file":"openvex/pingauthorize/CVE-2026-89425.openvex.json","product":"pingauthorize","pkg":"jackson-core","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-core","just":"vulnerable_code_not_in_execute_path","notes":"The application does not instantiate the vulnerable DataInput-backed Jackson parser. Therefore, this CVE is not exploitable."},{"id":"CVE-2026-89425","file":"openvex/pingfederate/CVE-2026-89425.openvex.json","product":"pingfederate","pkg":"jackson-core","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-core","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected in 12.3 or the latest release. The vulnerability requires a parser created via JsonFactory.createParser(DataInput); PingFederate's JSON handling creates parsers only from InputStream and String sources, and we found no DataInput-based parser creation anywhere in the codebase. While the UTF8DataInputJsonParser class is present in the bundled jackson-core, the unreachable creation path means the accumulation behavior cannot be triggered by malformed request content. No upgrade is required for this issue specifically."},{"id":"CVE-2026-91776","file":"openvex/pingaccess/CVE-2026-91776.openvex.json","product":"pingaccess","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"component_not_present","notes":"Not exploitable in PingAccess. The deserializer-cache growth requires name-based polymorphic deserialization (JSON type IDs resolving through a default implementation) with attacker-controlled type identifiers. PingAccess does not use polymorphic type handling: no @JsonTypeInfo/@JsonSubTypes annotations, no activateDefaultTyping/enableDefaultTyping, and no ObjectMapper configuration that enables type resolution - verified across the engine and admin code. The required deserialization feature does not exist in the product."},{"id":"CVE-2026-91776","file":"openvex/pingfederate/CVE-2026-91776.openvex.json","product":"pingfederate","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"The affected caching behavior is present in the jackson-databind versions shipped by both 12.3 (2.12.7.1) and the latest release (2.21.1), which we confirmed at the bytecode level: fallback resolutions for unrecognized type IDs are cached without bound. Exploitation requires an endpoint that deserializes attacker-influenced type IDs into a polymorphic model with a fallback (defaultImpl) - in PingFederate these are Admin API configuration models (e.g., connection attribute sources), which require administrative privileges, and unknown type IDs are rejected by downstream validation even though the cache entry is created first. PingFederate will address this in an upcoming release by upgrading to the fixed jackson-databind version, which stops caching fallback resolutions and bounds the cache and cacheable ID length. The administrative authentication requirement substantially limits practical exposure in the meantime."},{"id":"CVE-2026-91777","file":"openvex/pingaccess/CVE-2026-91777.openvex.json","product":"pingaccess","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"Not exploitable in PingAccess. The quadratic forward-reference resolution requires deserializing attacker-controlled JSON into @JsonIdentityInfo-enabled collections or maps. PingAccess uses no @JsonIdentityInfo annotations anywhere, and its deserialization targets are specific response bean types (from trusted token providers) or plain JsonNode trees, which do not perform object-ID reference resolution."},{"id":"CVE-2026-91777","file":"openvex/pingfederate/CVE-2026-91777.openvex.json","product":"pingfederate","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected in 12.3 or the latest release. The quadratic scan only executes when deserializing identity-enabled (@JsonIdentityInfo) collections or maps containing unresolved forward object references, and the PingFederate codebase contains no @JsonIdentityInfo usage or other object-identity deserialization configuration in any release. The affected path is therefore unreachable from any PingFederate deserialization entry point, and no upgrade is required for this issue."},{"id":"CVE-2026-92877","file":"openvex/pingauthorize/CVE-2026-92877.openvex.json","product":"pingauthorize","pkg":"jaxb-ri","sub":"pkg:generic/jaxb-ri@4.0.6","just":"vulnerable_code_not_in_execute_path","notes":"The product's XML unmarshalling is limited to internally bundled MIB definition files; no externally supplied XML is processed through JAXB. Therefore the CVE is not exploitable."},{"id":"CVE-2026-92899","file":"openvex/pingfederate/CVE-2026-92899.openvex.json","product":"pingfederate","pkg":"wss4j","sub":"pkg:generic/wss4j","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected. The vulnerability resides in WSS4J's UsernameToken nonce replay cache - the component (used by Apache CXF) that remembers previously accepted token nonces and compares them as raw base64 text rather than decoded bytes, allowing a whitespace-padded re-encoding of the same nonce to evade the cache; PingFederate neither bundles Apache CXF nor uses WSS4J's security engine or any nonce replay cache in any release. PingFederate's WS-Trust implementation processes UsernameTokens through its own UsernameTokenProcessor, which validates credentials directly against configured Password Credential Validators and performs no nonce tracking whatsoever — the token model carries the nonce field, but no PingFederate code path stores or compares it, so the base64-canonicalization gap has nothing to bypass. The only WSS4J class PingFederate invokes remains the P_SHA1 key-derivation algorithm, as established in the CVE-2026-88920/85532/95616 dispositions. PingFederate will upgrade the bundled WSS4J in the upcoming release already planned for the other WSS4J findings."},{"id":"CVE-2026-93488","file":"openvex/pingaccess/CVE-2026-93488.openvex.json","product":"pingaccess","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not exploitable in PingAccess. The vulnerable component is Netty's SPDY codec (SpdySessionHandler, netty-codec-spdy), which PingAccess does not ship in any release and has never configured: no SPDY classes are present in any bundled jar, and no SPDY handler is added to any PingAccess pipeline."},{"id":"CVE-2026-93488","file":"openvex/pingauthorize/CVE-2026-93488.openvex.json","product":"pingauthorize","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"The application does not instantiate a Netty server pipeline or configure the SPDY codec. Because the vulnerable code path is completely unreachable, CVE-2026-93488 is not exploitable. The dependency will be updated in a future release as updated AWS SDK versions are integrated."},{"id":"CVE-2026-93491","file":"openvex/pingaccess/CVE-2026-93491.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"Not exploitable in PingAccess. Although the vulnerable class (HttpServerCodec, netty-codec-http) is present in the bundled Netty jar, PingAccess never installs it: the front-end pipeline uses PingAccess's own FrontEndHttpRequestDecoder (extends HttpObjectDecoder) and FrontEndHttpResponseEncoder pair, and no PingAccess code references HttpServerCodec. The unbounded methodOverflowQueue growth described in the advisory is specific to HttpServerCodec's combined decoder/encoder queue."},{"id":"CVE-2026-93491","file":"openvex/pingauthorize/CVE-2026-93491.openvex.json","product":"pingauthorize","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"component_not_present","notes":"The application does not install the vulnerable HttpServerCodec handler in any listening server pipeline. Therefore, this CVE is not exploitable."},{"id":"CVE-2026-93492","file":"openvex/pingfederate/CVE-2026-93492.openvex.json","product":"pingfederate","pkg":"netty-codec-http2","sub":"pkg:maven/io.netty/netty-codec-http2","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected by CVE-2026-93492. The affected HpackEncoder lives in netty-codec-http2, which is absent from PingFederate 13.2 and, in 12.3, 13.0, and 13.1, present only as an unused transitive of the AWS SDK's asynchronous Netty transport; the attack requires an attacker speaking HTTP/2 directly to a Netty endpoint, and PingFederate never operates Netty as an HTTP/2 server or proxy (its HTTP endpoints are Jetty, and its AWS integrations use the Apache transport). Not exploitable; no change is required."},{"id":"CVE-2026-93493","file":"openvex/pingfederate/CVE-2026-93493.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"PingFederate is not affected by CVE-2026-93493. The netty-handler-ssl-ocsp module is not bundled with PingFederate in any supported release; certificate revocation checking (OCSP) is performed by the JDK and Bouncy Castle certificate path validation stacks, not by Netty, so the affected OCSP response validator is never present at runtime. No change is required."},{"id":"CVE-2026-93494","file":"openvex/pingaccess/CVE-2026-93494.openvex.json","product":"pingaccess","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not exploitable in PingAccess. The vulnerable component is Netty's STOMP codec (StompSubframeDecoder, netty-codec-stomp), which PingAccess does not ship in any release: no STOMP codec classes are present in any bundled jar."},{"id":"CVE-2026-93558","file":"openvex/pingaccess/CVE-2026-93558.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"Not exploitable in PingAccess. Although the vulnerable class (WebSocketServerExtensionHandler, netty-codec-http) is present in the bundled Netty jar, PingAccess never installs it: WebSocket handling in PingAccess is implemented by its own WebSocketOriginInterceptor with a strict version-13-only upgrade check, and no PingAccess code references Netty's WebSocket server extension or handshaker classes. The unbounded per-connection queue described in the advisory is specific to WebSocketServerExtensionHandler's pipelining path."},{"id":"CVE-2026-93560","file":"openvex/pingaccess/CVE-2026-93560.openvex.json","product":"pingaccess","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not exploitable in PingAccess. The vulnerable component is Netty's STOMP codec content-length integer-truncation path (netty-codec-stomp), which PingAccess does not ship in any release: no STOMP codec classes are present in any bundled jar."},{"id":"CVE-2026-93561","file":"openvex/pingfederate/CVE-2026-93561.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"PingFederate is not affected by CVE-2026-93561. The netty-codec-memcache module is not bundled with PingFederate in any supported release (12.3 through 13.2), and PingFederate does not speak the memcache protocol, so the vulnerable code path - parsing binary responses from a memcache server - does not exist in the product. No upgrade, mitigation, or configuration change is required."},{"id":"CVE-2026-93562","file":"openvex/pingfederate/CVE-2026-93562.openvex.json","product":"pingfederate","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected by CVE-2026-93562. The affected Transfer-Encoding validation is in netty-codec-http, which is absent from PingFederate 13.2 and, in 12.3, 13.0, and 13.1, present only as an unused transitive of the AWS SDK's asynchronous Netty transport; PingFederate's HTTP processing is handled by Jetty, and the Netty codec never parses incoming or outgoing HTTP messages. Not exploitable; no change is required."},{"id":"CVE-2026-93563","file":"openvex/pingaccess/CVE-2026-93563.openvex.json","product":"pingaccess","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not exploitable in PingAccess. The vulnerable component is Netty's SMTP client response decoder (SmtpResponseDecoder, netty-codec-smtp), which PingAccess does not ship in any release: no SMTP codec classes are present in any bundled jar."},{"id":"CVE-2026-93564","file":"openvex/pingaccess/CVE-2026-93564.openvex.json","product":"pingaccess","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not exploitable in PingAccess. The vulnerable component is Netty's HAProxy PROXY-protocol v2 decoder (netty-codec-haproxy), which PingAccess does not ship in any release: no HAProxy codec classes are present in any bundled jar and no PROXY-protocol handler is added to any PingAccess pipeline."},{"id":"CVE-2026-93565","file":"openvex/pingaccess/CVE-2026-93565.openvex.json","product":"pingaccess","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not exploitable in PingAccess. The vulnerable component is Netty's RTSP codec (netty-codec-rtsp), which PingAccess does not ship in any release: no RTSP codec classes are present in any bundled jar. The bundled set covers only the HTTP/1.1 proxy stack and its supporting modules."},{"id":"CVE-2026-93566","file":"openvex/pingfederate/CVE-2026-93566.openvex.json","product":"pingfederate","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"component_not_present","notes":"PingFederate is not affected by CVE-2026-93566. PingFederate's own HTTP endpoints are served by Jetty, not Netty; the netty-codec-http module is not present in PingFederate 13.2 at all, and in PingFederate 12.3, 13.0, and 13.1 it is present only as an unused transitive of the AWS SDK's asynchronous Netty transport - PingFederate's AWS integrations (such as DynamoDB) use the SDK's Apache HTTP transport, so the Netty HTTP parser never processes network data. Not exploitable; no change is required."},{"id":"CVE-2026-93567","file":"openvex/pingaccess/CVE-2026-93567.openvex.json","product":"pingaccess","pkg":"netty-codec-http2","sub":"pkg:maven/io.netty/netty-codec-http2","just":"component_not_present","notes":"Not exploitable in PingAccess. The vulnerable component is the Netty HTTP/2 codec's HTTP/1 CONNECT-to-HTTP/2 conversion (Host header versus authority-form request-target), in netty-codec-http2, which PingAccess does not ship in any release: no io.netty.handler.codec.http2 classes are present in any bundled jar."},{"id":"CVE-2026-93568","file":"openvex/pingaccess/CVE-2026-93568.openvex.json","product":"pingaccess","pkg":"netty-codec-http2","sub":"pkg:maven/io.netty/netty-codec-http2","just":"component_not_present","notes":"Not exploitable in PingAccess. The vulnerable component is the Netty HTTP/1-to-HTTP/2 conversion path in netty-codec-http2, which PingAccess does not ship in any release: the customer-scanned path names netty-codec-http2-4.1.118.Final.jar, but that jar is not present in the PingAccess distribution and no io.netty.handler.codec.http2 classes are present in any bundled jar. PingAccess terminates HTTP/1.1 on its listeners; HTTP/2 is not enabled on the front-end pipeline."},{"id":"CVE-2026-93569","file":"openvex/pingaccess/CVE-2026-93569.openvex.json","product":"pingaccess","pkg":"netty-codec-http2","sub":"pkg:maven/io.netty/netty-codec-http2","just":"component_not_present","notes":"Not exploitable in PingAccess. The vulnerable component is the Netty HTTP/1-to-HTTP/2 conversion path in netty-codec-http2 (absolute-form request-target versus Host header authority handling), which PingAccess does not ship in any release: no io.netty.handler.codec.http2 classes are present in any bundled jar."},{"id":"CVE-2026-93572","file":"openvex/pingaccess/CVE-2026-93572.openvex.json","product":"pingaccess","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not exploitable in PingAccess. The vulnerable components are Netty's Redis codec classes (RedisDecoder/RedisArrayAggregator, netty-codec-redis), which PingAccess does not ship in any release: no Redis codec classes are present in any bundled jar."},{"id":"CVE-2026-93573","file":"openvex/pingfederate/CVE-2026-93573.openvex.json","product":"pingfederate","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected by CVE-2026-93573. The affected Transfer-Encoding validation is in netty-codec-http, which is absent from PingFederate 13.2 and, in 12.3, 13.0, and 13.1, present only as an unused transitive of the AWS SDK's asynchronous Netty transport that PingFederate does not engage. The vulnerable parser never processes network data; no change is required."},{"id":"CVE-2026-93574","file":"openvex/pingfederate/CVE-2026-93574.openvex.json","product":"pingfederate","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"component_not_present","notes":"PingFederate is not affected by CVE-2026-93574. As with CVE-2026-93566, the affected HTTP/1.1 chunked-transfer parser lives in netty-codec-http, which is absent from PingFederate 13.2 and, in 12.3, 13.0, and 13.1, present only as an unused transitive of the AWS SDK's asynchronous Netty transport that PingFederate does not use. The vulnerable parser is never invoked on network data; no change is required."},{"id":"CVE-2026-93575","file":"openvex/pingaccess/CVE-2026-93575.openvex.json","product":"pingaccess","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not exploitable in PingAccess. The vulnerable component is Netty's MQTT codec (MqttDecoder, netty-codec-mqtt), which PingAccess does not ship in any release: no MQTT codec classes are present in any bundled jar."},{"id":"CVE-2026-93576","file":"openvex/pingaccess/CVE-2026-93576.openvex.json","product":"pingaccess","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not exploitable in PingAccess. The vulnerable component is Netty's SMTP codec (netty-codec-smtp), which PingAccess does not ship in any release: the PingAccess distribution bundles only netty-buffer, netty-codec, netty-codec-http, netty-codec-socks, netty-common, netty-handler, netty-handler-proxy, netty-resolver and netty-transport, and no SMTP codec classes are present in any bundled jar."},{"id":"CVE-2026-93578","file":"openvex/pingfederate/CVE-2026-93578.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"PingFederate is not affected by CVE-2026-93578. The affected code is Netty's OCSP client in the netty-handler-ssl-ocsp module, which is not bundled with PingFederate in any supported release; Netty is never used for certificate status validation, and OCSP inquiries are handled by the JDK and Bouncy Castle stacks. No change is required."},{"id":"CVE-2026-93579","file":"openvex/pingfederate/CVE-2026-93579.openvex.json","product":"pingfederate","pkg":"netty-codec-http2","sub":"pkg:maven/io.netty/netty-codec-http2","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected by CVE-2026-93579. The affected HTTP/2 header validation is in netty-codec-http2, which is absent from PingFederate 13.2 and, in 12.3, 13.0, and 13.1, present only as an unused transitive of the AWS SDK's asynchronous Netty transport; the smuggling scenarios require a Netty-based HTTP/2 endpoint translating to HTTP/1.1, a role PingFederate does not run Netty in. Not exploitable; no change is required."},{"id":"CVE-2026-94637","file":"openvex/pingauthorize/CVE-2026-94637.openvex.json","product":"pingauthorize","pkg":"apache-thrift-go","sub":"pkg:generic/apache-thrift-go","just":"component_not_present","notes":"The product does not include or utilize Apache Thrift or its Go bindings, so this CVE is not applicable."},{"id":"CVE-2026-95616","file":"openvex/pingfederate/CVE-2026-95616.openvex.json","product":"pingfederate","pkg":"wss4j","sub":"pkg:generic/wss4j","just":

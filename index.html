openvex/pingauthorize/CVE-2026-41850.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"This CVE is not exploitable within the Admin Console because the application does not evaluate user-supplied SpEL expressions."},{"id":"CVE-2026-41851","file":"openvex/pingauthorize/CVE-2026-41851.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"While the vulnerability is theoretically exploitable, it requires highly privileged access, as only administrators are permitted to create SpEL definitions. The affected component will be upgraded in the upcoming 2026.Q3 release."},{"id":"CVE-2026-41852","file":"openvex/pingauthorize/CVE-2026-41852.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"This CVE is not exploitable within the Admin Console because the application does not evaluate user-supplied SpEL expressions."},{"id":"CVE-2026-41853","file":"openvex/pingauthorize/CVE-2026-41853.openvex.json","product":"pingauthorize","pkg":"spring-web","sub":"pkg:maven/org.springframework/spring-web","just":"vulnerable_code_not_in_execute_path","notes":"This CVE is not exploitable within the Admin Console because the application does not accept or process multipart requests; therefore, the core prerequisites for this smuggling vector are not met. Spring framework dependencies are scheduled to be updated in version 11.2 of the product."},{"id":"CVE-2026-41854","file":"openvex/pingauthorize/CVE-2026-41854.openvex.json","product":"pingauthorize","pkg":"spring-web","sub":"pkg:maven/org.springframework/spring-web","just":"vulnerable_code_not_in_execute_path","notes":"This CVE is not exploitable within the Admin Console as it does not invoke UriComponentsBuilder methods using user-controlled URIs."},{"id":"CVE-2026-41855","file":"openvex/pingauthorize/CVE-2026-41855.openvex.json","product":"pingauthorize","pkg":"spring-web","sub":"pkg:maven/org.springframework/spring-web","just":"component_not_present","notes":"False positive: PingAuthorize does not utilize JMS components, rendering this finding non-exploitable. Additionally, PingAuthorize 11.1 updates the Spring Framework to a patched, non-vulnerable release."},{"id":"CVE-2026-41889","file":"openvex/pingauthorize/CVE-2026-41889.openvex.json","product":"pingauthorize","pkg":"sanitize","sub":"pkg:gem/sanitize","just":"component_not_present","notes":"/opt/pdp/bin/vault tool is not included in the standard distribution of PingAuthorize. Please provide more details."},{"id":"CVE-2026-41901","file":"openvex/pingauthorize/CVE-2026-41901.openvex.json","product":"pingauthorize","pkg":"thymeleaf","sub":"pkg:maven/org.thymeleaf/thymeleaf","just":"component_not_present","notes":"The Thymeleaf component is a transitive dependency for spring-boot which is used by PingData Administrative console. The CVE is not exploitable in the context of the admin console application. Additionally this component is an addon and can be safely disabled and removed if necessary. The library will be removed starting version 11.2 (Q3 2026) of the product."},{"id":"CVE-2026-41907","file":"openvex/pingam/CVE-2026-41907.openvex.json","product":"pingam","pkg":"uuid","sub":"pkg:generic/uuid","just":"vulnerable_code_not_in_execute_path","notes":"No immediate action required for runtime security — the vulnerable code path is not reachable in any supported PingAM configuration. Monitor xxxx... for the uuid upgrade to 14.0.0 and apply when a PingAM patch release is available. If customer scanners flag this CVE, reference xxxx... and the engineering non-exploitability rationale (uuid v4 only, no buffer argument)."},{"id":"CVE-2026-42198","file":"openvex/pingauthorize/CVE-2026-42198.openvex.json","product":"pingauthorize","pkg":"postgresql","sub":"pkg:maven/org.postgresql/postgresql","just":"vulnerable_code_not_in_execute_path","notes":"This attack requires a compromised Postgres DB server. PostgreSQL will be upgraded to 42.7.11 in the upcoming version of the product (June 2026)."},{"id":"CVE-2026-42246","file":"openvex/pingam/CVE-2026-42246.openvex.json","product":"pingam","pkg":"net-imap-0-2-3-inside-jruby-stdlib-9-4-11-0-jar","sub":"pkg:generic/net-imap-0-2-3-inside-jruby-stdlib-9-4-11-0-jar","just":"inline_mitigations_already_exist","notes":"No immediate action required for runtime risk. Disable API Explorer in production if not already done (https://docs.pingidentity.com/pingam/7.4/am-rest/about-api-explorer.html). Apply the next available PingAM maintenance release when it ships a JRuby upgrade that bundles net-imap >= 0.3.10; track xxxx... for fix availability. A full remediation requires JRuby 10.x which is blocked until PingAM mandates Java 21 minimum and asciidoctorj 4.0.0 is released — no confirmed ETA as of 2026-06-09."},{"id":"CVE-2026-42257","file":"openvex/pingam/CVE-2026-42257.openvex.json","product":"pingam","pkg":"net-imap","sub":"pkg:generic/net-imap","just":"component_not_present","notes":"No action required for runtime security. Customers whose scanners flag this finding can be advised that net-imap is a non-executed transitive dependency inside jruby-stdlib and is not reachable through any supported PingAM configuration. If the API Explorer feature is enabled, disable it in production as per Ping guidance. Monitor xxxx... for a future JRuby upgrade that includes net-imap 0.4.24+ if compliance policy requires library-level remediation."},{"id":"CVE-2026-42258","file":"openvex/pingam/CVE-2026-42258.openvex.json","product":"pingam","pkg":"net-imap","sub":"pkg:generic/net-imap","just":"vulnerable_code_not_in_execute_path","notes":"No action required for security remediation. Customers whose scanners flag this CVE can be informed it is a false-positive scanner finding (transitive JRuby stdlib gem, no active IMAP usage in PingAM). A JRuby upgrade to address the net-imap family is tracked under xxxx... but has no committed release date; customers may apply that update when available to eliminate scanner noise."},{"id":"CVE-2026-42499","file":"openvex/pingauthorize/CVE-2026-42499.openvex.json","product":"pingauthorize","pkg":"go","sub":"pkg:golang/github.com/golang/go","just":"component_not_present","notes":"The reported Golang vulnerabilities originate from operating-system–level packages (for example, git-lfs) present in the PingAuthorize container’s Alpine base image, not from PingAuthorize itself. Although these packages are implemented in Golang and therefore include Go standard libraries, PingAuthorize does not ship, invoke, or depend on any Go-based binaries or libraries as part of its runtime. There is no execution path by which PingAuthorize can trigger or leverage Golang components: 1. PingAuthorize is a Java-based application; 2. The affected Go binaries are not called by PingAuthorize during normal operation; 3. Exploitation would require direct execution of the OS-level binary, which is outside the PingAuthorize threat model and unrelated to product functionality. If a Golang vulnerability were to be identified that is exploitable through an OS-level package independently of PingAuthorize, remediation would be handled via base image or operating system updates, not via PingAuthorize code or configuration changes."},{"id":"CVE-2026-42577","file":"openvex/pingauthorize/CVE-2026-42577.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"PingAuthorize does not utilize Netty's epoll transport mode. Netty will be upgraded to 4.2.13 in the upcoming version of the product (June 2026)."},{"id":"CVE-2026-42578","file":"openvex/pingaccess/CVE-2026-42578.openvex.json","product":"pingaccess","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"Not impacted in PingAccess 9.1 / Docker image tag 2607-9.1.0. CVE-2026-42578 affects Netty prior to 4.1.133.Final / 4.2.13.Final: Netty's HttpProxyHandler constructed HTTP CONNECT requests with header validation disabled, allowing header injection into the CONNECT request when an attacker can influence the outbound headers. Verification was performed directly against the pingidentity/pingaccess:2607-9.1.0 image: /opt/server/lib contains only Netty 4.1.135.Final jars, and bytecode inspection of the shipped netty-handler-proxy-4.1.135.Final.jar confirms initial-header validation is enabled by default in this release, so the vulnerable pattern is fixed. No other jar in the image bundles or shades Netty; the only io.netty references outside the Netty jars are OpenTelemetry javaagent instrumentation shims. No remediation is needed for this CVE on 2607-9.1.0."},{"id":"CVE-2026-42579","file":"openvex/pingauthorize/CVE-2026-42579.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"PingAuthorize does not use Netty to process DNS responses. Netty will be upgraded to 4.2.13 in the upcoming version of the product (June 2026)."},{"id":"CVE-2026-42580","file":"openvex/pingaccess/CVE-2026-42580.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess 8.3 bundles Netty versions within the affected range (4.1.118 in 8.3.0; 4.1.132 in 8.3.x maintenance builds). The chunk-size integer-overflow parsing flaw is present, but PingAccess is a parse-and-re-encode proxy: inbound chunk framing is parsed by the front-end decoder and re-serialized with correct sizes and strict CRLF framing to the origin, so an overflow-induced framing ambiguity is not forwarded to the origin. Exploitability is limited to deployments where PingAccess sits behind another proxy that parses chunk framing differently. PingAccess 8.3.6 bundles Netty 4.1.138, outside the affected range."},{"id":"CVE-2026-42581","file":"openvex/pingaccess/CVE-2026-42581.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess 8.3 bundles Netty versions within the affected range (4.1.118 in 8.3.0; 4.1.132 in 8.3.x maintenance builds). The HTTP/1.0 Transfer-Encoding plus Content-Length coexistence flaw is reachable: PingAccess's front-end decoder hard-rejects the conflicting-header combination only for HTTP/1.1, and HTTP/1.0 requests bypass that guard. Impact is limited because PingAccess is a parse-and-re-encode proxy, not a byte-forwarder: the request is decoded and re-serialized to the origin, so no second parser sees the ambiguous byte stream. PingAccess 8.3.6 bundles Netty 4.1.138, outside the affected range."},{"id":"CVE-2026-42583","file":"openvex/pingaccess/CVE-2026-42583.openvex.json","product":"pingaccess","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"Not exploitable in PingAccess. The flaw is in Netty's Lz4FrameDecoder, a standalone codec handler that must be explicitly added to a channel pipeline. PingAccess never adds LZ4 handlers to any pipeline: its compression handling uses HttpContentDecompressor (gzip/deflate/br/zstd/snappy for origin-response rewriting) and its own content layers; no Lz4FrameDecoder or EmbeddedLz4xx decoder is registered anywhere in the PingAccess distribution."},{"id":"CVE-2026-42583","file":"openvex/pingam/CVE-2026-42583.openvex.json","product":"pingam","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"No immediate action required; apply the next available PingAM maintenance update when released, which is expected to include a Netty bump to 4.1.133.Final or 4.2.13 resolving this and companion Netty CVEs. Monitor xxxx... and TRIAGE-34987 for ETA confirmation from the AM engineering team."},{"id":"CVE-2026-42583","file":"openvex/pingauthorize/CVE-2026-42583.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"PingAuthorize does not use Lz4FrameDecoder, not exploitable. Netty will be upgraded to 4.2.13 in the upcoming version of the product (June 2026)."},{"id":"CVE-2026-42584","file":"openvex/pingaccess/CVE-2026-42584.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"component_not_present","notes":"Not exploitable in PingAccess. The flaw is in Netty's HttpClientCodec, which pairs outbound requests with inbound responses via a queue poll. PingAccess does not use HttpClientCodec: the backend channel uses PingAccess's own BackEndHttpRequestEncoder and BackEndHttpResponseDecoder pair, whose response-to-request association is implemented separately. The vulnerable polling logic is not in the product's pipeline."},{"id":"CVE-2026-42584","file":"openvex/pingam/CVE-2026-42584.openvex.json","product":"pingam","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"No immediate action required; the library is not exploitable in a standard AM deployment. Customers should apply the next available PingAM maintenance release when it includes the Netty bump to 4.1.133.Final or 4.2.13.Final (xxxx...). Monitor TRIAGE-34987 for ETA confirmation from the AM engineering team."},{"id":"CVE-2026-42585","file":"openvex/pingaccess/CVE-2026-42585.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess 8.3 bundles Netty versions within the affected range (4.1.118 in 8.3.0; 4.1.132 in 8.3.x maintenance builds). The malformed Transfer-Encoding parsing flaw is present, but PingAccess is a parse-and-re-encode proxy: inbound requests are decoded and re-serialized with canonical framing to the origin, and the front-end decoder hard-rejects conflicting Transfer-Encoding/Content-Length combinations on HTTP/1.1. Exploitability is limited to deployments where PingAccess sits behind another proxy that parses Transfer-Encoding differently. PingAccess 8.3.6 bundles Netty 4.1.138, outside the affected range."},{"id":"CVE-2026-42586","file":"openvex/pingfederate/CVE-2026-42586.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not vulnerable. The vulnerable class (RedisEncoder) is in an artifact that isn't on the classpath."},{"id":"CVE-2026-42587","file":"openvex/pingaccess/CVE-2026-42587.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"Not exploitable in PingAccess. The flaw bypasses the optional maxAllocation limit of Netty's HttpContentDecompressor for br/zstd/snappy encodings. PingAccess instantiates HttpContentDecompressor with no maxAllocation configured (default constructor), so there is no limit to bypass, and the decompressor is applied only to responses from the customer's own origin servers (backend response rewriting), not to attacker-controlled inbound requests."},{"id":"CVE-2026-42587","file":"openvex/pingam/CVE-2026-42587.openvex.json","product":"pingam","pkg":"netty-codec-http2","sub":"pkg:maven/io.netty/netty-codec-http2","just":"vulnerable_code_not_in_execute_path","notes":"No immediate action required. Customers should apply the next available PingAM maintenance release once the Netty bump (xxxx...) ships. As a short-term workaround, disable Brotli, Zstd, and Snappy content-encoding support at the reverse proxy/load balancer layer if those encodings are not required."},{"id":"CVE-2026-42778","file":"openvex/pingfederate/CVE-2026-42778.openvex.json","product":"pingfederate","pkg":"apache-mina","sub":"pkg:generic/apache-mina","just":"vulnerable_code_not_in_execute_path","notes":"This vulnerability in Apache MINA allows a bypass of deserialization protections where static initializers may be executed before proper class validation, potentially enabling remote code execution when deserializing untrusted data. Although PingFederate includes Apache MINA version that is within the affected range, it does not utilize the object deserialization mechanisms required to trigger this behavior. Because PingFederate does not deserialize untrusted data using MINA, there is no exploitable condition. Ping Identity will update the library to a fixed version as part of standard security maintenance."},{"id":"CVE-2026-42779","file":"openvex/pingfederate/CVE-2026-42779.openvex.json","product":"pingfederate","pkg":"apache-mina","sub":"pkg:generic/apache-mina","just":"component_not_present","notes":"This vulnerability in Apache MINA involves improper handling of certain class types during deserialization, which may allow validation checks to be bypassed and could result in remote code execution if untrusted serialized data is processed. PingFederate includes Apache MINA version that is within the affected range; however, PingFederate does not use the deserialization functionality required to exploit this issue. As no untrusted serialized data is processed through these APIs, the vulnerability is not exploitable in PingFederate. The dependency will be upgraded to a patched version in line with best practices."},{"id":"CVE-2026-44248","file":"openvex/pingfederate/CVE-2026-44248.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not vulnerable. The vulnerable class (MqttDecoder) is not on the classpath."},{"id":"CVE-2026-44249","file":"openvex/pingam/CVE-2026-44249.openvex.json","product":"pingam","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"Awaiting fix — track xxxx... (master/8.x) and xxxx... (7.4.x backport); once a patched PingAM release shipping netty-handler >= 4.1.135.Final is available, upgrade immediately; in the interim, avoid relying on Netty IpSubnetFilterRule IPv6 subnet rules as the sole access control mechanism and layer firewall or OS-level IPv6 ACLs as a compensating control"},{"id":"CVE-2026-44249","file":"openvex/pingauthorize/CVE-2026-44249.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"The product does not use Netty's IpSubnetFilterRule for IP filtering, relying instead on Ping's proprietary access control implementation; therefore, CVE-2026-44249 is not exploitable."},{"id":"CVE-2026-44249","file":"openvex/pingfederate/CVE-2026-44249.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected by CVE-2026-44249. The vulnerable class, IpSubnetFilterRule, is Netty's mechanism for enforcing IP subnet allow/deny rules inside a Netty channel pipeline; PingFederate contains no code that references or installs it, and any IP-based access control PingFederate performs is implemented in its own code and the Jetty servlet container, never in Netty. Although the Netty modules bundled with PingFederate fall within the affected version range, this class is never instantiated, so the faulty IPv6 masking operation is never executed. Not exploitable; no upgrade, mitigation, or configuration change is required."},{"id":"CVE-2026-44503","file":"openvex/pingauthorize/CVE-2026-44503.openvex.json","product":"pingauthorize","pkg":"go","sub":"pkg:golang/github.com/golang/go","just":"component_not_present","notes":"The /usr/local/bin/vault binary is not included in the standard distribution of PingAuthorize and was likely introduced solely during the initial container deployment lifecycle. The product codebase does not invoke this tool at runtime, and there is no vector for a remote attacker to trigger execution. Therefore, these CVEs are not exploitable within the application."},{"id":"CVE-2026-44503","file":"openvex/pingauthorize/CVE-2026-44503.openvex.json","product":"pingauthorize","pkg":"kiota-http-go","sub":"pkg:golang/github.com/microsoft/kiota-http-go","just":"component_not_present","notes":"/opt/pdp/bin/vault tool is not included in the standard distribution of PingAuthorize. Please provide more details."},{"id":"CVE-2026-44891","file":"openvex/pingaccess/CVE-2026-44891.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess ships Netty 4.1.118.Final which contains SPDY zlib decoder classes. PingAccess does not configure SPDY in its Netty pipeline. Not exploitable."},{"id":"CVE-2026-44891","file":"openvex/pingfederate/CVE-2026-44891.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"CVE-2026-44891 is Not Applicable — PingFederate never depends on netty-codec-stomp, and no STOMP protocol handling exists anywhere in the codebase."},{"id":"CVE-2026-44893","file":"openvex/pingfederate/CVE-2026-44893.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not Vulnerable. This CVE affects the HAProxyMessageDecoder in Netty's optional netty-codec-haproxy module, which PingFederate does not ship in any release. PingFederate includes Netty only as a transitive dependency of the Lettuce Redis client and the AWS SDK, neither of which pulls in the HAProxy codec module, and PingFederate does not terminate the PROXY protocol through Netty. Because the vulnerable decoder is not on the classpath, this issue is not exploitable against PingFederate."},{"id":"CVE-2026-44894","file":"openvex/pingfederate/CVE-2026-44894.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not Vulnerable. This CVE affects Netty's QUIC codec (QuicheQuicServerCodec), an optional module that PingFederate does not include in any release. PingFederate does not implement QUIC or HTTP/3 on any listener; all PingFederate endpoints are served over TCP/TLS by the embedded Jetty container, and Netty is present only as a transitive dependency of the Lettuce Redis client and AWS SDK, which do not use the QUIC codec. As the vulnerable code is not present and no QUIC server exists in the product, the address-validation/amplification issue described in this CVE does not apply."},{"id":"CVE-2026-44966","file":"openvex/pingfederate/CVE-2026-44966.openvex.json","product":"pingfederate","pkg":"velocity-animate","sub":"pkg:npm/velocity-animate","just":"component_not_present","notes":"CVE-2026-44966 (velocityjs prototype pollution) — PingFederate: NOT EXPOSED. velocityjs (the npm package) is completely absent from PF's dependency tree — not in any package.json, not resolved transitively in either pnpm-lock.yaml, not installed in ~1,200 node_modules packages, and not embedded in any pre-built bundle. One clarification worth noting: PF does use Java org.apache.velocity:velocity-engine-core in a couple of modules, but that's a JVM library with no relationship to this CVE - prototype pollution is a JavaScript-only attack class."},{"id":"CVE-2026-44990","file":"openvex/pingam/CVE-2026-44990.openvex.json","product":"pingam","pkg":"sanitize","sub":"pkg:gem/sanitize","just":"vulnerable_code_not_in_execute_path","notes":"No action required. PingAM ships sanitize-html@2.12.1 which predates the vulnerable code path. Confirm xxxx... is formally resolved/closed to reflect the engineering verdict already recorded in the ticket comments."},{"id":"CVE-2026-45205","file":"openvex/pingfederate/CVE-2026-45205.openvex.json","product":"pingfederate","pkg":"commons-configuration","sub":"pkg:maven/commons-configuration/commons-configuration","just":"vulnerable_code_cannot_be_controlled_by_adversary","notes":"CVE-2026-45205 (Apache Commons Configuration YAML recursion) — PingFederate: NOT EXPOSED. commons-configuration2 (the 2.x artifact the CVE targets) is completely absent from PF's dependency tree — verified across five independent layers: pom.xml files, both verbose dependency snapshots, shipped jars, Maven cache, and Java source imports. PF does carry commons-configuration:1.5 (1.x), but that's a different Maven artifact (commons-configuration group, not org.apache.commons), it predates YAML support entirely, and it's provided-scoped so it's never shipped. PF's actual YAML processing runs through Jackson (jackson-dataformat-yaml), which is unrelated."},{"id":"CVE-2026-45292","file":"openvex/pingauthorize/CVE-2026-45292.openvex.json","product":"pingauthorize","pkg":"opentelemetry-api","sub":"pkg:generic/opentelemetry-api@1.54","just":"vulnerable_code_not_in_execute_path","notes":"This CVE affects OpenTelemetry's baggage propagation parser. PingAuthorize OpenTelemetry integration configures only W3C trace context propagation (traceparent/tracestate headers). Baggage propagation is never registered or invoked. The vulnerable code path cannot be reached. The component is scheduled for an upgrade for the Q3 release."},{"id":"CVE-2026-45416","file":"openvex/pingam/CVE-2026-45416.openvex.json","product":"pingam","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"No fixed PingAM release is available yet. Track xxxx... for the netty-to-4.1.135 upgrade commit; once a patched AM release ships, upgrade to that version. In the interim, consider placing a TLS-terminating load balancer or WAF in front of AM to absorb oversized ClientHello messages and reduce direct Netty SniHandler exposure."},{"id":"CVE-2026-45416","file":"openvex/pingauthorize/CVE-2026-45416.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"The application does not operate a Netty server pipeline or HTTP/1.1/HTTP/2 server parsers, leaving all client-facing traffic to Jetty. Therefore, this Netty CVE is not exploitable."},{"id":"CVE-2026-45673","file":"openvex/pingauthorize/CVE-2026-45673.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Netty is a transitive dependency of the Azure SDK. Internal path analysis confirms the vulnerable code path is only reachable via the Azure Key Vault passphrase provider component. Due to the high complexity required to influence the DNS resolution chain within this specific operational context, exploitability is considered unlikely in a real-world scenario. The Azure SDK is scheduled to be updated in the upcoming 2026.Q3 release."},{"id":"CVE-2026-45674","file":"openvex/pingauthorize/CVE-2026-45674.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"The vulnerability is theoretically exploitable through the Azure Key Vault passphrase provider; however, a successful attack requires the threat actor to control an authoritative nameserver for a registered subdomain under the target domain/TLD. The Azure SDK will be updated to a patched version in the upcoming 2026.Q3 release."},{"id":"CVE-2026-45674","file":"openvex/pingfederate/CVE-2026-45674.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Affected version present - low exploitability. PingFederate ships the affected netty-resolver-dns module as a transitive dependency of the Lettuce Redis client, so the vulnerable code is present on the classpath. This resolver is only exercised when PingFederate is configured to use Redis for session/state storage, it resolves only the administrator-configured Redis endpoint hostnames, and exploitation requires an attacker able to supply crafted DNS responses to PingFederate's resolver - i.e., control of or an on-path position within the deployment's DNS infrastructure. Ping Identity is addressing this by upgrading the bundled Netty libraries to a fixed version in an upcoming release; deployments not using Redis, or using trusted internal DNS, are not exposed in the interim."},{"id":"CVE-2026-46340","file":"openvex/pingfederate/CVE-2026-46340.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not Vulnerable. This CVE affects Netty's optional netty-transport-sctp module, which PingFederate does not ship in any release. PingFederate includes Netty only via the Lettuce Redis client and AWS SDK, which use Netty's core TCP transport modules, and PingFederate does not accept or process SCTP traffic on any listener. Because the affected handler is not on the classpath and no SCTP endpoint exists, this memory-exhaustion issue is not exploitable against PingFederate."},{"id":"CVE-2026-46595","file":"openvex/pingaccess/CVE-2026-46595.openvex.json","product":"pingaccess","pkg":"go","sub":"pkg:golang/github.com/golang/go@0.51.0","just":"vulnerable_code_not_in_execute_path","notes":"Not exploitable in PingAccess. CVE-2026-46595 affects the golang.org/x/crypto/ssh SSH server implementation (versions below 0.52.0, fixed in 0.52.0): a server whose VerifiedPublicKeyCallback returns a source-address restriction in Permissions.CriticalOptions fails to enforce that restriction, allowing an authenticated key holder connecting from a disallowed address to complete authentication. Exploitation requires a network-reachable x/crypto/ssh-based SSH server with that callback configuration. The PingAccess Docker image (9.0.3) contains no SSH server of any kind and exposes no SSH port (only PA engine/admin ports 1443, 3000, 9000). The scanner finding matches the git-lfs utility bundled in the image, which declares x/crypto 0.51.0 in its Go module manifest; however, the x/crypto/ssh package and its affected symbols are not compiled into the git-lfs binary at all (only unrelated md4/pbkdf2 code is present), and git-lfs uses the system OpenSSH client for SSH transport. The vulnerable code is therefore absent from the image and the required server-side execution context does not exist. This is a false positive. The manifest-level finding will clear when the bundled git-lfs is built against x/crypto 0.52.0 or later in a future image refresh."},{"id":"CVE-2026-46917","file":"openvex/pingauthorize/CVE-2026-46917.openvex.json","product":"pingauthorize","pkg":"oracle-java-se","sub":"pkg:generic/oracle-java-se","just":"vulnerable_code_not_in_execute_path","notes":"These CVEs do not directly impact PingAuthorize itself, as they pertain specifically to the underlying Oracle JVM. The official patch from Oracle will be available on October 20, 2026. Our Engineering team will update the bundled Java versions in PingAuthorize container images and PingOne Advanced Services (P1AS) as applicable upon release. Customers running customer-managed PingAuthorize deployments will need to upgrade their underlying Oracle JVM instances directly once the patch is available."},{"id":"CVE-2026-46968","file":"openvex/pingauthorize/CVE-2026-46968.openvex.json","product":"pingauthorize","pkg":"oracle-java-se","sub":"pkg:generic/oracle-java-se","just":"vulnerable_code_not_in_execute_path","notes":"These CVEs do not directly impact PingAuthorize itself, as they pertain specifically to the underlying Oracle JVM. The official patch from Oracle will be available on October 20, 2026. Our Engineering team will update the bundled Java versions in PingAuthorize container images and PingOne Advanced Services (P1AS) as applicable upon release. Customers running customer-managed PingAuthorize deployments will need to upgrade their underlying Oracle JVM instances directly once the patch is available."},{"id":"CVE-2026-47021","file":"openvex/pingauthorize/CVE-2026-47021.openvex.json","product":"pingauthorize","pkg":"oracle-java-se","sub":"pkg:generic/oracle-java-se","just":"vulnerable_code_not_in_execute_path","notes":"These CVEs do not directly impact PingAuthorize itself, as they pertain specifically to the underlying Oracle JVM. The official patch from Oracle will be available on October 20, 2026. Our Engineering team will update the bundled Java versions in PingAuthorize container images and PingOne Advanced Services (P1AS) as applicable upon release. Customers running customer-managed PingAuthorize deployments will need to upgrade their underlying Oracle JVM instances directly once the patch is available."},{"id":"CVE-2026-47027","file":"openvex/pingauthorize/CVE-2026-47027.openvex.json","product":"pingauthorize","pkg":"oracle-java-se","sub":"pkg:generic/oracle-java-se","just":"vulnerable_code_not_in_execute_path","notes":"These CVEs do not directly impact PingAuthorize itself, as they pertain specifically to the underlying Oracle JVM. The official patch from Oracle will be available on October 20, 2026. Our Engineering team will update the bundled Java versions in PingAuthorize container images and PingOne Advanced Services (P1AS) as applicable upon release. Customers running customer-managed PingAuthorize deployments will need to upgrade their underlying Oracle JVM instances directly once the patch is available."},{"id":"CVE-2026-47063","file":"openvex/pingauthorize/CVE-2026-47063.openvex.json","product":"pingauthorize","pkg":"oracle-java-se","sub":"pkg:generic/oracle-java-se","just":"vulnerable_code_not_in_execute_path","notes":"These CVEs do not directly impact PingAuthorize itself, as they pertain specifically to the underlying Oracle JVM. The official patch from Oracle will be available on October 20, 2026. Our Engineering team will update the bundled Java versions in PingAuthorize container images and PingOne Advanced Services (P1AS) as applicable upon release. Customers running customer-managed PingAuthorize deployments will need to upgrade their underlying Oracle JVM instances directly once the patch is available."},{"id":"CVE-2026-47065","file":"openvex/pingfederate/CVE-2026-47065.openvex.json","product":"pingfederate","pkg":"mina-core","sub":"pkg:generic/mina-core","just":"vulnerable_code_not_in_execute_path","notes":"CVE-2026-47065 (Apache MINA deserialization filter bypass) - PingFederate: NOT EXPOSED.  The two issues (ZDRES-232: resolveProxyClass not overridden; ZDRES-233: Class.forName(initialize=true) in readClassDescriptor) are real in mina-core, and the bundled jar (2.2.4) is bytecode-confirmed vulnerable. However, PF only uses mina-core for ConcurrentHashSet — it opens no MINA IoAcceptor, uses no ObjectSerializationCodecFactory, and calls no IoBuffer.getObject(). The attack requires an attacker-reachable MINA network acceptor, which PF doesn't have."},{"id":"CVE-2026-47691","file":"openvex/pingauthorize/CVE-2026-47691.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"The vulnerability is theoretically exploitable through the Azure Key Vault passphrase provider; however, a successful attack requires the threat actor to control an authoritative nameserver for a registered subdomain under the target domain/TLD. The Azure SDK will be updated to a patched version in the upcoming 2026.Q3 release."},{"id":"CVE-2026-47691","file":"openvex/pingfederate/CVE-2026-47691.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Affected version present - low exploitability. PingFederate ships the affected netty-resolver-dns module as a transitive dependency of the Lettuce Redis client, so the vulnerable code is present on the classpath. The resolver runs only when PingFederate is configured for Redis session/state storage and resolves only the fixed, administrator-configured Redis hostnames — an attacker cannot cause PingFederate to query an attacker-controlled authoritative name server, so poisoning requires prior control of, or an on-path position within, the deployment's own DNS infrastructure. Ping Identity is addressing this by upgrading the bundled Netty libraries to a fixed version in an upcoming release; deployments not using Redis, or using trusted internal DNS, are not exposed in the interim."},{"id":"CVE-2026-47838","file":"openvex/pingauthorize/CVE-2026-47838.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"This CVE is not exploitable within the Admin Console because the application does not enable X.509 principal extraction; therefore, the required technical prerequisites are not met. The underlying Spring Framework dependencies are scheduled to be updated in version 11.2 of the product."},{"id":"CVE-2026-47842","file":"openvex/pingauthorize/CVE-2026-47842.openvex.json","product":"pingauthorize","pkg":"spring-security-crypto","sub":"pkg:maven/org.springframework.security/spring-security-crypto","just":"component_not_present","notes":"The vulnerable AesBytesEncryptor constructors/configuration are not used by the PingData Admin Console. No attacker-readable encrypted datastore relying on this API was identified. The CVE is not exploitable"},{"id":"CVE-2026-47843","file":"openvex/pingauthorize/CVE-2026-47843.openvex.json","product":"pingauthorize","pkg":"reactor-netty-http","sub":"pkg:generic/reactor-netty-http@1.2.18","just":"component_not_present","notes":"The application does not use multiple Reactor clients with differing DNS resolver configurations. Therefore, this CVE is not exploitable."},{"id":"CVE-2026-47845","file":"openvex/pingauthorize/CVE-2026-47845.openvex.json","product":"pingauthorize","pkg":"reactor-netty-http","sub":"pkg:generic/reactor-netty-http@1.2.9","just":"component_not_present","notes":"PingAuthorize does not utilize Reactor Netty's HTTP server. It is included merely as a transitive dependency for the Azure SDK. Therefore, this vulnerability is not exploitable in the context of the product."},{"id":"CVE-2026-47857","file":"openvex/pingauthorize/CVE-2026-47857.openvex.json","product":"pingauthorize","pkg":"reactor-core","sub":"pkg:generic/reactor-core@3.7.9","just":"component_not_present","notes":"The product does not use the vulnerable Flux.windowTimeout operator or enable fairBackpressure. Therefore, the CVE is not exploitable in the product."},{"id":"CVE-2026-47863","file":"openvex/pingauthorize/CVE-2026-47863.openvex.json","product":"pingauthorize","pkg":"reactor-core","sub":"pkg:generic/reactor-core@3.7.9","just":"component_not_present","notes":"The product does not use the vulnerable Flux.bufferTimeout operator or enable fairBackpressure. Therefore, the CVE is not exploitable in the product."},{"id":"CVE-2026-47874","file":"openvex/pingauthorize/CVE-2026-47874.openvex.json","product":"pingauthorize","pkg":"reactor-netty-http","sub":"pkg:generic/reactor-netty-http@1.2.9","just":"component_not_present","notes":"The product does not use Reactor Netty to implement an HTTP server. The vulnerable HTTP/1.1 pipelining code path is therefore not reachable by external requests, and the CVE is not exploitable in the product."},{"id":"CVE-2026-47883","file":"openvex/pingaccess/CVE-2026-47883.openvex.json","product":"pingaccess","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"component_not_present","notes":"Not affected. The vulnerability is an open-redirect in Spring Framework's UrlHandlerFilter, provided by the spring-web artifact. PingAccess does not ship spring-web (or spring-webmvc/spring-webflux) in any release - the Spring stack bundled with PingAccess is limited to the core/data/JPA modules for admin persistence, verified in 9.1.0 and 9.1.1 (a class-level scan of the distribution finds no UrlHandlerFilter). The scan attributed the finding to spring-core-6.2.17.jar because 6.2.17 falls within the affected Spring Framework version range, but the vulnerable artifact is not present in the product, so the finding is a false positive due to package attribution. The bundled Spring version will be refreshed (6.2.20+) in the 9.2 release as standard dependency hygiene."},{"id":"CVE-2026-47883","file":"openvex/pingauthorize/CVE-2026-47883.openvex.json","product":"pingauthorize","pkg":"spring-webmvc","sub":"pkg:maven/org.springframework/spring-webmvc","just":"vulnerable_code_not_in_execute_path","notes":"While a vulnerable spring-web*.jar is present, the application does not instantiate or register any `UrlHandlerFilter` beans required for exploitation. Therefore, this CVE is not exploitable. The component is scheduled for an upgrade in version 11.2 of the product."},{"id":"CVE-2026-47884","file":"openvex/pingauthorize/CVE-2026-47884.openvex.json","product":"pingauthorize","pkg":"spring-webmvc","sub":"pkg:maven/org.springframework/spring-webmvc","just":"vulnerable_code_not_in_execute_path","notes":"The product does not utilize the XsltView class, XSLT view resolver, XSLT configuration, or XSLT templates. Therefore, the CVE is not exploitable."},{"id":"CVE-2026-47885","file":"openvex/pingauthorize/CVE-2026-47885.openvex.json","product":"pingauthorize","pkg":"spring-web","sub":"pkg:maven/org.springframework/spring-web","just":"vulnerable_code_not_in_execute_path","notes":"The vulnerability is specific to Spring WebFlux’s PartEventHttpMessageReader with maxInMemorySize = -1, and none of those conditions are present in this project."},{"id":"CVE-2026-47886","file":"openvex/pingaccess/CVE-2026-47886.openvex.json","product":"pingaccess","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"component_not_present","notes":"False positive for PingAccess 8.3. CVE-2026-47886 is a DoS in Spring SpEL when the power operator (^) is used with BigDecimal/BigInteger operands and a large exponent, and requires the application to evaluate attacker-supplied SpEL expressions. PingAccess does not evaluate user-supplied values with SpEL - spring-expression ships only as a Spring/Spring Data dependency and is not referenced by PingAccess code. Dependency remediation is tracked under PA-16550."},{"id":"CVE-2026-47886","file":"openvex/pingauthorize/CVE-2026-47886.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"The advisory’s required conditions - untrusted SpEL evaluation and a reachable BigDecimal/BigInteger operand -are absent from the project. Therefore, the CVE is not exploitable."},{"id":"CVE-2026-47887","file":"openvex/pingaccess/CVE-2026-47887.openvex.json","product":"pingaccess","pkg":"spring-webmvc","sub":"pkg:maven/org.springframework/spring-webmvc","just":"component_not_present","notes":"False positive for PingAccess 8.3. CVE-2026-47887 is an open redirect in Spring MVC's UrlFileNameViewController when mapped with an end-of-path pattern and no configured prefix. PingAccess does not use or deploy with Spring MVC - no spring-web/spring-webmvc in the distribution - and does not use UrlFileNameViewController."},{"id":"CVE-2026-47887","file":"openvex/pingauthorize/CVE-2026-47887.openvex.json","product":"pingauthorize","pkg":"spring-webmvc","sub":"pkg:maven/org.springframework/spring-webmvc","just":"vulnerable_code_not_in_execute_path","notes":"While a vulnerable spring-web*.jar is present, the application does not instantiate or use `UrlFileNameViewController`, which is required for exploitation. Therefore, this CVE is not exploitable."},{"id":"CVE-2026-47888","file":"openvex/pingaccess/CVE-2026-47888.openvex.json","product":"pingaccess","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"component_not_present","notes":"False positive for PingAccess 8.3. CVE-2026-47888 is a memory leak in Spring RSocket applications via a malformed SETUP frame. PingAccess is not an RSocket application and does not deploy with the Spring messaging/RSocket components. Additionally the affected range (5.2.0.RELEASE - 5.2.25.RELEASE; 6.0+) does not include Spring 5.3.33 which PingAccess 8.3 ships, so the product is outside the affected version range as well."},{"id":"CVE-2026-47889","file":"openvex/pingauthorize/CVE-2026-47889.openvex.json","product":"pingauthorize","pkg":"spring-web","sub":"pkg:maven/org.springframework/spring-web","just":"vulnerable_code_not_in_execute_path","notes":"The PingData Admin Console is not a WebFlux application; therefore, this CVE is not exploitable."},{"id":"CVE-2026-47890","file":"openvex/pingauthorize/CVE-2026-47890.openvex.json","product":"pingauthorize","pkg":"spring-webmvc","sub":"pkg:maven/org.springframework/spring-webmvc","just":"vulnerable_code_not_in_execute_path","notes":"While a vulnerable spring-web*.jar is present, the application does not implement any Server-Sent Events (SSE) endpoints or classes (`SseEmitter`, `EventSource`). Therefore, this CVE is not exploitable."},{"id":"CVE-2026-47891","file":"openvex/pingaccess/CVE-2026-47891.openvex.json","product":"pingaccess","pkg":"spring-webflux","sub":"pkg:maven/org.springframework/spring-webflux","just":"component_not_present","notes":"False positive for PingAccess 8.3. CVE-2026-47891 affects Spring WebFlux applications that rely on the Aalto XML processor, bypassing the maxInMemorySize limit. PingAccess does not use or deploy with Spring WebFlux - no spring-webflux in the distribution."},{"id":"CVE-2026-47893","file":"openvex/pingaccess/CVE-2026-47893.openvex.json","product":"pingaccess","pkg":"spring-webflux","sub":"pkg:maven/org.springframework/spring-webflux","just":"component_not_present","notes":"False positive for PingAccess 8.3. CVE-2026-47893 affects Spring WebFlux applications supporting WebSocket connections, leaking request headers via exception reason phrases. PingAccess does not use Spring WebFlux; its WebSocket support is internally implemented (WebSocketOriginInterceptor, strict version-13 only) without Netty or Spring WebSocket handlers."},{"id":"CVE-2026-4800","file":"openvex/pingam/CVE-2026-4800.openvex.json","product":"pingam","pkg":"lodash","sub":"pkg:npm/lodash","just":"vulnerable_code_not_in_execute_path","notes":"Upgrade to PingAM 7.5.3 (for 7.5.x) or 8.1.1 (for 8.1.x) once released, which will include lodash upgraded to 4.18.0 in the XUI packages. Customers on 7.4.x or 8.0.x should track the corresponding backport tickets. As an interim workaround, ensure no untrusted input is passed as options.imports key names in any custom XUI template extensions."},{"id":"CVE-2026-4800","file":"openvex/pingig/CVE-2026-4800.openvex.json","product":"pingig","pkg":"lodash","sub":"pkg:npm/lodash","just":"vulnerable_code_not_in_execute_path","notes":"This impacts PingGateway UI and is fixed in versions 2026.3, 2025.11.3 and 2024.11.3"},{"id":"CVE-2026-48006","file":"openvex/pingfederate/CVE-2026-48006.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not Vulnerable. This CVE affects RedisArrayAggregator in Netty's optional netty-codec-redis module, which PingFederate does not ship in any release. Although PingFederate does support Redis for session/state storage, it communicates with Redis through the Lettuce client, which implements its own RESP protocol codec and does not use Netty's Redis codec module. Because the vulnerable handler is not on the classpath, this memory-leak issue is not exploitable against PingFederate."},{"id":"CVE-2026-48043","file":"openvex/pingfederate/CVE-2026-48043.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Affected version present - low exploitability. PingFederate ships the affected netty-codec-http2 module as a transitive dependency of the AWS SDK's Netty HTTP client, so the vulnerable code is present on the classpath. However, this code path runs only as an HTTP/2 client within optional AWS integrations (such as the DynamoDB provisioning data store), where the remote peer is an AWS service endpoint reached over TLS with full certificate validation - exploitation would require a malicious or fully compromised AWS endpoint, and the impact is limited to memory exhaustion (denial of service). PingFederate's own inbound HTTP listeners are served by Jetty, not Netty, and are unaffected; Ping Identity is addressing this by upgrading the bundled Netty libraries to a fixed version in an upcoming release."},{"id":"CVE-2026-48059","file":"openvex/pingfederate/CVE-2026-48059.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not Vulnerable. This CVE affects the HAProxy PROXY protocol v2 codec in Netty's optional netty-codec-haproxy module, which PingFederate does not ship in any release. PingFederate does not parse the PROXY protocol through Netty, and the module is not pulled in by the Lettuce Redis client or AWS SDK dependencies that account for Netty's presence in the product. Because the vulnerable codec is not on the classpath, this issue is not exploitable against PingFederate."},{"id":"CVE-2026-48748","file":"openvex/pingfederate/CVE-2026-48748.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not Vulnerable. This CVE affects Netty's optional HTTP/3 codec, which PingFederate does not include in any release. PingFederate does not implement HTTP/3 or QUIC on any interface; all product endpoints are served over TCP/TLS by the embedded Jetty container, and the Netty libraries present in the product (via the Lettuce Redis client and AWS SDK) do not include or use the HTTP/3 codec. As the vulnerable code is not present and no HTTP/3 service exists, this issue does not apply to PingFederate."},{"id":"CVE-2026-49844","file":"openvex/pingaccess/CVE-2026-49844.openvex.json","product":"pingaccess","pkg":"log4j","sub":"pkg:maven/log4j/log4j","just":"component_not_present","notes":"PingAccess ships log4j-api 2.24.3 (within affected range \u003c2.25.5) and JsonTemplateLayout is a supported optional logging mode. However, the CVE requires float or double values to be submitted to the logging context. Inspection of all 36 PA classes that use log4j logging confirmed zero float or double operations in any logging code path. PingAccess does not log floating point values. False positive."},{"id":"CVE-2026-49844","file":"openvex/pingauthorize/CVE-2026-49844.openvex.json","product":"pingauthorize","pkg":"log4j","sub":"pkg:maven/log4j/log4j","just":"vulnerable_code_not_in_execute_path","notes":"The CVE requires the application to actively call MapMessage.asJson() or use JsonTemplateLayout; neither is present in PingData Admin Console. Furthermore, this component is entirely optional and can be safely disabled if required."},{"id":"CVE-2026-49844","file":"openvex/pingfederate/CVE-2026-49844.openvex.json","product":"pingfederate","pkg":"log4j","sub":"pkg:maven/log4j/log4j","just":"vulnerable_code_not_in_execute_path","notes":"The vulnerable path (MapMessage → JSON-multiformat resolver → asJson() emitting bare NaN/Infinity tokens) requires both a resolver not using stringified: true and a MapMessage being logged. Neither condition exists anywhere in shipped PingFederate code - all templates that resolve ‘message’ already use the safe stringified: true mode, and nothing in the codebase constructs a MapMessage."},{"id":"CVE-2026-50010","file":"openvex/pingauthorize/CVE-2026-50010.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"The product's Netty clients come from the AWS SDK and Azure libraries, which construct their own trust managers. No plain trust manager is passed to Netty anywhere. Not exploitable."},{"id":"CVE-2026-50010","file":"openvex/pingfederate/CVE-2026-50010.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not Vulnerable (vulnerable configuration not used). The affected code resides in Netty's netty-handler module, which PingFederate does ship, but the vulnerability only manifests when an application supplies a plain X509TrustManager instance directly to Netty's SslContextBuilder. PingFederate's only Netty TLS client usage is the Lettuce Redis integration, which is configured with a truststore file through a standard TrustManagerFactory — the platform trust managers this produces are full X509ExtendedTrustManager implementations that are never routed through the flawed wrapper, so hostname verification behaves as configured. Because the vulnerable API pattern is not used anywhere in the product, PingFederate is not exposed; the Netty upgrade planned for an upcoming release will remove the flawed code entirely."},{"id":"CVE-2026-50011","file":"openvex/pingfederate/CVE-2026-50011.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not Vulnerable. This CVE affects RedisArrayAggregator in Netty's optional netty-codec-redis module, which PingFederate does not ship in any release. PingFederate's Redis support uses the Lettuce client, which implements its own RESP protocol parsing and does not rely on Netty's Redis codec. Because the vulnerable class is not on the classpath, this memory-exhaustion issue is not exploitable against PingFederate."},{"id":"CVE-2026-50193","file":"openvex/pingaccess/CVE-2026-50193.openvex.json","product":"pingaccess","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess 8.3.4 uses Jackson 2.17.0 and is not impacted by this finding. It is flagged because it’s included as shaded dependencies of ehcache and the AWS SDK."},{"id":"CVE-2026-50193","file":"openvex/pingfederate/CVE-2026-50193.openvex.json","product":"pingfederate","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"After investigating CVE-2026-50193, we determined that PingFederate 12.3 is not affected. PingFederate 12.3 uses jackson-databind version 2.12.7.1 across all product modules. CVE-2026-50193 only affects versions 2.13.0 through 2.13.x, so the version shipped with PingFederate falls outside the affected range."},{"id":"CVE-2026-52910","file":"openvex/pingauthorize/CVE-2026-52910.openvex.json","product":"pingauthorize","pkg":"linux-kernel","sub":"pkg:generic/linux-kernel","just":"vulnerable_code_not_in_execute_path","notes":"This vulnerability affects the underlying Linux kernel and is not applicable to the product."},{"id":"CVE-2026-54291","file":"openvex/pingidm/CVE-2026-54291.openvex.json","product":"pingidm","pkg":"postgresql","sub":"pkg:maven/org.postgresql/postgresql","just":"vulnerable_code_not_in_execute_path","notes":"In Progress - Appears in Master and Sustaining Branches 7.5 - 8.1"},{"id":"CVE-2026-54399","file":"openvex/pingaccess/CVE-2026-54399.openvex.json","product":"pingaccess","pkg":"apache-httpcomponents","sub":"pkg:generic/apache-httpcomponents","just":"component_not_present","notes":"PingAccess does not ship HttpComponents Core 5.x in any release"},{"id":"CVE-2026-54399","file":"openvex/pingauthorize/CVE-2026-54399.openvex.json","product":"pingauthorize","pkg":"httpcore5","sub":"pkg:generic/httpcore5@5.3.4","just":"vulnerable_code_not_in_execute_path","notes":"The vulnerable code is the HTTP/1.1 server-side message parser. No component in the product ever runs an httpcore5 server. PingAuthorize serve HTTP through Jetty. No attacker can reach the server-mode parser because no such server is listening. Therefore the CVE is not exploitable"},{"id":"CVE-2026-54399","file":"openvex/pingds/CVE-2026-54399.openvex.json","product":"pingds","pkg":"httpcore5","sub":"pkg:generic/httpcore5","just":"vulnerable_code_not_in_execute_path","notes":"Fixes applied to PingDS versions 8.1.2, 8.0.4, 7.5.4"},{"id":"CVE-2026-54428","file":"openvex/pingauthorize/CVE-2026-54428.openvex.json","product":"pingauthorize","pkg":"httpcore5-h2","sub":"pkg:generic/httpcore5-h2@5.3.4","just":"vulnerable_code_not_in_execute_path","notes":"The HPACK decoder DoS requires an HTTP/2 server accepting client connections. No component in the product ever runs an httpcore5 server. PingAuthorize serve HTTP through Jetty. No attacker can reach the server-mode parser because no such server is listening. Therefore the CVE is not exploitable"},{"id":"CVE-2026-54512","file":"openvex/pingaccess/CVE-2026-54512.openvex.json","product":"pingaccess","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"Not Affected. This vulnerability in jackson-databind involves bypassing Polymorphic Type Validators (PTV). PingAccess does not utilize the specific polymorphic deserialization configurations required to trigger this flaw."},{"id":"CVE-2026-54512","file":"openvex/pingam/CVE-2026-54512.openvex.json","product":"pingam","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"Upgrade to PingAM 7.5.3 (or the next 8.0.x maintenance release) once available; these include updated jackson-databind targeting version 2.18.9 / 2.21.5+. No interim workaround is available; customers can assess their exposure based on use of polymorphic type handling features."},{"id":"CVE-2026-54512","file":"openvex/pingauthorize/CVE-2026-54512.openvex.json","product":"pingauthorize","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"component_not_present","notes":"PingAuthorize is not vulnerable to this issue. The product does not use enableDefaultTyping() or BasicPolymorphicTypeValidator - polymorphic deserialization is entirely absent from our ObjectMapperFactory implementation. Jackson library is scheduled for an upgrade for the Q3 release."},{"id":"CVE-2026-54513","file":"openvex/pingaccess/CVE-2026-54513.openvex.json","product":"pingaccess","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess 8.3.4 uses Jackson 2.17.0 and is not impacted by this finding. It is flagged because it’s included as shaded dependencies of ehcache and the AWS SDK. For ehcache we don’t enable the rest management system that leverages the Jackson dependency. For the AWS SDK it is only leveraged directly between PingAccess and AWS to perform master key encryption and process JWTs between the systems. User data is not processed during this exchange."},{"id":"CVE-2026-54513","file":"openvex/pingam/CVE-2026-54513.openvex.json","product":"pingam","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"Upgrade to PingAM 7.5.3 (or the next 8.0.x maintenance release) once available."},{"id":"CVE-2026-54514","file":"openvex/pingam/CVE-2026-54514.openvex.json","product":"pingam","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"Upgrade to PingAM 7.5.3 (or the next 8.0.x maintenance release) once available."},{"id":"CVE-2026-54515","file":"openvex/pingaccess/CVE-2026-54515.openvex.json","product":"pingaccess","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"component_not_present","notes":"Not Affected. Relates to @JsonIgnoreProperties being bypassed when case-insensitivity is enabled. PingAccess does not use this specific combination of annotations on sensitive data models exposed to external input."},{"id":"CVE-2026-54515","file":"openvex/pingam/CVE-2026-54515.openvex.json","product":"pingam","pkg":"jackson-core","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-core","just":"vulnerable_code_not_in_execute_path","notes":"Upgrade to PingAM 7.5.3 (or the next 8.0.x maintenance release) once available. This includes updated jackson-core targeting version 2.18.6 / 2.21.1+."},{"id":"CVE-2026-54515","file":"openvex/pingauthorize/CVE-2026-54515.openvex.json","product":"pingauthorize","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"PingAuthorize is not vulnerable to this issue. ACCEPT_CASE_INSENSITIVE_PROPERTIES is never enabled. The configuration call within ObjectMapperFactory is a no-op due to a discarded builder result, meaning the feature remains inactive and cannot be exploited. Jackson library is scheduled for an upgrade for the Q3 release."},{"id":"CVE-2026-54515","file":"openvex/pingds/CVE-2026-54515.openvex.json","product":"pingds","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"component_not_present","notes":"@JsonIgnoreProperties is not used in PingDS codebase, nor is ACCEPT_CASE_INSENSITIVE_PROPERTIES. Therefore, this minor CVE is unexploitable"},{"id":"CVE-2026-54515","file":"openvex/pingidm/CVE-2026-54515.openvex.json","product":"pingidm","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"inline_mitigations_already_exist","notes":"In Progress - Blocked waiting for jackson-databind-2.21.5 (unreleased), affects IDM Master, and Sustaining branches 7.5 - 8.1."},{"id":"CVE-2026-54516","file":"openvex/pingauthorize/CVE-2026-54516.openvex.json","product":"pingauthorize","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"component_not_present","notes":"This CVE is not exploitable in PingAuthorize. It requires a specific annotation pattern in Java model classes: a getter method annotated with @JsonProperty paired with a setter annotated with @JsonIgnore on the same field. A review of all Jackson-annotated model classes in this codebase confirms that pattern is not present. Jackson library is scheduled for an upgrade for the Q3 release."},{"id":"CVE-2026-54517","file":"openvex/pingauthorize/CVE-2026-54517.openvex.json","product":"pingauthorize","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"vulnerable_code_not_in_execute_path","notes":"This CVE is not exploitable in PingAuthorize. It requires the application to use Jackson's @JsonView annotation to restrict which properties are included during deserialization. The feature is never configured, the vulnerable code path in BeanDeserializer cannot be reached. Jackson library is scheduled for an upgrade for the Q3 release."},{"id":"CVE-2026-54704","file":"openvex/pingaccess/CVE-2026-54704.openvex.json","product":"pingaccess","pkg":"opentelemetry-javaagent","sub":"pkg:maven/io.opentelemetry.javaagent/opentelemetry-javaagent","just":"vulnerable_code_not_in_execute_path","notes":"Not exploitable in PingAccess 9.1. CVE-2026-54704 affects the OpenTelemetry JDBC auto-instrumentation prior to 2.28.0, which can fail to sanitize double-quoted passwords in SQL CONNECT statements, potentially exposing clear-text database passwords in exported trace span attributes. The OpenTelemetry javaagent bundled in the pingaccess:2607-9.1.0 image (2.24.0, JDBC instrumentation 2.24.0-alpha - within the affected range) is not attached to the JVM by default: the image launch script passes no -javaagent argument and the default run.properties ships pa.enable.distributed.tracing=false. The instrumentation only activates if an administrator explicitly enables distributed tracing. The vulnerable pattern also requires credentials embedded directly in SQL statement text (e.g. CONNECT ... PASSWORD ...); PingAccess authenticates to its data stores through JDBC connection configuration rather than SQL statement text. A library upgrade of the bundled OpenTelemetry agent to a release at or above 2.28.0 is planned for a future maintenance release."},{"id":"CVE-2026-54704","file":"openvex/pingfederate/CVE-2026-54704.openvex.json","product":"pingfederate","pkg":"opentelemetry-exporter-sender-jdk","sub":"pkg:maven/io.opentelemetry/opentelemetry-exporter-sender-jdk","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate ships the OpenTelemetry java agent but does not attach it to the JVM unless distributed tracing is explicitly enabled (`pf.enable.distributed.tracing=true`; default false), so the vulnerable JDBC instrumentation is inactive out of the box. Additionally, the flaw requires database passwords to be embedded double-quoted in SQL CONNECT statement text; PingFederate authenticates to JDBC data stores via connection properties and never inlines credentials in SQL. Not exploitable in a standard deployment. Fixed in PingFederate 13.1, which ships OpenTelemetry 2.28.1 (at the 2.28.0 fix level)."},{"id":"CVE-2026-55153","file":"openvex/pingfederate/CVE-2026-55153.openvex.json","product":"pingfederate","pkg":"mchange-commons-java","sub":"pkg:generic/mchange-commons-java","just":"component_not_present","notes":"PingFederate is NOT affected by CVE-2026-55153. The mchange-commons-java library in which the vulnerability resides is not bundled with, referenced by, or distributed as part of PingFederate in any supported release a a review of the product's dependency manifests and bundled libraries across releases 12.3 through 13.2 confirms the component is absent, including via the transitive paths through which it most commonly arrives (the c3p0 connection pool and Hibernate ORM). PingFederate performs JDBC connection pooling using Apache Commons DBCP, a separate implementation that does not share the affected code. Because the exploit path requires mchange-commons-java to be present on the server's classpath, the vulnerability is not exploitable in PingFederate, and no upgrade, mitigation, or configuration change is required; customers who see this CVE flagged in a scan of their environment should verify whether the detection originates from another application or shared library on the same host rather than from PingFederate itse"},{"id":"CVE-2026-55831","file":"openvex/pingaccess/CVE-2026-55831.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess ships Netty 4.1.118.Final which contains SPDY handler classes. However, PingAccess is an HTTP/TLS proxy and never configures SPDY in its Netty channel pipeline. The vulnerable code path is unreachable. Not exploitable."},{"id":"CVE-2026-55831","file":"openvex/pingauthorize/CVE-2026-55831.openvex.json","product":"pingauthorize","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"The SPDY protocol is never configured or used anywhere in the codebase. The vulnerable decoder cannot be reached. Not exploitable."},{"id":"CVE-2026-55831","file":"openvex/pingfederate/CVE-2026-55831.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"False Positive. Zero matches for DefaultSpdySettingsFrame or any SPDY-related identifier anywhere in PingFederate source. SPDY is entirely unused."},{"id":"CVE-2026-55831","file":"openvex/pingfederate/CVE-2026-55831.openvex.json","product":"pingfederate","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected by CVE-2026-55831. The vulnerable SPDY SETTINGS decoder belongs to the server-side SPDY stack in netty-codec-http, which PingFederate never uses: all PingFederate HTTP endpoints are served by Jetty, no PingFederate code installs Netty handlers into any channel pipeline, and PingFederate does not speak the SPDY protocol to any peer. netty-codec-http is present in PingFederate only as an unused transitive of the AWS SDK's asynchronous transport (and embedded inside the bundled AWS KMS encryptor integration), and it never processes network data. A remote peer cannot open a SPDY session with any PingFederate component, so the amplified SETTINGS allocation cannot occur; not exploitable, and no change is required."},{"id":"CVE-2026-55833","file":"openvex/pingaccess/CVE-2026-55833.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess ships Netty 4.1.118.Final which contains SPDY zlib decoder classes. PingAccess does not configure SPDY in its Netty pipeline. Not exploitable."},{"id":"CVE-2026-55833","file":"openvex/pingauthorize/CVE-2026-55833.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"This vulnerability is not exploitable within PingAuthorize, as the product does not utilize the vulnerable SPDY classes. Additionally, the underlying Netty component is scheduled for an upgrade in the upcoming 11.2 major release."},{"id":"CVE-2026-55833","file":"openvex/pingfederate/CVE-2026-55833.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"False Positive. A repo-wide grep -rn \"SpdyFrameCodec\" (and import io.netty generally) across the PF code base returns zero matches. PingFederate never enables or configures SPDY anywhere — SPDY is a defunct protocol Netty still ships classes for, but nothing in PingFederate wires it up. PingFederate's actual HTTP server is Jetty (jetty-server, jetty-alpn-*), not Netty."},{"id":"CVE-2026-55833","file":"openvex/pingfederate/CVE-2026-55833.openvex.json","product":"pingfederate","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected by CVE-2026-55833. The affected SPDY header decompression path lives in netty-codec-http's server-side SPDY stack, which PingFederate never operates: PingFederate's HTTP endpoints are served by Jetty, no PingFederate code installs Netty handlers, and no PingFederate endpoint accepts SPDY connections. netty-codec-http is present in PingFederate 13.1 only as an unused transitive of the AWS SDK's asynchronous transport (and embedded inside the bundled AWS KMS encryptor integration) and never parses network data, so the compression-amplified inflation loop is unreachable. Not exploitable; no upgrade, mitigation, or configuration change is required."},{"id":"CVE-2026-55851","file":"openvex/pingaccess/CVE-2026-55851.openvex.json","product":"pingaccess","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"this vulnerability is specific to the io.netty:netty-codec-haproxy module. PingAccess does not include this module in its dependencies."},{"id":"CVE-2026-55851","file":"openvex/pingfederate/CVE-2026-55851.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate doesn't ship netty-codec-haproxy in any form — it's absent from the dependency graph, the scan inventory, and the shaded jars — so CVE-2026-55851 doesn't apply."},{"id":"CVE-2026-5588","file":"openvex/pingaccess/CVE-2026-5588.openvex.json","product":"pingaccess","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"component_not_present","notes":"Not Affected. This vulnerability in Bouncy Castle's CompositeVerifier allows bypassing signature verification if an empty sequence is provided. PingAccess does not use the CompositeVerifier component for its signature validation logic."},{"id":"CVE-2026-5598","file":"openvex/pingam/CVE-2026-5598.openvex.json","product":"pingam","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"No immediate action required — the vulnerability is not exploitable in PingAM because FrodoKEM is unused. Customers should plan to apply the next PingAM maintenance release once xxxx... (backport) and xxxx... (risk-integration jar) ship, which will bump bcprov-jdk18on to 1.84 and incidentally resolve this CVE across all supported branches."},{"id":"CVE-2026-5598","file":"openvex/pingauthorize/CVE-2026-5598.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"PingAuthorize does not utilize the vulnerable FrodoEngine.java Post Quantum Cryptograph KEM class, hence this CVE is not exploitable in the context of the product. Bouncy Castle depedency will be upgraded in the next release."},{"id":"CVE-2026-56745","file":"openvex/pingaccess/CVE-2026-56745.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess ships Netty 4.1.118.Final which contains SPDY memory-leak classes. PingAccess does not configure SPDY in its Netty pipeline. Not exploitable."},{"id":"CVE-2026-56745","file":"openvex/pingauthorize/CVE-2026-56745.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"This vulnerability is not exploitable within PingAuthorize, as the product does not utilize the vulnerable SPDY classes. Additionally, the underlying Netty component is scheduled for an upgrade in the upcoming 11.2 major release."},{"id":"CVE-2026-56745","file":"openvex/pingfederate/CVE-2026-56745.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"False Positive. SPDY is unused (as above) — SpdyHttpDecoder is never instantiated by anything in PingFederate. Even the carrier of this class, netty-nio-client, is never actually instantiated at runtime: netty-nio-client backs only the AWS SDK's async HTTP clients. Every AWS client PingFederate builds is either explicitly configured with ApacheHttpClient or uses a synchronous client; the S3_PING class uses synchronous S3Client). None of these touch the Netty async transport at all — it's dead weight on the classpath, never given a socket to manage."},{"id":"CVE-2026-56745","file":"openvex/pingfederate/CVE-2026-56745.openvex.json","product":"pingfederate","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected by CVE-2026-56745. The vulnerable SpdyHttpDecoder is a server-side handler that converts SPDY stream frames into HTTP objects and is exercised only when an application explicitly installs Netty's SPDY-to-HTTP codec in a channel pipeline; PingFederate never does so. All PingFederate HTTP processing is performed by Jetty, and the only copies of netty-codec-http in the distribution — the AWS SDK's unused asynchronous-transport transitive and the copy embedded in the AWS KMS encryptor integration — never process network data. No remote peer can send a SYN_STREAM frame to any PingFederate component, so the pooled-buffer leak cannot occur; not exploitable, and no change is required."},{"id":"CVE-2026-56746","file":"openvex/pingaccess/CVE-2026-56746.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"component_not_present","notes":"PingAccess ships Netty 4.1.118.Final. Netty's CorsHandler is not used‚ PingAccess implements its own CORS layer via PreAuthnCorsInterceptor and CrossOriginRequestPolicyInterceptor. Not exploitable."},{"id":"CVE-2026-56746","file":"openvex/pingauthorize/CVE-2026-56746.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"PingAuthorize does not utilize Netty's CorsHandler; therefore, this vulnerability is not exploitable within the product."},{"id":"CVE-2026-56746","file":"openvex/pingfederate/CVE-2026-56746.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate's CORS enforcement is implemented as plain servlet Filters — CrossOriginFilter.java:68 (public class CrossOriginFilter implements Filter, a ported copy of Jetty's older CORS filter, per its copyright header) and the equivalent AdminApiCrossOriginFilter in the admin-api module. Neither has any code relationship to Netty's io.netty.handler.codec.http.cors.CorsHandler — different class hierarchy, different origin-evaluation logic entirely. The specific logical-operator bug described in this CVE lives inside Netty's CorsHandler, which PingFederate's servlet filters never call."},{"id":"CVE-2026-56816","file":"openvex/pingfederate/CVE-2026-56816.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"PingFederate is not vulnerable to CVE-2026-56816. The vulnerable class (Http3FrameCodec, in the netty-codec-http3 artifact) is not present in the product at all. The attack surface doesn't exist either. The CVE requires an attacker to open QUIC streams against a Netty-based HTTP/3 server. PingFederate's HTTP listener is Jetty, not Netty - its Netty usage is purely client-side (Redis via Lettuce, AWS services). Even if the http3 codec jar were on the classpath, nothing would instantiate Http3FrameCodec in a server role."},{"id":"CVE-2026-56817","file":"openvex/pingfederate/CVE-2026-56817.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not Vulnerable. This CVE affects the XmlDecoder class in Netty's optional netty-codec-xml module, which PingFederate does not include in any release. PingFederate carries Netty only as a transitive dependency of the Lettuce Redis client and the AWS SDK, which use Netty's core transport and HTTP modules; neither the XML codec module nor the Aalto XML parser it depends on is present on the PingFederate classpath. Because the vulnerable class cannot be loaded and no PingFederate component performs XML decoding through Netty, the DOCTYPE/external-entity processing risk described in this CVE does not apply to PingFederate."},{"id":"CVE-2026-56818","file":"openvex/pingfederate/CVE-2026-56818.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"Not Vulnerable. This CVE affects RedisArrayAggregator in Netty's optional netty-codec-redis module, which PingFederate does not ship in any release. While PingFederate supports Redis for session/state storage, it communicates with Redis exclusively through the Lettuce client, which implements its own RESP protocol codec and does not use Netty's Redis codec module. Because the vulnerable handler is not on the classpath, the buffer-pinning attack described in this CVE is not exploitable against PingFederate."},{"id":"CVE-2026-56819","file":"openvex/pingauthorize/CVE-2026-56819.openvex.json","product":"pingauthorize","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"vulnerable_code_not_in_execute_path","no

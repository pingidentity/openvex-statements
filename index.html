base image and used only for generic tooling; LDAP Gateway does not invoke the openssl CLI or rely on its binaries directly, so openssl is not used by the product at runtime."},{"id":"CVE-2025-7962","file":"openvex/pingauthorize/CVE-2025-7962.openvex.json","product":"pingauthorize","pkg":"jakarta.mail","sub":"pkg:maven/com.sun.mail/jakarta.mail","just":"inline_mitigations_already_exist","notes":"Jakarta is used by PingAuthorize for sending status notification and alerts https://docs.pingidentity.com/pingdirectory/10.3/pingdirectory_server_administration_guide/pd_ds_manage_notifs_alerts.html. To successfully exploit the vulnerability, the server needs to send an email with content-type header set to `text/html;charset=utf-8`  mentioned in https://gitlab.eclipse.org/security/vulnerability-reports/-/issues/290. This is not possible in PingAuthorize, as the type is hardcoded to text/plain; charset=us-ascii. To prevent the CVE from appearing in future scans, the dependency will be upgraded to version 2.0.2 in version 11 of the product."},{"id":"CVE-2025-7962","file":"openvex/pingidm/CVE-2025-7962.openvex.json","product":"pingidm","pkg":"javax-mail","sub":"pkg:generic/javax-mail@1.6.2","just":"component_not_present","notes":"False positive; the vulnerability affects jakarta.mail, not the javax.mail library used by IDM."},{"id":"CVE-2025-8671","file":"openvex/pingauthorize/CVE-2025-8671.openvex.json","product":"pingauthorize","pkg":"httpcore5-h2","sub":"pkg:generic/httpcore5-h2@5.3.4","just":"vulnerable_code_not_in_execute_path","notes":"The product operates exclusively over HTTP/1.1 and has HTTP/2 protocol support completely disabled; therefore, CVE-2025-8671 is not exploitable."},{"id":"CVE-2025-8869","file":"openvex/pingaccess/CVE-2025-8869.openvex.json","product":"pingaccess","pkg":"cpython","sub":"pkg:generic/cpython","just":"vulnerable_code_not_in_execute_path","notes":"PA doesn't use python."},{"id":"CVE-2025-8885","file":"openvex/pingauthorize/CVE-2025-8885.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"PingAuthorize Server and PingDirectory do not consume ASN1Object objects from untrusted sources as it is mentioned in the CVE https://github.com/bcgit/bc-java/wiki/CVE%E2%80%902025%E2%80%908885, hence it is not exploitable. Bouncy Castle FIPS packages will be upgraded in version 11 of the products"},{"id":"CVE-2025-8916","file":"openvex/pingaccess/CVE-2025-8916.openvex.json","product":"pingaccess","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"component_not_present","notes":"This is flagging on a transitive dependency of bc-fips. We do not use the vulnerable PKIXCertPathReviewer within pingaccess. https://mvnrepository.com/artifact/org.bouncycastle/bc-fips/2.0.0"},{"id":"CVE-2025-8916","file":"openvex/pingam/CVE-2025-8916.openvex.json","product":"pingam","pkg":"bouncy-castle-bcpkix-jdk18on","sub":"pkg:generic/bouncy-castle-bcpkix-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"Upgrade to PingAM 7.4.3 or later (7.4.x customers), 7.5.3 or later (7.5.x customers), 8.0.2 or later (8.0.x customers), or 8.1.0 or later (8.1.x customers) to obtain bcpkix-jdk18on-1.79 which removes the vulnerability; reference xxxx... for patch details"},{"id":"CVE-2025-8916","file":"openvex/pingauthorize/CVE-2025-8916.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"PingAuthorize Server and PingDirectory do not utilize the vulnerable class 'PKIXCertPathReviewer' as described in the CVE details https://github.com/bcgit/bc-java/wiki/CVE%E2%80%902025%E2%80%908916, hence it is not exploitable. Bouncy Castle packages will be upgraded in version 11 of the products."},{"id":"CVE-2025-8916","file":"openvex/pingidm/CVE-2025-8916.openvex.json","product":"pingidm","pkg":"bcpkix-jdk18on","sub":"pkg:generic/bcpkix-jdk18on@1.78.1","just":"component_not_present","notes":"False positive; while IDM uses a vulnerable Bouncy Castle version, the vulnerable PKIXCertPathReviewer is not used; JCA APIs are used instead."},{"id":"CVE-2025-9230","file":"openvex/pingaccess/CVE-2025-9230.openvex.json","product":"pingaccess","pkg":"openssl","sub":"pkg:generic/openssl","just":"component_not_present","notes":"PingAccess does not use the vulnerable function of trying to decrypt CMS messages encrypted using password based encryption. This is not exploitable within PingAccess. A ticket has been created to upgrade this library here:"},{"id":"CVE-2025-9340","file":"openvex/pingauthorize/CVE-2025-9340.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"The bc-fips library is used only when the product is installed in the FIPS-compliant mode. PingAuthorize does not officially support this mode of operation. Hence, this vulnerability is not exploitable. The library will be updated in the next release (June 2026)."},{"id":"CVE-2025-9341","file":"openvex/pingauthorize/CVE-2025-9341.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"The bc-fips library is used only when the product is installed in the FIPS-compliant mode. PingAuthorize does not officially support this mode of operation. Hence, this vulnerability is not exploitable. The library will be updated in the next release (June 2026)."},{"id":"CVE-2025-9403","file":"openvex/pingoneldapgateway/CVE-2025-9403.openvex.json","product":"pingoneldapgateway","pkg":"jquery-ui","sub":"pkg:npm/jquery-ui@1.6-r1","just":"component_not_present","notes":"jq 1.6-r1 is installed in the base image as a CLI JSON tool, but there are no references to jq in gateway code or product directories, so jq is not used by the product at runtime."},{"id":"CVE-2026-0636","file":"openvex/pingam/CVE-2026-0636.openvex.json","product":"pingam","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"No action required for this specific CVE. Communicate to customers as a scanner-visible library finding rather than an exploitable PingAM vulnerability. When the next PingAM maintenance release ships with the Bouncy Castle 1.84 commons bump (xxxx...), the library-level finding will also be resolved. The jruby-stdlib embedded BC 1.79 copy will remain until JRuby upstream ships with BC >= 1.84."},{"id":"CVE-2026-0636","file":"openvex/pingauthorize/CVE-2026-0636.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"PingAuthorize does not utilize the vulnerable LDAPStoreHelper utility class, hence this CVE is not exploitable in the context of the product. Bouncy Castle depedency will be upgraded in the next release."},{"id":"CVE-2026-0636","file":"openvex/pingig/CVE-2026-0636.openvex.json","product":"pingig","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"This impacts PingGateway Standalone and will be fixed in versions 2026.6, 2025.11.3 and 2024.11.3"},{"id":"CVE-2026-0915","file":"openvex/pingaccess/CVE-2026-0915.openvex.json","product":"pingaccess","pkg":"glibc","sub":"pkg:generic/glibc","just":"vulnerable_code_not_in_execute_path","notes":"CVE-2026-0915 is in glibc, part of the Red Hat UBI 9 base image and ops-utility package set in the PingAccess container. It is not part of the PingAccess product code and is not invoked by PingAccess at runtime, so the finding is not exploitable through the product. GLib is a base-image desktop/runtime library; no PingAccess runtime code links against it. The package is remediated via regular base-image rebuilds, which pick up the latest Red Hat-patched packages."},{"id":"CVE-2026-0990","file":"openvex/pingaccess/CVE-2026-0990.openvex.json","product":"pingaccess","pkg":"libxml2","sub":"pkg:generic/libxml2","just":"vulnerable_code_not_in_execute_path","notes":"CVE-2026-0990 is in libxml2, part of the Red Hat UBI 9 base image and ops-utility package set in the PingAccess container. It is not part of the PingAccess product code and is not invoked by PingAccess at runtime, so the finding is not exploitable through the product. libxml2 is a base-image library; the xmllint command-line tool is not executed by PingAccess. The package is remediated via regular base-image rebuilds, which pick up the latest Red Hat-patched packages."},{"id":"CVE-2026-1002","file":"openvex/pingig/CVE-2026-1002.openvex.json","product":"pingig","pkg":"vertx-core","sub":"pkg:generic/vertx-core@5.0.2","just":"component_not_present","notes":"The vulnerability is restricted to StaticHandler which is not used by the current supported version of PingGateway Standalone during runtime. The use of StaticHandler applies only to the PingGateway sample application which has been included for demonstration / documentation purposes only"},{"id":"CVE-2026-10050","file":"openvex/pingaccess/CVE-2026-10050.openvex.json","product":"pingaccess","pkg":"jetty-server","sub":"pkg:maven/org.eclipse.jetty/jetty-server","just":"vulnerable_code_not_in_execute_path","notes":"CVE is RESERVED at NVD with no published details. No Jetty JARs are present as active dependencies in PingAccess. Not affected."},{"id":"CVE-2026-10050","file":"openvex/pingauthorize/CVE-2026-10050.openvex.json","product":"pingauthorize","pkg":"jetty-server","sub":"pkg:maven/org.eclipse.jetty/jetty-server","just":"component_not_present","notes":"The product does not use Jetty's Digest Authenticator. Therefore, CVE-2026-10050 is not applicable."},{"id":"CVE-2026-10050","file":"openvex/pingfederate/CVE-2026-10050.openvex.json","product":"pingfederate","pkg":"hetty","sub":"pkg:generic/hetty","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate codebase is not vulnerable to CVE-2026-10050. The vulnerable component isn't used. No references to DigestAuthenticator or Jetty's digest auth constants anywhere in Java code. No \u003cauth-method>DIGEST\u003c/auth-method> (or any auth-method) declarations in any web.xml. No Jetty LoginService/SecurityHandler-based container authentication in use at all — PingFederate implements its own authentication layers (admin console auth, OAuth client auth, etc.) rather than delegating to Jetty's container security."},{"id":"CVE-2026-10051","file":"openvex/pingfederate/CVE-2026-10051.openvex.json","product":"pingfederate","pkg":"jetty-server","sub":"pkg:maven/org.eclipse.jetty/jetty-server","just":"inline_mitigations_already_exist","notes":"PingFederate embeds Eclipse Jetty as its servlet container, so exposure to CVE-2026-10051 tracks the bundled Jetty version exactly — there's no PingFederate-specific code that touches HTTP trailers or Jetty's connection-recycling internals, so PF neither introduces nor mitigates this bug independently. PF 13.0 will be updated with a non-vulnerable version of jetty."},{"id":"CVE-2026-100655","file":"openvex/pingfederate/CVE-2026-100655.openvex.json","product":"pingfederate","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected by CVE-2026-100655. The affected SpdySessionHandler is Netty's SPDY server session handler, and PingFederate never operates Netty as an HTTP or SPDY server: all PingFederate HTTP endpoints are served by Jetty, and no PingFederate code references Netty or installs Netty handlers into any channel pipeline. Netty is present in the distribution only as an unused transitive of the AWS SDK's asynchronous transport, so a remote peer cannot open a SPDY connection to any PingFederate component and the unbounded stream accounting is never exercised. Not exploitable; no upgrade, mitigation, or configuration change is required."},{"id":"CVE-2026-100656","file":"openvex/pingfederate/CVE-2026-100656.openvex.json","product":"pingfederate","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected by CVE-2026-100656. The affected code is HttpServerCodec, Netty's HTTP/1.1 server codec: PingFederate's HTTP processing is handled by Jetty, and no PingFederate code references or installs Netty server handlers, so the vulnerable codec is never placed in any channel pipeline and never parses network data. netty-codec-http appears in PingFederate only as an unused transitive of the AWS SDK's asynchronous transport (in 12.3, 13.0, and 13.1; embedded inside the bundled KMS master-key encryptor integration in newer releases), and PingFederate never operates Netty as an HTTP server. The pipelining attack therefore has no reachable target in PingFederate; no upgrade, mitigation, or configuration change is required."},{"id":"CVE-2026-100658","file":"openvex/pingfederate/CVE-2026-100658.openvex.json","product":"pingfederate","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected by CVE-2026-100658. The affected WebSocketServerExtensionHandler is only invoked when an application explicitly installs it in a Netty pipeline to negotiate WebSocket extensions, and PingFederate runs no Netty-based HTTP or WebSocket endpoints: its HTTP endpoints are served by Jetty, and no PingFederate code references Netty. The handler is therefore never instantiated, and the HTTP/1.1 pipelining attack cannot reach the unbounded extension queue through any PingFederate component, including through the unused Netty copies shipped inside the AWS KMS master-key encryptor integration. Not exploitable; no upgrade, mitigation, or configuration change is required."},{"id":"CVE-2026-100666","file":"openvex/pingaccess/CVE-2026-100666.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess 8.3 bundles Netty 4.1.118, within the affected range (4.1.x \u003c= 4.1.136). The mechanism is reachable in PingAccess through PingAccess's own front-end response encoder (FrontEndHttpResponseEncoder), which pairs responses to pipelined requests via a method queue and polls it once per outbound response without excluding 1xx informational responses - the same pattern described in the upstream advisory for HttpServerCodec. PingAccess answers Expect: 100-continue automatically by default, so a pipelined GET (Expect: 100-continue) followed by HEAD can mispair the queue and desynchronize response framing on the client-facing connection. Impact is bounded: PingAccess is a parse-and-re-encode proxy, so no desynchronized request stream reaches the origin servers, and the effect is limited to the attacker's own connection. This behavior is independent of the bundled Netty version and is tracked as a product fix under PA-16719; upgrading the bundled Netty alone does not remediate it."},{"id":"CVE-2026-100666","file":"openvex/pingauthorize/CVE-2026-100666.openvex.json","product":"pingauthorize","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"The product does not operate a Netty-based HTTP server, as all inbound HTTP traffic is handled by Jetty. Therefore, CVE-2026-100666 is not exploitable."},{"id":"CVE-2026-100666","file":"openvex/pingfederate/CVE-2026-100666.openvex.json","product":"pingfederate","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"component_not_present","notes":"PingFederate 12.3 bundles netty-codec-http 4.1.118.Final through the AWS SDK, which falls within the affected version range, so scanner findings against the bundled jar are expected. The vulnerable logic pairs requests and responses inside Netty's HTTP server codec, and PingFederate operates no Netty-based HTTP server: all PingFederate HTTP endpoints are served by Jetty, and the bundled Netty stack exists only as a client-side transport for the AWS SDK that PingFederate does not select (the AWS SDK is explicitly configured to use the Apache HTTP client instead). The attack requires a malicious client connecting to a Netty HTTP server that uses the affected codec, which does not exist in any PingFederate network-facing component, so the issue is not exploitable. PingFederate will include an upgrade to the fixed Netty version (4.1.137.Final) in an upcoming maintenance release to remediate the bundled copy; the latest release does not bundle netty-codec-http at all - the AWS SDK netty transport is excluded from the distribution, and the bundled Lettuce Redis client pulls only Netty core, DNS, and transport artifacts without the HTTP codec."},{"id":"CVE-2026-102276","file":"openvex/pingfederate/CVE-2026-102276.openvex.json","product":"pingfederate","pkg":"brace-expansion","sub":"pkg:generic/brace-expansion","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate's JavaScript toolchain includes the affected brace-expansion library — version 1.1.11 in the 12.3 line and 1.1.18/2.1.4/5.0.9 in the latest release, all below the fixed versions — so scanner findings against the development lockfiles are expected. The library is present only as a transitive build-toolchain dependency (via minimatch under babel, eslint, jest, and glob), confined to the devDependencies used to compile and lint the admin console frontend, and we verified the compiled bundles shipped in the product contain none of its code. The vulnerability requires a crafted glob-style brace pattern to be expanded at runtime, which never occurs in any PingFederate runtime component: patterns are only processed by build tools on the developer's machine against the repository's own build scripts. PingFederate will refresh the build toolchain lockfiles in an upcoming release to resolve the finding; there is no runtime exposure and no attack path from any network-facing component."},{"id":"CVE-2026-102277","file":"openvex/pingfederate/CVE-2026-102277.openvex.json","product":"pingfederate","pkg":"brace-expansion","sub":"pkg:generic/brace-expansion","just":"component_not_present","notes":"PingFederate is not affected, consistent with the disposition for CVE-2026-102276 and CVE-2026-102278. The affected brace-expansion versions present in the build lockfiles (1.1.11 in the 12.3 line; 1.1.18/2.1.4/5.0.9 in the latest release) exist solely in the frontend build toolchain as dev-only transitive dependencies of minimatch — used by babel, eslint, jest, and glob at build time — and none of the library's code is present in any JavaScript bundle shipped in the product. The vulnerability requires a crafted {a},b}-shaped glob pattern to be supplied to the expand API at runtime, and no PingFederate runtime component — Java server, admin console, or any shipped web asset — performs brace expansion on any input, attacker-influenced or otherwise. Even in the build-toolchain context, the pattern input is the repository's own build scripts, not untrusted data. PingFederate will update the affected development dependencies in the upcoming release already planned for the other brace-expansion findings; there is no runtime exposure and no attack path from any network-facing component."},{"id":"CVE-2026-102278","file":"openvex/pingfederate/CVE-2026-102278.openvex.json","product":"pingfederate","pkg":"brace-expansion","sub":"pkg:generic/brace-expansion","just":"component_not_present","notes":"PingFederate is not exploitable: the affected library versions present in the build lockfiles (1.1.11 in 12.3; 1.1.18/2.1.4/5.0.9 in the latest release) exist solely in the frontend build toolchain as dev-only transitive dependencies of minimatch, and the code is not present in any JavaScript bundle shipped in the product. The deeply-nested-brace recursion this CVE describes can only be triggered by an untrusted brace pattern supplied to the expand API at runtime, and no PingFederate runtime component — Java server, admin console, or any shipped web asset — invokes brace expansion on user-influenced input. Both brace-expansion CVEs share this disposition; PingFederate will update the affected development dependencies in an upcoming release to clear the scanner finding."},{"id":"CVE-2026-102554","file":"openvex/pingauthorize/CVE-2026-102554.openvex.json","product":"pingauthorize","pkg":"guava","sub":"pkg:generic/guava@33.4","just":"vulnerable_code_not_in_execute_path","notes":"The product never uses guava classes and never deserializes attacker-controlled Java serialization streams. All external input is parsed as JSON. Therefore the CVE is not exploitable."},{"id":"CVE-2026-104721","file":"openvex/pingauthorize/CVE-2026-104721.openvex.json","product":"pingauthorize","pkg":"logback-classic","sub":"pkg:maven/ch.qos.logback/logback-classic","just":"component_not_present","notes":"The product does not use SiftingAppender in any logging configuration, and log file paths are never derived from user-supplied data such as correlation IDs. The CVE is not exploitable."},{"id":"CVE-2026-10532","file":"openvex/pingauthorize/CVE-2026-10532.openvex.json","product":"pingauthorize","pkg":"logback-classic","sub":"pkg:maven/ch.qos.logback/logback-classic","just":"vulnerable_code_not_in_execute_path","notes":"The PingData Admin Console application does not run any of Logback’s serialized-event socket receivers. Therefore the CVE is not exploitable."},{"id":"CVE-2026-10532","file":"openvex/pingidm/CVE-2026-10532.openvex.json","product":"pingidm","pkg":"logback-classic","sub":"pkg:maven/ch.qos.logback/logback-classic","just":"vulnerable_code_not_in_execute_path","notes":"Not exploitable - Exploitation requires Janino on the classpath, which is only a test scope dependency in IDM. Library included in Master, 8.1 and 8.0 branches"},{"id":"CVE-2026-109618","file":"openvex/pingfederate/CVE-2026-109618.openvex.json","product":"pingfederate","pkg":"php","sub":"pkg:generic/php","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected by CVE-2026-109618. This vulnerability resides entirely within the PHP runtime's out-of-memory error handling, and PingFederate is a pure Java application that does not embed, execute, or ship PHP in any form. Because no PHP interpreter or PHP code is present in the product, there is no attack surface for this issue in any supported PingFederate version. No remediation or configuration change is required."},{"id":"CVE-2026-109619","file":"openvex/pingfederate/CVE-2026-109619.openvex.json","product":"pingfederate","pkg":"php","sub":"pkg:generic/php","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not affected by CVE-2026-109619. This vulnerability is in the PHP runtime's handling of global state across requests, and PingFederate is a pure Java application that does not embed, execute, or ship PHP in any form. Because no PHP interpreter is present in the product, there is no attack surface for this issue in any supported PingFederate version. No remediation or configuration change is required."},{"id":"CVE-2026-111497","file":"openvex/pingaccess/CVE-2026-111497.openvex.json","product":"pingaccess","pkg":"nodejs","sub":"pkg:generic/nodejs","just":"component_not_present","notes":"Not affected. CVE-2026-111497 is an out-of-bounds write in the Node.js built-in Brotli decoder, exploitable only where a Node.js runtime decompresses attacker-controlled Brotli data. PingAccess does not ship or execute a Node.js runtime: the Node.js-built UI is compiled ahead of time into static JavaScript bundles served by the product, and at request time the browser (not Node.js) renders it and performs any Content-Encoding decompression using the browser's own Brotli implementation, which is separate code and not affected by this CVE. Node.js is used only in CI build containers, which are not deployed to production."},{"id":"CVE-2026-111497","file":"openvex/pingauthorize/CVE-2026-111497.openvex.json","product":"pingauthorize","pkg":"nodejs","sub":"pkg:generic/nodejs","just":"component_not_present","notes":"Not affected. CVE-2026-111497 is an out-of-bounds write in the Node.js built-in Brotli decoder, exploitable only where a Node.js runtime decompresses attacker-controlled Brotli data. PingAuthorize does not ship or execute a Node.js runtime: the Node.js-built UI is compiled ahead of time into static JavaScript bundles served by the product, and at request time the browser (not Node.js) renders it and performs any Content-Encoding decompression using the browser's own Brotli implementation, which is separate code and not affected by this CVE. Node.js is used only in CI build containers, which are not deployed to production."},{"id":"CVE-2026-111497","file":"openvex/pingbase/CVE-2026-111497.openvex.json","product":"pingbase","pkg":"nodejs","sub":"pkg:generic/nodejs","just":"component_not_present","notes":"Not affected. CVE-2026-111497 is an out-of-bounds write in the Node.js built-in Brotli decoder, exploitable only where a Node.js runtime decompresses attacker-controlled Brotli data. PingBase does not ship or execute a Node.js runtime: the Node.js-built UI is compiled ahead of time into static JavaScript bundles served by the product, and at request time the browser (not Node.js) renders it and performs any Content-Encoding decompression using the browser's own Brotli implementation, which is separate code and not affected by this CVE. Node.js is used only in CI build containers, which are not deployed to production."},{"id":"CVE-2026-111497","file":"openvex/pingcentral/CVE-2026-111497.openvex.json","product":"pingcentral","pkg":"nodejs","sub":"pkg:generic/nodejs","just":"component_not_present","notes":"N  ship or execute a Node.js runtime: the Node.js-built UI is compiled ahead of time into static JavaScript bundles served by the product, and at request time the browser (not Node.js) renders it and performs any Content-Encoding decompression using the browser's own Brotli implementation, which is separate code and not affected by this CVE. Node.js is used only in CI build containers, which are not deployed to production."},{"id":"CVE-2026-111497","file":"openvex/pingtoolkit/CVE-2026-111497.openvex.json","product":"pingtoolkit","pkg":"nodejs","sub":"pkg:generic/nodejs","just":"component_not_present","notes":"Not affected. CVE-2026-111497 is an out-of-bounds write in the Node.js built-in Brotli decoder, exploitable only where a Node.js runtime decompresses attacker-controlled Brotli data. PingToolkit does not ship or execute a Node.js runtime: the Node.js-built UI is compiled ahead of time into static JavaScript bundles served by the product, and at request time the browser (not Node.js) renders it and performs any Content-Encoding decompression using the browser's own Brotli implementation, which is separate code and not affected by this CVE. Node.js is used only in CI build containers, which are not deployed to production."},{"id":"CVE-2026-12185","file":"openvex/pingauthorize/CVE-2026-12185.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"BKS and UBER - the two types backed by the vulnerable BcKeyStoreSpi - are never used. Not exploitable."},{"id":"CVE-2026-1225","file":"openvex/pingam/CVE-2026-1225.openvex.json","product":"pingam","pkg":"logback-classic","sub":"pkg:maven/ch.qos.logback/logback-classic","just":"vulnerable_code_cannot_be_controlled_by_adversary","notes":"Upgrade to the next PingAM maintenance release that includes the logback-core >=1.5.25 update (7.5.3+ for 7.5.x customers; equivalent sustaining releases for 7.4.x, 8.0.x, and 8.1.x); if immediate upgrade is not possible, ensure the logback configuration file is not writable by any unprivileged user or process as an interim hardening measure"},{"id":"CVE-2026-12803","file":"openvex/pingauthorize/CVE-2026-12803.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"The vulnerable KCCMBlockCipher code path is never invoked. Not exploitable."},{"id":"CVE-2026-12816","file":"openvex/pingauthorize/CVE-2026-12816.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"component_not_present","notes":"PingAuthorize does not use any Bouncy Castle encryption engines or IES primitives. The vulnerable IESEngine code path is never invoked. Not exploitable."},{"id":"CVE-2026-12860","file":"openvex/pingauthorize/CVE-2026-12860.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"The vulnerable bcprov RSADigestSigner is never invoked by the product. Not exploitable."},{"id":"CVE-2026-13006","file":"openvex/pingauthorize/CVE-2026-13006.openvex.json","product":"pingauthorize","pkg":"logback-classic","sub":"pkg:maven/ch.qos.logback/logback-classic","just":"vulnerable_code_cannot_be_controlled_by_adversary","notes":"Exploitation requires Janino on the classpath plus an attacker who can already modify logback config files or inject environment variables. Janino is absent from the product classpath. Even the prerequisite attacker position (local high-privilege file write to the server installation) implies compromise already. Therefore, this CVE does not apply to PingAuthorize."},{"id":"CVE-2026-13505","file":"openvex/pingaccess/CVE-2026-13505.openvex.json","product":"pingaccess","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"vulnerable_code_not_in_execute_path","notes":"Affected range confirmed - the fix ships in bc-fips 2.0.2, and PingAccess bundles 2.0.0. Impact is limited: the finalize()-based zeroisation flaw means key material processed by the BCFIPS provider can linger in the heap via the pending-finalizer queue (and contribute to OOM under sustained load); recovering the material requires local access to the process or a heap dump - there is no remote attack path. Exposure in PingAccess is limited to FIPS-mode deployments: the startup script places resource/bc/fips/* on the classpath only when pa.fips.mode=true in conf/fips-mode.properties; default (non-FIPS) deployments load resource/bc/non-fips (bcprov, not the affected BCFIPS library). The scanned path tools/csd/ is the collect-support-data utility, which runs on demand and is not part of the server runtime classpath. The library will be refreshed in an upcoming maintenance release. Tracking: PA-16720."},{"id":"CVE-2026-13505","file":"openvex/pingauthorize/CVE-2026-13505.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"inline_mitigations_already_exist","notes":"bc-fips is only loaded when FIPS mode is explicitly enabled; in non-FIPS deployments, the library is never placed on the classpath. Customers requiring a mitigation can manually replace the bc-fips library with a newer version. No code or configuration changes are required. The shipped library version will be upgraded in PingAuthorize 11.2."},{"id":"CVE-2026-13506","file":"openvex/pingauthorize/CVE-2026-13506.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"component_not_present","notes":"This CVE is in Bouncy Castle's LazyEncodedSequence and ASN1InputStream - triggered when parsing deeply nested ASN.1 structures. The product does not use Bouncy Castle's ASN.1 parser. Not exploitable."},{"id":"CVE-2026-14257","file":"openvex/pingfederate/CVE-2026-14257.openvex.json","product":"pingfederate","pkg":"brace-expansion","sub":"pkg:generic/brace-expansion","just":"inline_mitigations_already_exist","notes":"False Positive. Even setting the version aside, brace-expansion does not appear in either package.json's dependencies block — it's reachable only transitively via devDependencies (minimatch@3.1.2 → brace-expansion, itself pulled in by the webpack/eslint/jest build-tooling chain). It is never bundled into the webpack-produced, runtime-served admin console or webservice JS."},{"id":"CVE-2026-14682","file":"openvex/pingauthorize/CVE-2026-14682.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"component_not_present","notes":"This CVE is in Bouncy Castle's LazyEncodedSequence and ASN1InputStream - triggered when parsing deeply nested ASN.1 structures. The product does not use Bouncy Castle's ASN.1 parser. Not exploitable."},{"id":"CVE-2026-1484","file":"openvex/pingaccess/CVE-2026-1484.openvex.json","product":"pingaccess","pkg":"glib","sub":"pkg:generic/glib","just":"vulnerable_code_not_in_execute_path","notes":"CVE-2026-1484 is in glib, part of the Red Hat UBI 9 base image and ops-utility package set in the PingAccess container. It is not part of the PingAccess product code and is not invoked by PingAccess at runtime, so the finding is not exploitable through the product. GLib is a base-image desktop/runtime library; no PingAccess runtime code links against it. The package is remediated via regular base-image rebuilds, which pick up the latest Red Hat-patched packages."},{"id":"CVE-2026-1489","file":"openvex/pingaccess/CVE-2026-1489.openvex.json","product":"pingaccess","pkg":"glib","sub":"pkg:generic/glib","just":"vulnerable_code_not_in_execute_path","notes":"CVE-2026-1489 is in glib, part of the Red Hat UBI 9 base image and ops-utility package set in the PingAccess container. It is not part of the PingAccess product code and is not invoked by PingAccess at runtime, so the finding is not exploitable through the product. GLib is a base-image desktop/runtime library; no PingAccess runtime code links against it. The package is remediated via regular base-image rebuilds, which pick up the latest Red Hat-patched packages."},{"id":"CVE-2026-1605","file":"openvex/pingfederate/CVE-2026-1605.openvex.json","product":"pingfederate","pkg":"jetty-server","sub":"pkg:maven/org.eclipse.jetty/jetty-server","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate does not process gzip-compressed HTTP requests using Jetty’s GzipHandler. Therefore, the vulnerable code path is not reachable, and the issue is not exploitable in this product."},{"id":"CVE-2026-17495","file":"openvex/pingfederate/CVE-2026-17495.openvex.json","product":"pingfederate","pkg":"moment","sub":"pkg:npm/moment","just":"component_not_present","notes":"PingFederate is not affected. The vulnerable moment version is present in the admin-console frontend — it reaches the shipped JavaScript bundle as a transitive dependency of the UI design-system and timezone libraries — but the exploit requires an application to pass attacker-controlled, non-string input directly to moment.locale(), and no PingFederate code, in any release, calls moment.locale() at all: the only locale() invocations in the shipped bundles are moment's own internal calls, and the application source passes user-supplied data only to sorting and display helpers. The advisory itself scopes the issue primarily to npm server-side users passing user input into locale(), which does not describe any PingFederate component — the affected code executes in the authenticated administrator's browser, not on the server, and the require() call it reaches does not exist in the browser bundle. PingFederate will update the moment library in an upcoming release to clear the scanner finding."},{"id":"CVE-2026-17508","file":"openvex/pingfederate/CVE-2026-17508.openvex.json","product":"pingfederate","pkg":"bc-fips-bcpkix-fips","sub":"pkg:generic/bc-fips-bcpkix-fips","just":"vulnerable_code_not_in_execute_path","notes":"PingFederate is not meaningfully affected, and not at all for the unauthenticated scenarios this advisory describes. Of the four affected paths, PingFederate uses none of the direct API entry points — no JcePBMac1CalculatorBuilder, no PKCS12PfxPdu/isMacValid PFX parsing, no scrypt, and no OpenSSH private-key parsing anywhere in the product. The only indirect exposure is in Bouncy Castle FIPS mode, where PingFederate's keystore loading can resolve to Bouncy Castle's PKCS12 keystore implementation, whose PBMAC1 handling routes through the unbounded PBKDF2 path — but that code is reachable only when an authenticated administrator deliberately imports or converts a crafted PKCS#12 keystore file, an operation that already grants the actor administrative control of the server, and the standard keystore formats PingFederate processes (JKS, PKCS#12 via the JDK provider in default mode) derive keys through the JDK's own bounded implementation instead. The high-impact case in this advisory — a small untrusted input dictating arbitrary KDF work before any authentication check — has no unauthenticated or low-privilege path into PingFederate. PingFederate will update the bundled Bouncy Castle libraries in the upcoming release already planned for CVE-2026-71888, CVE-2026-71889, and CVE-2026-71892."},{"id":"CVE-2026-1757","file":"openvex/pingaccess/CVE-2026-1757.openvex.json","product":"pingaccess","pkg":"libxml2","sub":"pkg:generic/libxml2","just":"vulnerable_code_not_in_execute_path","notes":"CVE-2026-1757 is in libxml2 (xmllint), part of the Red Hat UBI 9 base image and ops-utility package set in the PingAccess container. It is not part of the PingAccess product code and is not invoked by PingAccess at runtime, so the finding is not exploitable through the product. libxml2 is a base-image library; the xmllint command-line tool is not executed by PingAccess. The package is remediated via regular base-image rebuilds, which pick up the latest Red Hat-patched packages."},{"id":"CVE-2026-18036","file":"openvex/pingauthorize/CVE-2026-18036.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"component_not_present","notes":"The product does not use or execute Bouncy Castle's NTRU post-quantum KEM implementation. Therefore, this CVE is not exploitable."},{"id":"CVE-2026-18040","file":"openvex/pingauthorize/CVE-2026-18040.openvex.json","product":"pingauthorize","pkg":"bcprov-jdk18on","sub":"pkg:maven/org.bouncycastle/bcprov-jdk18on","just":"component_not_present","notes":"The product does not use the HQC post-quantum algorithm. Therefore, the CVE is not exploitable."},{"id":"CVE-2026-18401","file":"openvex/pingaccess/CVE-2026-18401.openvex.json","product":"pingaccess","pkg":"jackson-core","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-core","just":"vulnerable_code_not_in_execute_path","notes":"False positive for PingAccess 8.3.x. CVE-2026-18401 affects only jackson-core's asynchronous (non-blocking) JSON parser (NonBlockingUtf8JsonParserBase and related classes), which fails to enforce the maxNumberLength StreamReadConstraints limit, allowing DoS via long number tokens. PingAccess 8.3.x ships jackson-core 2.17.0, which is within the affected version range (2.15.0 - 2.18.5), but the vulnerable code path is not reachable: distribution-level bytecode review confirms the async/non-blocking parser is never invoked by any PingAccess component - all JSON parsing uses the synchronous parser, which enforces the limit correctly. Customers should upgrade to the latest applicable PingAccess maintenance release."},{"id":"CVE-2026-18401","file":"openvex/pingauthorize/CVE-2026-18401.openvex.json","product":"pingauthorize","pkg":"jackson-core","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-core","just":"vulnerable_code_not_in_execute_path","notes":"This CVE affects only the asynchronous (non-blocking) JSON parser in NonBlockingUtf8JsonParserBase. The async parser is never used in the codebase.The vulnerable code path cannot be reached. Not exploitable."},{"id":"CVE-2026-18660","file":"openvex/pingauthorize/CVE-2026-18660.openvex.json","product":"pingauthorize","pkg":"jetty-server","sub":"pkg:maven/org.eclipse.jetty/jetty-server","just":"vulnerable_code_not_in_execute_path","notes":"The product does not utilize Jetty's host allow/deny list components or proxy module, making CVE-2026-18660 non-exploitable."},{"id":"CVE-2026-18661","file":"openvex/pingauthorize/CVE-2026-18661.openvex.json","product":"pingauthorize","pkg":"jetty-server","sub":"pkg:maven/org.eclipse.jetty/jetty-server","just":"component_not_present","notes":"The application does not use @ServletSecurity annotations or web.xml security constraints, handling all authorization through Spring Security; therefore, CVE-2026-18661 is not exploitable."},{"id":"CVE-2026-19032","file":"openvex/pingaccess/CVE-2026-19032.openvex.json","product":"pingaccess","pkg":"jackson-databind","sub":"pkg:maven/com.fasterxml.jackson.core/jackson-databind","just":"component_not_present","notes":"False positive for PingAccess 8.3. CVE-2026-19032 requires an attacker-controlled JSON string to be bound to a java.nio.file.Path property, at which point jackson-databind's NioPathDeserializer resolves the attacker-chosen URI (including its scheme) and can invoke an arbitrary registered FileSystemProvider. PingAccess 8.3.x ships jackson-databind 2.17.0, which is within the affected range (2.8.0 - 2.18.10, 2.19.0 - 2.21.6); however distribution-level verification confirms no PingAccess component binds untrusted data to java.nio.file.Path and NioPathDeserializer is never referenced by any PingAccess jar - the classes that use java.nio.file.Path do so for direct file I/O, not through JSON deserialization. The vulnerable code path is unreachable. Customers should upgrade to the latest applicable PingAccess maintenance release."},{"id":"CVE-2026-19203","file":"openvex/pingauthorize/CVE-2026-19203.openvex.json","product":"pingauthorize","pkg":"jetty-server","sub":"pkg:maven/org.eclipse.jetty/jetty-server","just":"vulnerable_code_not_in_execute_path","notes":"Jetty will be upgraded in the upcoming 11.2 release of the product. There is not enough public information to confirm any direct impact on PingAuthorize or to construct a Proof of Concept."},{"id":"CVE-2026-19863","file":"openvex/pingauthorize/CVE-2026-19863.openvex.json","product":"pingauthorize","pkg":"jetty-server","sub":"pkg:maven/org.eclipse.jetty/jetty-server","just":"component_not_present","notes":"The jetty-ethereum component is not included in the product distribution and no Ethereum authenticator is present. Therefore, this CVE is not applicable."},{"id":"CVE-2026-22185","file":"openvex/pingaccess/CVE-2026-22185.openvex.json","product":"pingaccess","pkg":"openldap","sub":"pkg:generic/openldap","just":"component_not_present","notes":"CVE-2026-22185 is in openldap (lmdb), part of the Red Hat UBI 9 base image and ops-utility package set in the PingAccess container. It is not part of the PingAccess product code and is not invoked by PingAccess at runtime, so the finding is not exploitable through the product. mdb_load is an offline LMDB data-load utility; PingAccess does not use LMDB and does not invoke this tool. The package is remediated via regular base-image rebuilds, which pick up the latest Red Hat-patched packages."},{"id":"CVE-2026-22731","file":"openvex/pingauthorize/CVE-2026-22731.openvex.json","product":"pingauthorize","pkg":"spring-boot","sub":"pkg:maven/org.springframework.boot/spring-boot","just":"vulnerable_code_not_in_execute_path","notes":"PingAuthorize and the management console are not effected because there are no authorization endpoints defined as outlined by the advisory management.endpoint.health.group. This dependency will be updated by next release. Please refer to https://spring.io/security/cve-2026-22731 for further information."},{"id":"CVE-2026-22732","file":"openvex/pingauthorize/CVE-2026-22732.openvex.json","product":"pingauthorize","pkg":"spring-security-core","sub":"pkg:maven/org.springframework.security/spring-security-core","just":"vulnerable_code_not_in_execute_path","notes":"The management console does not invoke the calls such as setHeader(\"Content-Length\", ...), setIntHeader(“Content-Length”, ...), or addIntHeader(\"Content-Length\", ...) which are required to create a path for exploitation of this vulnerability, hence it is not exploitable. For more details https://www.herodevs.com/blog-posts/cve-2026-22732-spring-security-silently-drops-http-security-headers"},{"id":"CVE-2026-22733","file":"openvex/pingauthorize/CVE-2026-22733.openvex.json","product":"pingauthorize","pkg":"spring-boot","sub":"pkg:maven/org.springframework.boot/spring-boot","just":"component_not_present","notes":"PingAuthorize and the management console do not use CloudFoundry Actuator endpoints. The dependecy will be updated by next release. Please refer to https://spring.io/security/cve-2026-22733 for further information."},{"id":"CVE-2026-22737","file":"openvex/pingaccess/CVE-2026-22737.openvex.json","product":"pingaccess","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"component_not_present","notes":"According to the disclosure report \"Use of Java scripting engine enabled (e.g. JRuby, Jython) template views in Spring MVC and Spring WebFlux applications can result in disclosure of content from files outside the configured locations for script template views.\" PingAccess and the management console do not use template views in combination with Spring MVC and Spring WebFlux. This dependency will be updated by next release. Please refer to https://spring.io/security/cve-2026-22737 for further information."},{"id":"CVE-2026-22737","file":"openvex/pingauthorize/CVE-2026-22737.openvex.json","product":"pingauthorize","pkg":"spring-webmvc","sub":"pkg:maven/org.springframework/spring-webmvc","just":"component_not_present","notes":"According to the disclosure report \"Use of Java scripting engine enabled (e.g. JRuby, Jython) template views in Spring MVC and Spring WebFlux applications can result in disclosure of content from files outside the configured locations for script template views.\" PingAuthorize and the management console do not use template views in combination with Spring MVC and Spring WebFlux. This dependency will be updated by next release. Please refer to https://spring.io/security/cve-2026-22737 for further information."},{"id":"CVE-2026-22740","file":"openvex/pingauthorize/CVE-2026-22740.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"This is a CVE for the Discourse discussion platform, which is not in use by PingAuthorize or the management console."},{"id":"CVE-2026-22751","file":"openvex/pingauthorize/CVE-2026-22751.openvex.json","product":"pingauthorize","pkg":"spring-security-core","sub":"pkg:maven/org.springframework.security/spring-security-core","just":"component_not_present","notes":"PingAuthorize and the management console do not use the vulnerable JdbcOneTimeTokenService class, hence this vulnerability is not exploitable."},{"id":"CVE-2026-22795","file":"openvex/pingoneldapgateway/CVE-2026-22795.openvex.json","product":"pingoneldapgateway","pkg":"libcrypto1-7","sub":"pkg:generic/libcrypto1-7@1.1.1w-r1","just":"component_not_present","notes":"libcrypto1.1 1.1.1w-r1 is installed in the base image, but libcrypto.so.1.1 is not loaded into the gateway JVM and is not referenced by gateway code or configs, so libcrypto1.1 is not used by the product at runtime."},{"id":"CVE-2026-22795","file":"openvex/pingoneldapgateway/CVE-2026-22795.openvex.json","product":"pingoneldapgateway","pkg":"libssl1-7","sub":"pkg:generic/libssl1-7@1.1.1w-r1","just":"vulnerable_code_not_in_execute_path","notes":"libssl1.1 1.1.1w-r1 is present in the OS but unused by LDAP Gateway at runtime, so this CVE is not exercised by the product."},{"id":"CVE-2026-22795","file":"openvex/pingoneldapgateway/CVE-2026-22795.openvex.json","product":"pingoneldapgateway","pkg":"openssl","sub":"pkg:generic/openssl@1.1.1w-r1","just":"component_not_present","notes":"The openssl package is present in the base image and used only for generic tooling; LDAP Gateway does not invoke the openssl CLI or rely on its binaries directly, so openssl is not used by the product at runtime."},{"id":"CVE-2026-22796","file":"openvex/pingoneldapgateway/CVE-2026-22796.openvex.json","product":"pingoneldapgateway","pkg":"libcrypto1-8","sub":"pkg:generic/libcrypto1-8@1.1.1w-r1","just":"component_not_present","notes":"libcrypto1.1 1.1.1w-r1 is installed in the base image, but libcrypto.so.1.1 is not loaded into the gateway JVM and is not referenced by gateway code or configs, so libcrypto1.1 is not used by the product at runtime."},{"id":"CVE-2026-22796","file":"openvex/pingoneldapgateway/CVE-2026-22796.openvex.json","product":"pingoneldapgateway","pkg":"libssl1-8","sub":"pkg:generic/libssl1-8@1.1.1w-r1","just":"vulnerable_code_not_in_execute_path","notes":"libssl1.1 1.1.1w-r1 is present in the OS but unused by LDAP Gateway at runtime, so this CVE is not exercised by the product."},{"id":"CVE-2026-22796","file":"openvex/pingoneldapgateway/CVE-2026-22796.openvex.json","product":"pingoneldapgateway","pkg":"openssl","sub":"pkg:generic/openssl@1.1.1w-r1","just":"component_not_present","notes":"The openssl package is present in the base image and used only for generic tooling; LDAP Gateway does not invoke the openssl CLI or rely on its binaries directly, so openssl is not used by the product at runtime."},{"id":"CVE-2026-2332","file":"openvex/pingaccess/CVE-2026-2332.openvex.json","product":"pingaccess","pkg":"jetty-io","sub":"pkg:maven/org.eclipse.jetty/jetty-io","just":"component_not_present","notes":"P ,"pkg":"go","sub":"pkg:golang/github.com/golang/go","just":"component_not_present","notes":"The reported Golang vulnerabilities originate from operating-system–level packages (for example, git-lfs) present in the PingAuthorize container’s Alpine base image, not from PingAuthorize itself. Although these packages are implemented in Golang and therefore include Go standard libraries, PingAuthorize does not ship, invoke, or depend on any Go-based binaries or libraries as part of its runtime. There is no execution path by which PingAuthorize can trigger or leverage Golang components: 1. PingAuthorize is a Java-based application; 2. The affected Go binaries are not called by PingAuthorize during normal operation; 3. Exploitation would require direct execution of the OS-level binary, which is outside the PingAuthorize threat model and unrelated to product functionality. If a Golang vulnerability were to be identified that is exploitable through an OS-level package independently of PingAuthorize, remediation would be handled via base image or operating system updates, not via PingAuthorize code or configuration changes."},{"id":"CVE-2026-32281","file":"openvex/pingauthorize/CVE-2026-32281.openvex.json","product":"pingauthorize","pkg":"go","sub":"pkg:golang/github.com/golang/go","just":"component_not_present","notes":"The reported Golang vulnerabilities originate from operating-system–level packages (for example, git-lfs) present in the PingAuthorize container’s Alpine base image, not from PingAuthorize itself. Although these packages are implemented in Golang and therefore include Go standard libraries, PingAuthorize does not ship, invoke, or depend on any Go-based binaries or libraries as part of its runtime. There is no execution path by which PingAuthorize can trigger or leverage Golang components: 1. PingAuthorize is a Java-based application; 2. The affected Go binaries are not called by PingAuthorize during normal operation; 3. Exploitation would require direct executi ulnerabilities originate from operating-system–level packages (for example, git-lfs) present in the PingAuthorize container’s Alpine base image, not from PingAuthorize itself. Although these packages are implemented in Golang and therefore include Go standard libraries, PingAuthorize does not ship, invoke, or depend on any Go-based binaries or libraries as part of its runtime. There is no execution path by which PingAuthorize can trigger or leverage Golang components: 1. PingAuthorize is a Java-based application; 2. The affected Go binaries are not called by PingAuthorize during normal operation; 3. Exploitation would require direct execution of the OS-level binary, which is outside the PingAuthorize threat model and unrelated to product functionality. If a Golang vulnerability were to be identified that is exploitable through an OS-level package independently of PingAuthorize, remediation would be handled via base image or operating system updates, not via PingAuthorize code or configuration changes."},{"id":"CVE-2026-33814","file":"openvex/pingauthorize/CVE-2026-33814.openvex.json","product":"pingauthorize","pkg":"go","sub":"pkg:golang/github.com/golang/go","just":"component_not_present","notes":"The reported Golang vulnerabilities originate from operating-system–level packages (for example, git-lfs) present in the PingAuthorize container’s Alpine base image, not from PingAuthorize itself. Although these packages are implemented in Golang and therefore include Go standard libraries, PingAuthorize does not ship, invoke, or depend on any Go-based binaries or libraries as part of its runtime. There is no execution path by which PingAuthorize can trigger or leverage Golang components: 1. PingAuthorize is a Java-based application; 2. The affected Go binaries are not called by PingAuthorize during normal operation; 3. Exploitation would require direct execution of the OS-level binary, which is outside the PingAuthorize threat model and unrelated to product functionality. If a Golang vulnerability were to be identified that is exploitable through an OS-level package independently of PingAuthorize, remediation would be handled via base image or operating system updates, not via PingAuthorize code or configuration changes."},{"id":"CVE-2026-33870","file":"openvex/pingaccess/CVE-2026-33870.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"PingAccess 8.3 bundles Netty versions within the affected range (4.1.118 in 8.3.0; fixed in 4.1.132, which 8.3.x maintenance builds ship). The quoted-string chunk-extension parsing flaw is present in 8.3.0, but PingAccess is a parse-and-re-encode proxy: inbound requests are parsed by the front-end decoder and re-serialized with canonical CRLF framing to the origin, so chunk-extension ambiguities are not forwarded to the origin byte stream. PingAccess 8.3.6 bundles Netty 4.1.138, outside the affected range."},{"id":"CVE-2026-33870","file":"openvex/pingam/CVE-2026-33870.openvex.json","product":"pingam","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"No immediate action required for standard deployments — engineering has assessed the vulnerable Netty HTTP/1.1 server code path as unreachable in PingAM. Customers should apply the next available PingAM maintenance update once released (tracking xxxx... / xxxx...), which will bump netty-codec-http to 4.1.132.Final or later and eliminate the finding. Monitor TRIAGE-34987 for the official customer-facing response."},{"id":"CVE-2026-33870","file":"openvex/pingauthorize/CVE-2026-33870.openvex.json","product":"pingauthorize","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"The application does not operate a Netty server pipeline or HTTP/1.1/HTTP/2 server parsers, leaving all client-facing traffic to Jetty. Therefore, this Netty CVE is not exploitable."},{"id":"CVE-2026-33870","file":"openvex/pingfederate/CVE-2026-33870.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"The Netty vulnerabilities (CVE-2026-33870 and CVE-2026-33871) are present in PingFederate through both direct library inclusion (netty-codec-http.jar, netty-codec-http2.jar) and transitive dependencies (e.g., aws-kms-master-key-encryptor.jar via the AWS SDK). However, PingFederate does not use Netty as its HTTP server or request-processing engine. All inbound HTTP and HTTP/2 traffic is handled by Jetty. Netty is only used for internal or outbound communication (e.g., AWS SDK clients, Redis integrations) and is not exposed to external clients. Both vulnerabilities require attacker-controlled HTTP/1.1 or HTTP/2 traffic to be parsed directly by Netty in a server or proxy role. Since Netty is not used in this capacity within PingFederate, these vulnerabilities are not exploitable through PingFederate’s external interfaces. Therefore, this is assessed as a dependency-level vulnerability with no direct exploitability in the PingFederate runtime architecture. Remediation will be addressed through dependency upgrades in a future release."},{"id":"CVE-2026-33871","file":"openvex/pingam/CVE-2026-33871.openvex.json","product":"pingam","pkg":"netty-codec-http2","sub":"pkg:maven/io.netty/netty-codec-http2","just":"vulnerable_code_not_in_execute_path","notes":"No immediate emergency action required for standard deployments; apply the next available PingAM maintenance release once xxxx... ships the netty upgrade. Monitor TRIAGE-34987 and xxxx... for release ETAs. If the AM instance is fronted by a reverse proxy that terminates HTTP/2 and passes traffic to Netty directly, treat as higher priority."},{"id":"CVE-2026-33871","file":"openvex/pingauthorize/CVE-2026-33871.openvex.json","product":"pingauthorize","pkg":"netty-codec-http2","sub":"pkg:maven/io.netty/netty-codec-http2","just":"vulnerable_code_not_in_execute_path","notes":"The application does not operate a Netty server pipeline or HTTP/1.1/HTTP/2 server parsers, leaving all client-facing traffic to Jetty. Therefore, this Netty CVE is not exploitable."},{"id":"CVE-2026-33871","file":"openvex/pingfederate/CVE-2026-33871.openvex.json","product":"pingfederate","pkg":"netty-all","sub":"pkg:maven/io.netty/netty-all","just":"component_not_present","notes":"The Netty vulnerabilities (CVE-2026-33870 and CVE-2026-33871) are present in PingFederate through both direct library inclusion (netty-codec-http.jar, netty-codec-http2.jar) and transitive dependencies (e.g., aws-kms-master-key-encryptor.jar via the AWS SDK). However, PingFederate does not use Netty as its HTTP server or request-processing engine. All inbound HTTP and HTTP/2 traffic is handled by Jetty. Netty is only used for internal or outbound communication (e.g., AWS SDK clients, Redis integrations) and is not exposed to external clients. Both vulnerabilities require attacker-controlled HTTP/1.1 or HTTP/2 traffic to be parsed directly by Netty in a server or proxy role. Since Netty is not used in this capacity within PingFederate, these vulnerabilities are not exploitable through PingFederate’s external interfaces. Therefore, this is assessed as a dependency-level vulnerability with no direct exploitability in the PingFederate runtime architecture. Remediation will be addressed through dependency upgrades in a future release."},{"id":"CVE-2026-34477","file":"openvex/pingaccess/CVE-2026-34477.openvex.json","product":"pingaccess","pkg":"log4j-core","sub":"pkg:maven/org.apache.logging.log4j/log4j-core","just":"component_not_present","notes":"Not exploitable in PingAccess. The flaw concerns hostname verification when TLS-configured Socket or Syslog appenders are used. The shipped log4j2.xml contains no active Socket/Syslog appenders (all network appender definitions are commented out) and no \u003cSsl> configuration or verifyHostName attribute appears anywhere in the shipped configuration; the only active layouts are file/console/database appenders with PatternLayout and JsonTemplateLayout. The vulnerable configuration path is not present. Log4j 2.25.4 (fix) ships in PingAccess 8.3.6."},{"id":"CVE-2026-34477","file":"openvex/pingam/CVE-2026-34477.openvex.json","product":"pingam","pkg":"log4j","sub":"pkg:maven/log4j/log4j","just":"component_not_present","notes":"No action required. This is a false positive caused by vulnerability scanners reading test-scoped log4j references from HikariCP's embedded Maven pom metadata inside the WAR. log4j-core is not bundled at runtime. Customers can document this as a false positive."},{"id":"CVE-2026-34478","file":"openvex/pingaccess/CVE-2026-34478.openvex.json","product":"pingaccess","pkg":"log4j-core","sub":"pkg:maven/org.apache.logging.log4j/log4j-core","just":"component_not_present","notes":"Not exploitable in PingAccess. The flaw is log injection via CRLF in the Rfc5424Layout (syslog) when configured directly with TCP framing. Rfc5424Layout does not appear anywhere in PingAccess's shipped log4j2.xml; audit-to-syslog appenders use other layouts and are disabled by default (all network appenders are commented out). The vulnerable configuration is not present. Log4j 2.25.4 (fix) ships in PingAccess 8.3.6."},{"id":"CVE-2026-34478","file":"openvex/pingam/CVE-2026-34478.openvex.json","product":"pingam","pkg":"log4j","sub":"pkg:maven/log4j/log4j","just":"component_not_present","notes":"No action required. This is a false positive — log4j-core is not present in the runtime WAR. Customers can document this as a false positive."},{"id":"CVE-2026-34478","file":"openvex/pingfederate/CVE-2026-34478.openvex.json","product":"pingfederate","pkg":"apache-log4j-core","sub":"pkg:generic/apache-log4j-core","just":"component_not_present","notes":"Even though the PingFederate (versions smaller than 13.1) codebase includes a version of Log4j ample, git-lfs) present in the PingAuthorize container’s Alpine base image, not from PingAuthorize itself. Although these packages are implemented in Golang and therefore include Go standard libraries, PingAuthorize does not ship, invoke, or depend on any Go-based binaries or libraries as part of its runtime. There is no execution path by which PingAuthorize can trigger or leverage Golang components: 1. PingAuthorize is a Java-based application; 2. The affected Go binaries are not called by PingAuthorize during normal operation; 3. Exploitation would require direct execution of the OS-level binary, which is outside the PingAuthorize threat model and unrelated to product functionality. If a Golang vulnerability were to be identified that is exploitable through an OS-level package independently of PingAuthorize, remediation would be handled via base image or operating system updates, not via PingAuthorize code or configuration changes."},{"id":"CVE-2026-39836","file":"openvex/pingauthorize/CVE-2026-39836.openvex.json","product":"pingauthorize","pkg":"go","sub":"pkg:golang/github.com/golang/go","just":"component_not_present","notes":"The reported Golang vulnerabilities originate from operating-system–level packages (for example, git-lfs) present in the PingAuthorize container’s Alpine base image, not from PingAuthorize itself. Although these packages are implemented in Golang and therefore include Go standard libraries, PingAuthorize does not ship, invoke, or depend on any Go-based binaries or libraries as part of its runtime. There is no execution path by which PingAuthorize can trigger or leverage Golang components: 1. PingAuthorize is a Java-based application; 2. The affected Go binaries are not called by PingAuthorize during normal operation; 3. Exploitation would require direct execution of the OS-level binary, which is outside the PingAuthorize threat model and unrelated to product functionality. If a Golang vulnerability were to be identified that is exploitable through an OS-level package independently of PingAuthorize, remediation would be handled via base image or operating system updates, not via PingAuthorize code or configuration changes."},{"id":"CVE-2026-40200","file":"openvex/pingoneldapgateway/CVE-2026-40200.openvex.json","product":"pingoneldapgateway","pkg":"musl","sub":"pkg:generic/musl","just":"vulnerable_code_not_in_execute_path","notes":"Vulnerable qsort code is present in musl. On 64-bit aarch64 systems, triggering the bug requires arrays exceeding ~34 trillion elements (the 64th Leonardo number), which we do not believe is achievable in typical LDAP Gateway container deployments. Based on this, we do not consider LDAP Gateway deployments to be practically exploitable by this issue."},{"id":"CVE-2026-40477","file":"openvex/pingauthorize/CVE-2026-40477.openvex.json","product":"pingauthorize","pkg":"org-thymeleaf-thymeleaf-spring6","sub":"pkg:generic/org-thymeleaf-thymeleaf-spring6@3.1.3","just":"vulnerable_code_not_in_execute_path","notes":"PingAuthorize and the management console 11.0 onward do not meet the prerequisites to being vulnerable to this CVE. Thymeleaf is used in a very limited way to generate error pages for the backend."},{"id":"CVE-2026-40478","file":"openvex/pingauthorize/CVE-2026-40478.openvex.json","product":"pingauthorize","pkg":"org-thymeleaf-thymeleaf-spring6","sub":"pkg:generic/org-thymeleaf-thymeleaf-spring6@3.1.3","just":"vulnerable_code_not_in_execute_path","notes":"PingAuthorize and the management console 11.0 onward do not meet the prerequisites to being vulnerable to this CVE. Thymeleaf is used in a very limited way to generate error pages for the backend."},{"id":"CVE-2026-40971","file":"openvex/pingauthorize/CVE-2026-40971.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"This CVE affects only PingData Management Console. It's not exploitable as Management Console does not utilize the RabbitMQ component. Spring will be updated in version 11.2 (Q3) of the product."},{"id":"CVE-2026-40973","file":"openvex/pingauthorize/CVE-2026-40973.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"This CVE affects only PingData Management Console. It's not exploitable as Management Console does not enable the persistent session mechanism, which is a prerequisite for exploitation. Spring will be updated in version 11.2 (Q3) of the product."},{"id":"CVE-2026-40974","file":"openvex/pingauthorize/CVE-2026-40974.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"This CVE affects only PingData Management Console. It's not exploitable as Management Console does not utilize the Cassandra database component. Spring will be updated in version 11.2 (Q3) of the product."},{"id":"CVE-2026-40975","file":"openvex/pingauthorize/CVE-2026-40975.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"component_not_present","notes":"This CVE affects only PingData Management Console. It's not exploitable as Management Console does not use the expression ${random.*} for generating secrets. Spring will be updated in version 11.2 (Q3) of the product."},{"id":"CVE-2026-40977","file":"openvex/pingauthorize/CVE-2026-40977.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"This CVE affects only PingData Management Console. It's not exploitable as Management Console does not utilize the vulnerable 'ApplicationPidFileWriter' class. Spring will be updated in version 11.2 (Q3) of the product."},{"id":"CVE-2026-40983","file":"openvex/pingauthorize/CVE-2026-40983.openvex.json","product":"pingauthorize","pkg":"micrometer-core","sub":"pkg:generic/micrometer-core","just":"vulnerable_code_not_in_execute_path","notes":"PingAuthorize does not expose any gRPC endpoints; therefore, this CVE is not exploitable within the product."},{"id":"CVE-2026-40984","file":"openvex/pingauthorize/CVE-2026-40984.openvex.json","product":"pingauthorize","pkg":"micrometer-core","sub":"pkg:generic/micrometer-core","just":"vulnerable_code_not_in_execute_path","notes":"This CVE is not exploitable within the Admin Console. According to the vendor advisory, a vulnerability condition requires HTTP server instrumentation to be active and recording metrics. The Admin Console does not explicitly enable or utilize any Micrometer HTTP server instrumentation, meaning the required technical prerequisites are not met. The underlying Spring and Micrometer dependencies are scheduled for an upgrade in version 11.2 of the product."},{"id":"CVE-2026-41001","file":"openvex/pingauthorize/CVE-2026-41001.openvex.json","product":"pingauthorize","pkg":"spring-boot-autoconfigure","sub":"pkg:maven/org.springframework.boot/spring-boot-autoconfigure","just":"vulnerable_code_not_in_execute_path","notes":"This CVE is not exploitable within the Admin Console because the application does not utilize an embedded Artemis broker; therefore, the required technical prerequisites are not met. The underlying Spring Framework dependencies are scheduled to be updated in version 11.2 of the product."},{"id":"CVE-2026-41001","file":"openvex/pingfederate/CVE-2026-41001.openvex.json","product":"pingfederate","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"Not vulnerable. CVE-2026-41001 is specific to Spring Boot's ArtemisEmbeddedConfigurationFactory, which sets up an embedded Artemis message broker. PingFederate doesn't use: Spring Boot - no spring-boot dependency found in any pom.xml or the dependency dumps in the repo. PingFederate doesn't use: Artemis/ActiveMQ - zero references anywhere in the codebase. There's no embedded message broker in this codebase for the predictable-directory/symlink attack to target, so the code path the CVE describes doesn't exist here."},{"id":"CVE-2026-41178","file":"openvex/pingauthorize/CVE-2026-41178.openvex.json","product":"pingauthorize","pkg":"go","sub":"pkg:golang/github.com/golang/go","just":"component_not_present","notes":"The /usr/local/bin/vault binary is not included in the standard distribution of PingAuthorize and was likely introduced solely during the initial container deployment lifecycle. The product codebase does not invoke this tool at runtime, and there is no vector for a remote attacker to trigger execution. Therefore, these CVEs are not exploitable within the application."},{"id":"CVE-2026-41409","file":"openvex/pingfederate/CVE-2026-41409.openvex.json","product":"pingfederate","pkg":"apache-mina","sub":"pkg:generic/apache-mina","just":"component_not_present","notes":"This vulnerability in Apache MINA involves unsafe deserialization of data via the IoBuffer.getObject() method, which can allow remote code execution if an application processes untrusted serialized input. PingFederate includes Apache MINA version that is within the affected range; however, PingFederate does not use the deserialization functionality associated with this issue (including IoBuffer.getObject() or related serialization codecs). As a result, there is no exploitable attack path in PingFederate. As a best practice and for defense-in-depth, Ping Identity plans to update the MINA dependency to a patched version."},{"id":"CVE-2026-41417","file":"openvex/pingaccess/CVE-2026-41417.openvex.json","product":"pingaccess","pkg":"netty-codec-http","sub":"pkg:maven/io.netty/netty-codec-http","just":"vulnerable_code_not_in_execute_path","notes":"Not exploitable in PingAccess. The flaw requires application code to call setUri() with unvalidated attacker-controlled input after constructing a DefaultHttpRequest, bypassing the request-line validation that constructors apply. In PingAccess the outbound origin request URI is derived from the inbound request-line, which Netty's HttpObjectDecoder validates during parsing (CRLF and whitespace are rejected); PingAccess does not construct DefaultHttpRequest objects with post-validation attacker-controlled URIs on the proxy path. No CRLF injection path exists."},{"id":"CVE-2026-41602","file":"openvex/pingauthorize/CVE-2026-41602.openvex.json","product":"pingauthorize","pkg":"apache-thrift","sub":"pkg:generic/apache-thrift","just":"component_not_present","notes":"Apache Thrift is not a dependency of PingAuthorize or any related products. Consequently, this finding has been determined to be a false positive."},{"id":"CVE-2026-41635","file":"openvex/pingfederate/CVE-2026-41635.openvex.json","product":"pingfederate","pkg":"apache-mina","sub":"pkg:generic/apache-mina","just":"vulnerable_code_not_in_execute_path","notes":"This vulnerability in Apache MINA relates to improper validation during class resolution in deserialization, which could allow unauthorized classes to be instantiated and potentially lead to remote code execution if untrusted serialized data is processed. PingFederate includes Apache MINA version that is within the affected range; however, PingFederate does not invoke any of the deserialization APIs involved in this issue and does not process untrusted serialized input through MINA. Therefore, the vulnerable code path is not reachable, and there is no impact to PingFederate. The MINA dependency will be upgraded in a future release as a precaution."},{"id":"CVE-2026-41706","file":"openvex/pingauthorize/CVE-2026-41706.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"This CVE is not exploitable within the Admin Console because the application does not utilize CookieRequestCache"},{"id":"CVE-2026-41715","file":"openvex/pingauthorize/CVE-2026-41715.openvex.json","product":"pingauthorize","pkg":"reactor-netty-http","sub":"pkg:generic/reactor-netty-http@1.0.45","just":"vulnerable_code_not_in_execute_path","notes":"Neither PingAuthorize nor the Azure SDK enables redirect following. By default, followRedirect()is disabled in reactor-netty, and PingAuthorize does not override this default anywhere within the codebase. Consequently, this CVE is not exploitable."},{"id":"CVE-2026-41838","file":"openvex/pingaccess/CVE-2026-41838.openvex.json","product":"pingaccess","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"component_not_present","notes":"spring-websocket is not included in PingAccess."},{"id":"CVE-2026-41839","file":"openvex/pingaccess/CVE-2026-41839.openvex.json","product":"pingaccess","pkg":"spring-webflux","sub":"pkg:maven/org.springframework/spring-webflux","just":"component_not_present","notes":"PingAccess ships no Spring WebFlux dependency. No spring-webflux or spring-web JAR is present in the PingAccess 8.3.0 install. This is a false positive."},{"id":"CVE-2026-41839","file":"openvex/pingauthorize/CVE-2026-41839.openvex.json","product":"pingauthorize","pkg":"spring-web","sub":"pkg:maven/org.springframework/spring-web","just":"vulnerable_code_not_in_execute_path","notes":"The Admin Console does not utilize Spring WebFlux, which is the primary prerequisite for this vulnerability vector; therefore, the application is not vulnerable."},{"id":"CVE-2026-41840","file":"openvex/pingauthorize/CVE-2026-41840.openvex.json","product":"pingauthorize","pkg":"spring-web","sub":"pkg:maven/org.springframework/spring-web","just":"vulnerable_code_not_in_execute_path","notes":"The Admin Console does not utilize Spring WebFlux, which is the primary prerequisite for this vulnerability vector; therefore, the application is not vulnerable."},{"id":"CVE-2026-41841","file":"openvex/pingauthorize/CVE-2026-41841.openvex.json","product":"pingauthorize","pkg":"spring-webmvc","sub":"pkg:maven/org.springframework/spring-webmvc","just":"vulnerable_code_not_in_execute_path","notes":"This CVE is not exploitable within the Admin Console because it does not configure a shared cache across resource handlers; therefore, the required prerequisites for exploitation are not met. Spring framework dependencies are scheduled to be updated in version 11.2 of the product."},{"id":"CVE-2026-41842","file":"openvex/pingauthorize/CVE-2026-41842.openvex.json","product":"pingauthorize","pkg":"spring-webmvc","sub":"pkg:maven/org.springframework/spring-webmvc","just":"vulnerable_code_not_in_execute_path","notes":"This CVE is not exploitable within the Admin Console because its default resource locations are not filesystem-based. Spring framework dependencies are scheduled to be updated in version 11.2 of the product."},{"id":"CVE-2026-41843","file":"openvex/pingauthorize/CVE-2026-41843.openvex.json","product":"pingauthorize","pkg":"spring-webmvc","sub":"pkg:maven/org.springframework/spring-webmvc","just":"vulnerable_code_not_in_execute_path","notes":"This CVE is not exploitable within Admin Console instances deployed on the embedded PingDirectory / PingAuthorize Jetty server, as Jetty automatically performs URI normalization and validation. Spring framework dependencies are scheduled to be updated in version 11.2 of the product."},{"id":"CVE-2026-41844","file":"openvex/pingauthorize/CVE-2026-41844.openvex.json","product":"pingauthorize","pkg":"spring-webmvc","sub":"pkg:maven/org.springframework/spring-webmvc","just":"vulnerable_code_not_in_execute_path","notes":"The Admin Console does not utilize unnamed mappings for the /** path; therefore, the application is not vulnerable to this exploit vector."},{"id":"CVE-2026-41845","file":"openvex/pingauthorize/CVE-2026-41845.openvex.json","product":"pingauthorize","pkg":"spring-web","sub":"pkg:maven/org.springframework/spring-web","just":"vulnerable_code_not_in_execute_path","notes":"This CVE is not exploitable within the Admin Console because the vulnerable utility method, JavaScriptUtils.javaScriptEscape(), is not invoked or called anywhere within the product codebase."},{"id":"CVE-2026-41846","file":"openvex/pingauthorize/CVE-2026-41846.openvex.json","product":"pingauthorize","pkg":"spring-webmvc","sub":"pkg:maven/org.springframework/spring-webmvc","just":"component_not_present","notes":"The Admin Console application does not use JSP (JavaServer Pages); therefore, this vulnerability is not exploitable."},{"id":"CVE-2026-41848","file":"openvex/pingauthorize/CVE-2026-41848.openvex.json","product":"pingauthorize","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"The vulnerable class (AntPathMatcher) is not utilized or called anywhere within the PingAuthorize. Spring framework dependencies are scheduled to be updated in version 11.2 of the product."},{"id":"CVE-2026-41850","file":"openvex/pingaccess/CVE-2026-41850.openvex.json","product":"pingaccess","pkg":"spring-core","sub":"pkg:maven/org.springframework/spring-core","just":"vulnerable_code_not_in_execute_path","notes":"Not exploitable in PingAccess 8.3.x. CVE-2026-41850 is an algorithmic denial-of-service in Spring SpEL that requires the application to evaluate a specially crafted expression supplied by an attacker. PingAccess does not evaluate SpEL expressions from external or user-controlled sources, so the vulnerable execution path is not reachable. The spring-expression-5.3.33.jar is present in the distribution and contains the SpEL implementation, so the scanner's dependency finding is valid; however, library presence alone does not establish exploitability. Engineering has tracked dependency remediation under PA-16550 and plans to upgrade the Spring dependency in a future PingAccess release. Customers should upgrade to the latest applicable PingAccess maintenance release when available."},{"id":"CVE-2026-41850","file":"
